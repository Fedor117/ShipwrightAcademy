<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-label="A Fade coroutine started in Update runs until yield return null, then resumes once per frame after Update, lowering the sprite alpha from 1.0 to 0 over five frames.">
