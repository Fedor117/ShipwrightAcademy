<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" role="img" aria-label="The fake null: after Destroy, the native object is freed at end of frame while the C# wrapper lives on, so enemy == null is true but ?., is null and ReferenceEquals still see a live reference.">
<style>.unity-fake-null-t{font-size:14px;fill:var(--fig-ink)}.unity-fake-null-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}.unity-fake-null-s{font-size:13px;fill:var(--fig-muted)}.unity-fake-null-m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fig-ink)}.unity-fake-null-s0{animation:unity-fake-null-s0 8s infinite}@keyframes unity-fake-null-s0{0%{opacity:1}46%{opacity:1}47.5%{opacity:0}86.5%{opacity:0}88%{opacity:1}100%{opacity:1}}.unity-fake-null-s1{animation:unity-fake-null-s1 8s infinite}@keyframes unity-fake-null-s1{0%{opacity:0}48.5%{opacity:0}50%{opacity:1}66%{opacity:1}67.5%{opacity:0}100%{opacity:0}}.unity-fake-null-s2{animation:unity-fake-null-s2 8s infinite}@keyframes unity-fake-null-s2{0%{opacity:0}67.5%{opacity:0}69%{opacity:1}85%{opacity:1}86.5%{opacity:0}100%{opacity:0}}.unity-fake-null-alive{animation:unity-fake-null-al 8s infinite}.unity-fake-null-dead{animation:unity-fake-null-de 8s infinite}@keyframes unity-fake-null-al{0%{opacity:0}47.5%{opacity:0}49%{opacity:1}85%{opacity:1}86.5%{opacity:0}100%{opacity:0}}@keyframes unity-fake-null-de{0%{opacity:1}46%{opacity:1}47.5%{opacity:0}86.5%{opacity:0}88%{opacity:1}100%{opacity:1}}</style>
<defs><marker id="unity-fake-null-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--fig-ink)"/></marker></defs><text x="24" y="28" class="unity-fake-null-s">C# (managed heap)</text><text x="372" y="28" class="unity-fake-null-s">engine (native C++)</text><line x1="330" y1="16" x2="330" y2="118" stroke="var(--fig-line)" stroke-dasharray="4 4"/><rect x="24" y="56" width="92" height="36" rx="8" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><text x="70" y="79" class="unity-fake-null-m" text-anchor="middle">enemy</text><line x1="116" y1="74" x2="150" y2="74" stroke="var(--fig-ink)" stroke-width="1.5" marker-end="url(#unity-fake-null-ar)"/><rect x="152" y="46" width="152" height="56" rx="10" fill="var(--fig-panel)" stroke="var(--fig-accent)" stroke-width="1.5"/><text x="228" y="70" class="unity-fake-null-t" text-anchor="middle">Enemy wrapper</text><text x="228" y="90" class="unity-fake-null-s" text-anchor="middle">still alive</text><g class="unity-fake-null-alive" opacity="0"><line x1="304" y1="74" x2="370" y2="74" stroke="var(--fig-ink)" stroke-width="1.5" marker-end="url(#unity-fake-null-ar)"/><rect x="372" y="46" width="220" height="56" rx="10" fill="var(--fig-panel)" stroke="var(--fig-ok)" stroke-width="1.5"/><text x="482" y="70" class="unity-fake-null-t" text-anchor="middle">native Enemy object</text><text x="482" y="90" class="unity-fake-null-s" text-anchor="middle">alive</text></g><g class="unity-fake-null-dead"><line x1="304" y1="74" x2="370" y2="74" stroke="var(--fig-bad)" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="372" y="46" width="220" height="56" rx="10" fill="none" stroke="var(--fig-bad)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="482" y="70" class="unity-fake-null-t" text-anchor="middle" style="fill:var(--fig-bad)">native object freed</text><text x="482" y="90" class="unity-fake-null-s" text-anchor="middle">Destroy ran at end of frame</text></g><text x="320" y="134" class="unity-fake-null-t unity-fake-null-s0" text-anchor="middle" opacity="1">After Destroy and end of frame: the wrapper outlives the native object</text><text x="320" y="134" class="unity-fake-null-t unity-fake-null-s1" text-anchor="middle" opacity="0">Alive: the wrapper points at a live native object</text><text x="320" y="134" class="unity-fake-null-t unity-fake-null-s2" text-anchor="middle" opacity="0">Destroy(enemy) called: native side survives until end of frame</text><text x="24" y="168" class="unity-fake-null-s">Once the native object is freed:</text><rect x="16" y="178" width="608" height="30" rx="8" fill="var(--fig-panel)" fill-opacity="0.9"/><text x="32" y="198" class="unity-fake-null-m">enemy == null</text><circle cx="290" cy="193" r="4" fill="var(--fig-ok)"/><text x="302" y="198" class="unity-fake-null-t">true: Unity’s == asks the engine</text><rect x="16" y="214" width="608" height="30" rx="8" fill="var(--fig-panel)" fill-opacity="0.4"/><text x="32" y="234" class="unity-fake-null-m">enemy?.TakeDamage()</text><circle cx="290" cy="229" r="4" fill="var(--fig-bad)"/><text x="302" y="234" class="unity-fake-null-t">calls it: MissingReferenceException</text><rect x="16" y="250" width="608" height="30" rx="8" fill="var(--fig-panel)" fill-opacity="0.9"/><text x="32" y="270" class="unity-fake-null-m">enemy is null</text><circle cx="290" cy="265" r="4" fill="var(--fig-bad)"/><text x="302" y="270" class="unity-fake-null-t">false: plain C# reference test</text><rect x="16" y="286" width="608" height="30" rx="8" fill="var(--fig-panel)" fill-opacity="0.4"/><text x="32" y="306" class="unity-fake-null-m">ReferenceEquals(enemy, null)</text><circle cx="290" cy="301" r="4" fill="var(--fig-bad)"/><text x="302" y="306" class="unity-fake-null-t">false: plain C# reference test</text>
</svg>
