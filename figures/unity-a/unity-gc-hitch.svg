<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-label="Over 20 seconds at 60 fps, 3.2 KB of garbage per frame piles up to about 1.7 MB, then a GC causes a 25 ms frame over the 16.7 ms budget; with zero allocations the heap and frame time stay flat.">
<style>.unity-gc-hitch-t{font-size:14px;fill:var(--fig-ink)}.unity-gc-hitch-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}.unity-gc-hitch-s{font-size:13px;fill:var(--fig-muted)}.unity-gc-hitch-m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fig-ink)}.unity-gc-hitch-g1{animation:unity-gc-hitch-g1 7s infinite}@keyframes unity-gc-hitch-g1{0%{opacity:0}44.5%{opacity:0}45%{opacity:1}51%{opacity:1}51.5%{opacity:0}100%{opacity:0}}.unity-gc-hitch-g2{animation:unity-gc-hitch-g2 7s infinite}@keyframes unity-gc-hitch-g2{0%{opacity:0}89.5%{opacity:0}90%{opacity:1}96%{opacity:1}96.5%{opacity:0}100%{opacity:0}}.unity-gc-hitch-ph{animation:unity-gc-hitch-ph 7s linear infinite}@keyframes unity-gc-hitch-ph{0%{transform:translateX(0)}100%{transform:translateX(256px)}}</style>
