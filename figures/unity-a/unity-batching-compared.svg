<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" role="img" aria-label="Four batching techniques compared: static and dynamic batching merge different meshes into one draw, GPU instancing draws one mesh many times in one call, and the SRP Batcher keeps separate draws but needs only one SetPass.">
<style>.unity-batching-compared-t{font-size:14px;fill:var(--fig-ink)}.unity-batching-compared-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}.unity-batching-compared-s{font-size:13px;fill:var(--fig-muted)}.unity-batching-compared-m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fig-ink)}.unity-batching-compared-i0{animation:unity-batching-compared-i0 6s ease-in-out infinite}@keyframes unity-batching-compared-i0{0%{transform:translateX(0)}15%{transform:translateX(0)}35%{transform:translateX(27px)}80%{transform:translateX(27px)}95%{transform:translateX(0)}100%{transform:translateX(0)}}.unity-batching-compared-i1{animation:unity-batching-compared-i1 6s ease-in-out infinite}@keyframes unity-batching-compared-i1{0%{transform:translateX(0)}15%{transform:translateX(0)}35%{transform:translateX(9px)}80%{transform:translateX(9px)}95%{transform:translateX(0)}100%{transform:translateX(0)}}.unity-batching-compared-i2{animation:unity-batching-compared-i2 6s ease-in-out infinite}@keyframes unity-batching-compared-i2{0%{transform:translateX(0)}15%{transform:translateX(0)}35%{transform:translateX(-9px)}80%{transform:translateX(-9px)}95%{transform:translateX(0)}100%{transform:translateX(0)}}.unity-batching-compared-i3{animation:unity-batching-compared-i3 6s ease-in-out infinite}@keyframes unity-batching-compared-i3{0%{transform:translateX(0)}15%{transform:translateX(0)}35%{transform:translateX(-27px)}80%{transform:translateX(-27px)}95%{transform:translateX(0)}100%{transform:translateX(0)}}.unity-batching-compared-box{animation:unity-batching-compared-box 6s infinite}@keyframes unity-batching-compared-box{0%{opacity:0}34%{opacity:0}36%{opacity:1}80%{opacity:1}82%{opacity:0}100%{opacity:0}}</style>
<defs><marker id="unity-batching-compared-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--fig-muted)"/></marker></defs><text x="264" y="22" class="unity-batching-compared-s" text-anchor="middle">separate renderers</text><text x="392" y="22" class="unity-batching-compared-s">what the CPU submits</text><text x="16" y="61" class="unity-batching-compared-b">Static batching</text><text x="16" y="79" class="unity-batching-compared-s">Batching Static objects</text><rect x="202" y="44" width="124" height="40" rx="10" fill="none" stroke="var(--fig-accent)" stroke-width="2" opacity="0" class="unity-batching-compared-box"/><g class="unity-batching-compared-i0"><rect x="180" y="52" width="24" height="24" rx="4" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i1"><circle cx="240" cy="64" r="12" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i2"><path d="M288 52L300 76H276Z" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="unity-batching-compared-i3"><path d="M336 52L348 64L336 76L324 64Z" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5" stroke-linejoin="round"/></g><line x1="364" y1="64" x2="384" y2="64" stroke="var(--fig-muted)" stroke-width="1.5" marker-end="url(#unity-batching-compared-ar)"/><text x="392" y="61" class="unity-batching-compared-b">1 draw over combined buffers</text><text x="392" y="79" class="unity-batching-compared-s">built at build time, cannot move</text><line x1="16" y1="107" x2="624" y2="107" stroke="var(--fig-line)"/><text x="16" y="147" class="unity-batching-compared-b">Dynamic batching</text><text x="16" y="165" class="unity-batching-compared-s">small meshes</text><rect x="202" y="130" width="124" height="40" rx="10" fill="none" stroke="var(--fig-accent)" stroke-width="2" opacity="0" class="unity-batching-compared-box"/><g class="unity-batching-compared-i0"><rect x="183" y="141" width="18" height="18" rx="4" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i1"><circle cx="240" cy="150" r="9" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i2"><path d="M288 141L297 159H279Z" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5" stroke-linejoin="round"/></g><g class="unity-batching-compared-i3"><path d="M336 141L345 150L336 159L327 150Z" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5" stroke-linejoin="round"/></g><line x1="364" y1="150" x2="384" y2="150" stroke="var(--fig-muted)" stroke-width="1.5" marker-end="url(#unity-batching-compared-ar)"/><text x="392" y="147" class="unity-batching-compared-b">1 draw, rebuilt every frame</text><text x="392" y="165" class="unity-batching-compared-s">CPU vertex work, off in URP</text><line x1="16" y1="193" x2="624" y2="193" stroke="var(--fig-line)"/><text x="16" y="233" class="unity-batching-compared-b">GPU instancing</text><text x="16" y="251" class="unity-batching-compared-s">same mesh + material</text><rect x="202" y="216" width="124" height="40" rx="10" fill="none" stroke="var(--fig-accent)" stroke-width="2" opacity="0" class="unity-batching-compared-box"/><g class="unity-batching-compared-i0"><circle cx="192" cy="236" r="12" fill="var(--fig-accent)" fill-opacity="0.2" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i1"><circle cx="240" cy="236" r="12" fill="var(--fig-accent)" fill-opacity="0.45" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i2"><circle cx="288" cy="236" r="12" fill="var(--fig-accent)" fill-opacity="0.7" stroke="var(--fig-accent)" stroke-width="1.5"/></g><g class="unity-batching-compared-i3"><circle cx="336" cy="236" r="12" fill="var(--fig-accent)" fill-opacity="0.95" stroke="var(--fig-accent)" stroke-width="1.5"/></g><line x1="364" y1="236" x2="384" y2="236" stroke="var(--fig-muted)" stroke-width="1.5" marker-end="url(#unity-batching-compared-ar)"/><text x="392" y="233" class="unity-batching-compared-b">1 instanced call</text><text x="392" y="251" class="unity-batching-compared-s">per-instance transform, colour</text><line x1="16" y1="279" x2="624" y2="279" stroke="var(--fig-line)"/><text x="16" y="319" class="unity-batching-compared-b">SRP Batcher</text><text x="16" y="337" class="unity-batching-compared-s">same shader variant</text><rect x="178" y="296" width="182" height="52" rx="12" fill="none" stroke="var(--fig-ok)" stroke-width="2" stroke-dasharray="5 4" opacity="0" class="unity-batching-compared-box"/><rect x="180" y="310" width="24" height="24" rx="5" fill="var(--fig-accent)" fill-opacity="0.25" stroke="var(--fig-accent)" stroke-width="1.5"/><rect x="228" y="310" width="24" height="24" rx="5" fill="var(--fig-accent2)" fill-opacity="0.25" stroke="var(--fig-accent2)" stroke-width="1.5"/><rect x="276" y="310" width="24" height="24" rx="5" fill="var(--fig-accent)" fill-opacity="0.6" stroke="var(--fig-accent)" stroke-width="1.5"/><rect x="324" y="310" width="24" height="24" rx="5" fill="var(--fig-accent2)" fill-opacity="0.6" stroke="var(--fig-accent2)" stroke-width="1.5"/><line x1="364" y1="322" x2="384" y2="322" stroke="var(--fig-muted)" stroke-width="1.5" marker-end="url(#unity-batching-compared-ar)"/><text x="392" y="319" class="unity-batching-compared-b">4 draws, 1 SetPass</text><text x="392" y="337" class="unity-batching-compared-s">materials stay on the GPU</text>
</svg>
