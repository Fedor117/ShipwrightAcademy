<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" role="img" aria-label="Unity serializer walking a class: public and [SerializeField] fields, auto-property backing fields, List and [Serializable] classes are saved; private, static, readonly, properties and Dictionary are skipped.">
<style>.unity-serialization-rules-t{font-size:14px;fill:var(--fig-ink)}.unity-serialization-rules-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}.unity-serialization-rules-s{font-size:13px;fill:var(--fig-muted)}.unity-serialization-rules-m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fig-ink)}.unity-serialization-rules-hl{animation:unity-serialization-rules-hl 8s step-end infinite}@keyframes unity-serialization-rules-hl{0%{transform:translateY(0px)}10%{transform:translateY(30px)}20%{transform:translateY(60px)}30%{transform:translateY(90px)}40%{transform:translateY(120px)}50%{transform:translateY(150px)}60%{transform:translateY(180px)}70%{transform:translateY(210px)}80%{transform:translateY(240px)}90%{transform:translateY(270px)}100%{transform:translateY(270px)}}</style>
<text x="32" y="28" class="unity-serialization-rules-s">field declaration</text><text x="436" y="28" class="unity-serialization-rules-s">Unity serializer</text><rect x="16" y="40" width="608" height="28" rx="7" fill="var(--fig-accent)" fill-opacity="0.12" stroke="var(--fig-accent)" stroke-width="1.5" class="unity-serialization-rules-hl"/><text x="32" y="59" class="unity-serialization-rules-m">public float speed = 5;</text><circle cx="428" cy="54" r="4.5" fill="var(--fig-ok)"/><text x="440" y="59" class="unity-serialization-rules-t">saved</text><rect x="16" y="70" width="608" height="28" rx="7" fill="var(--fig-panel)" fill-opacity="0.7"/><text x="32" y="89" class="unity-serialization-rules-m">[SerializeField] int ammo;</text><circle cx="428" cy="84" r="4.5" fill="var(--fig-ok)"/><text x="440" y="89" class="unity-serialization-rules-t">saved: private but marked</text><text x="32" y="119" class="unity-serialization-rules-m" style="fill:var(--fig-muted)">int cache;</text><circle cx="428" cy="114" r="4.5" fill="var(--fig-bad)"/><text x="440" y="119" class="unity-serialization-rules-t" style="fill:var(--fig-muted)">skipped: private</text><rect x="16" y="130" width="608" height="28" rx="7" fill="var(--fig-panel)" fill-opacity="0.7"/><text x="32" y="149" class="unity-serialization-rules-m" style="fill:var(--fig-muted)">public static int count;</text><circle cx="428" cy="144" r="4.5" fill="var(--fig-bad)"/><text x="440" y="149" class="unity-serialization-rules-t" style="fill:var(--fig-muted)">skipped: static</text><text x="32" y="179" class="unity-serialization-rules-m" style="fill:var(--fig-muted)">public readonly int max;</text><circle cx="428" cy="174" r="4.5" fill="var(--fig-bad)"/><text x="440" y="179" class="unity-serialization-rules-t" style="fill:var(--fig-muted)">skipped: readonly</text><rect x="16" y="190" width="608" height="28" rx="7" fill="var(--fig-panel)" fill-opacity="0.7"/><text x="32" y="209" class="unity-serialization-rules-m" style="fill:var(--fig-muted)">public int Hp { get; set; }</text><circle cx="428" cy="204" r="4.5" fill="var(--fig-bad)"/><text x="440" y="209" class="unity-serialization-rules-t" style="fill:var(--fig-muted)">skipped: property</text><text x="32" y="239" class="unity-serialization-rules-m">[field: SerializeField] int Armor { get; set; }</text><circle cx="428" cy="234" r="4.5" fill="var(--fig-ok)"/><text x="440" y="239" class="unity-serialization-rules-t">saved: backing field</text><rect x="16" y="250" width="608" height="28" rx="7" fill="var(--fig-panel)" fill-opacity="0.7"/><text x="32" y="269" class="unity-serialization-rules-m" style="fill:var(--fig-muted)">public Dictionary&lt;string, int&gt; map;</text><circle cx="428" cy="264" r="4.5" fill="var(--fig-bad)"/><text x="440" y="269" class="unity-serialization-rules-t" style="fill:var(--fig-muted)">skipped: Dictionary</text><text x="32" y="299" class="unity-serialization-rules-m">public List&lt;Weapon&gt; loadout;</text><circle cx="428" cy="294" r="4.5" fill="var(--fig-ok)"/><text x="440" y="299" class="unity-serialization-rules-t">saved: List&lt;T&gt;</text><rect x="16" y="310" width="608" height="28" rx="7" fill="var(--fig-panel)" fill-opacity="0.7"/><text x="32" y="329" class="unity-serialization-rules-m">public Weapon weapon;</text><circle cx="428" cy="324" r="4.5" fill="var(--fig-ok)"/><text x="440" y="329" class="unity-serialization-rules-t">saved inline, by value</text><text x="32" y="362" class="unity-serialization-rules-s">Weapon is a [Serializable] class: no null, no polymorphism, no shared references</text>
</svg>
