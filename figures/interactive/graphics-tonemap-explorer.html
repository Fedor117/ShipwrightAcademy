<style>
.w { display: flex; flex-direction: column; height: 100%; gap: 8px; }
svg { flex: 1; min-height: 0; width: 100%; display: block; }
.g { stroke: var(--fig-line); stroke-width: 1; }
.ax { stroke: var(--fig-muted); stroke-width: 1.5; }
.m { fill: var(--fig-muted); font-size: 12px; }
.t { fill: var(--fig-ink); font-size: 13px; }
.mid { text-anchor: middle; } .end { text-anchor: end; }
.cv { fill: none; stroke-width: 3; stroke-linejoin: round; }
.k0 { stroke: var(--fig-bad); } .k1 { stroke: var(--fig-accent2); } .k2 { stroke: var(--fig-accent); }
.d0 { fill: var(--fig-bad); } .d1 { fill: var(--fig-accent2); } .d2 { fill: var(--fig-accent); }
.probe { stroke: var(--fig-ink); stroke-dasharray: 4 4; stroke-opacity: .5; }
.c { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
.c input { width: 100%; }
output { font-variant-numeric: tabular-nums; color: var(--fig-muted); }
</style>
<div class="w">
<svg viewBox="0 0 640 300" role="img" aria-label="Display value against HDR scene value from 0 to 8 for three operators: clamp, Reinhard and an ACES fit, after the chosen exposure. A dashed probe line reads off each operator's output.">
  <g id="grid"></g>
  <line class="ax" x1="60" y1="250" x2="460" y2="250"/><line class="ax" x1="60" y1="250" x2="60" y2="40"/>
  <text class="m end" x="52" y="54">1.0</text><text class="m end" x="52" y="154">0.5</text><text class="m end" x="52" y="254">0</text>
  <text class="m mid" x="260" y="290">scene value (linear HDR, before exposure)</text>
  <path id="p0" class="cv k0"/><path id="p1" class="cv k1"/><path id="p2" class="cv k2"/>
  <line id="probe" class="probe" y1="40" y2="250"/>
  <circle id="d0" class="d0" r="5"/><circle id="d1" class="d1" r="5"/><circle id="d2" class="d2" r="5"/>
  <rect class="d0" x="480" y="40" width="14" height="4" rx="2"/><text class="t" x="502" y="46">clamp</text><text id="v0" class="t end" x="634" y="46"></text>
  <rect class="d1" x="480" y="64" width="14" height="4" rx="2"/><text class="t" x="502" y="70">Reinhard</text><text id="v1" class="t end" x="634" y="70"></text>
  <rect class="d2" x="480" y="88" width="14" height="4" rx="2"/><text class="t" x="502" y="94">ACES (fit)</text><text id="v2" class="t end" x="634" y="94"></text>
  <text class="m" x="480" y="134">Turns pure white above</text>
  <text class="m" x="480" y="154">scene value:</text>
  <text class="t" x="480" y="178">clamp</text><text id="w0" class="t end" x="634" y="178"></text>
  <text class="t" x="480" y="198">Reinhard</text><text class="t end" x="634" y="198">never</text>
  <text class="t" x="480" y="218">ACES (fit)</text><text id="w2" class="t end" x="634" y="218"></text>
  <text class="m" x="480" y="250">x = scene × 2^EV</text>
</svg>
<div class="c">
  <label for="ev">Exposure</label><input id="ev" type="range" min="-2" max="3" step="0.5" value="0"><output id="evo" for="ev"></output>
  <label for="sv">Probe</label><input id="sv" type="range" min="0" max="8" step="0.1" value="4"><output id="svo" for="sv"></output>
</div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ops = [
    function (x) { return Math.min(1, x); },
    function (x) { return x / (1 + x); },
    function (x) { return Math.min(1, Math.max(0, x * (2.51 * x + 0.03) / (x * (2.43 * x + 0.59) + 0.14))); }
  ];
  var X = function (s) { return 60 + s * 50; }, Y = function (v) { return 250 - v * 200; };
  var grid = '';
  for (var i = 1; i <= 8; i++) grid += '<line class="g" x1="' + X(i) + '" y1="40" x2="' + X(i) + '" y2="250"/><text class="m mid" x="' + X(i) + '" y="270">' + i + '</text>';
  grid += '<line class="g" x1="60" y1="150" x2="460" y2="150"/><line class="g" x1="60" y1="50" x2="460" y2="50"/><text class="m mid" x="60" y="270">0</text>';
  $('grid').innerHTML = grid;
  function draw() {
    var ev = +$('ev').value, e = Math.pow(2, ev), s = +$('sv').value;
    ops.forEach(function (f, k) {
      var d = '';
      for (var j = 0; j <= 160; j++) { var x = j / 20; d += (j ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x * e)).toFixed(1); }
      $('p' + k).setAttribute('d', d);
      var v = f(s * e);
      $('d' + k).setAttribute('cx', X(s)); $('d' + k).setAttribute('cy', Y(v));
      $('v' + k).textContent = v.toFixed(2) + (k !== 1 && v >= 1 ? ' clipped' : '');
    });
    $('probe').setAttribute('x1', X(s)); $('probe').setAttribute('x2', X(s));
    $('w0').textContent = (1 / e).toFixed(2);
    $('w2').textContent = (7.24 / e).toFixed(2);
    $('evo').textContent = (ev > 0 ? '+' : ev < 0 ? '−' : '±') + Math.abs(ev).toFixed(1) + ' EV (×' + e.toFixed(2) + ')';
    $('svo').textContent = 'scene ' + s.toFixed(1);
  }
  $('ev').addEventListener('input', draw); $('sv').addEventListener('input', draw);
  draw();
})();
</script>
