<style>
.w { display: flex; flex-direction: column; height: 100%; gap: 8px; }
svg { flex: 1; min-height: 0; width: 100%; display: block; }
.cell { fill: var(--fig-bg); stroke: var(--fig-line); stroke-width: 1; }
.wall { fill: var(--fig-ink); fill-opacity: .7; }
.open { fill: var(--fig-accent); fill-opacity: .28; }
.closed { fill: var(--fig-muted); fill-opacity: .3; }
.path { fill: var(--fig-ok); fill-opacity: .55; }
.cur { fill: none; stroke: var(--fig-warn); stroke-width: 3.5; }
.nx { fill: none; stroke: var(--fig-accent); stroke-width: 2.5; stroke-dasharray: 4 3; }
.L { fill: var(--fig-ink); font-size: 18px; font-weight: 700; text-anchor: middle; }
.f { fill: var(--fig-ink); font-size: 11px; text-anchor: middle; font-variant-numeric: tabular-nums; }
.t { fill: var(--fig-ink); font-size: 13px; }
.m { fill: var(--fig-muted); font-size: 12px; }
.c { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
output { color: var(--fig-muted); font-variant-numeric: tabular-nums; }
</style>
<div class="w">
<svg viewBox="0 0 640 300" role="img" aria-label="A* on a 12 by 7 four-connected grid with a wall between start S and goal G. Each step expands the open node with the lowest f = g + h, moves it to the closed set and adds its neighbours to the open set, until the goal is expanded and the path is traced back.">
  <g id="grid"></g>
  <rect class="open" x="500" y="20" width="14" height="14" rx="2"/><text class="t" x="522" y="32">open set</text>
  <rect class="closed" x="500" y="42" width="14" height="14" rx="2"/><text class="t" x="522" y="54">closed set</text>
  <rect class="cur" x="501" y="65" width="12" height="12" rx="2"/><text class="t" x="522" y="76">just expanded</text>
  <rect class="nx" x="501" y="87" width="12" height="12" rx="2"/><text class="t" x="522" y="98">next (lowest f)</text>
  <rect class="path" x="500" y="108" width="14" height="14" rx="2"/><text class="t" x="522" y="120">path</text>
  <text class="t" x="500" y="152">f = g + h</text>
  <text class="m" x="500" y="170">g: steps from S</text>
  <text class="m" x="500" y="186">h: Manhattan to G</text>
  <text class="m" x="500" y="202">ties: lower h first</text>
  <text id="s1" class="t" x="500" y="232"></text>
  <text id="s2" class="m" x="500" y="252"></text>
  <text id="s3" class="m" x="500" y="270"></text>
  <text id="s4" class="m" x="500" y="288"></text>
</svg>
<div class="c">
  <button id="step" type="button">Step</button>
  <button id="run" type="button">Run</button>
  <button id="reset" type="button">Reset</button>
  <output id="say" aria-live="polite"></output>
</div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var W = 12, H = 7, C = 40, S = [2, 3], G = [10, 2];
  var walls = {}; [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5], [7, 1], [8, 1]].forEach(function (p) { walls[p] = 1; });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var st, timer = null;
  var h = function (p) { return Math.abs(p[0] - G[0]) + Math.abs(p[1] - G[1]); };
  function reset() {
    stop();
    st = { open: [{ p: S, g: 0, h: h(S), from: null, seq: 0 }], closed: {}, nodes: {}, cur: null, done: false, path: [], expanded: 0, seq: 1 };
    st.nodes[S] = st.open[0];
    draw('Ready: S is in the open set with g 0, h ' + h(S) + ', f ' + h(S) + '.');
  }
  var better = function (a, b) { return a.g + a.h - (b.g + b.h) || a.h - b.h || a.seq - b.seq; };
  function best() { return st.open.slice().sort(better)[0]; }
  function step() {
    if (st.done) return;
    if (!st.open.length) { st.done = true; draw('Open set empty: no path.'); return; }
    var n = best();
    st.open.splice(st.open.indexOf(n), 1);
    st.closed[n.p] = n; st.cur = n; st.expanded++;
    if (n.p[0] === G[0] && n.p[1] === G[1]) {
      st.done = true;
      for (var q = n; q; q = q.from) st.path.push(q.p);
      stop();
      draw('Goal expanded after ' + st.expanded + ' steps. Path cost ' + n.g + '.');
      return;
    }
    var added = 0;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
      var p = [n.p[0] + d[0], n.p[1] + d[1]];
      if (p[0] < 0 || p[1] < 0 || p[0] >= W || p[1] >= H || walls[p] || st.closed[p]) return;
      var g = n.g + 1, o = st.nodes[p];
      if (!o) { o = st.nodes[p] = { p: p, g: g, h: h(p), from: n, seq: st.seq++ }; st.open.push(o); added++; }
      else if (g < o.g) { o.g = g; o.from = n; }
    });
    draw('Expanded (' + n.p + '): g ' + n.g + ' + h ' + n.h + ' = f ' + (n.g + n.h) + '. Added ' + added + ' to open.');
  }
  function stop() { if (timer) clearInterval(timer); timer = null; $('run').textContent = 'Run'; }
  function run() {
    if (timer) return stop();
    if (reduce) { while (!st.done) step(); return; }
    $('run').textContent = 'Pause';
    timer = setInterval(function () { step(); if (st.done) stop(); }, 220);
  }
  function draw(msg) {
    var nx = st.done ? null : best(), onPath = {}, out = '';
    st.path.forEach(function (p) { onPath[p] = 1; });
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var k = [x, y], X = 10 + x * C, Y = 10 + y * C, n = st.nodes[k];
      var cls = walls[k] ? 'wall' : onPath[k] ? 'path' : st.closed[k] ? 'closed' : n ? 'open' : '';
      out += '<rect class="cell" x="' + X + '" y="' + Y + '" width="' + C + '" height="' + C + '"/>';
      if (cls) out += '<rect class="' + cls + '" x="' + X + '" y="' + Y + '" width="' + C + '" height="' + C + '"/>';
      var lab = x === S[0] && y === S[1] ? 'S' : x === G[0] && y === G[1] ? 'G' : '';
      if (lab) out += '<text class="L" x="' + (X + 20) + '" y="' + (Y + (n ? 21 : 27)) + '">' + lab + '</text>';
      if (n && !walls[k]) out += '<text class="f" x="' + (X + 20) + '" y="' + (Y + (lab ? 35 : 25)) + '">' + (n.g + n.h) + '</text>';
    }
    if (st.cur) out += '<rect class="cur" x="' + (12 + st.cur.p[0] * C) + '" y="' + (12 + st.cur.p[1] * C) + '" width="' + (C - 4) + '" height="' + (C - 4) + '"/>';
    if (nx) out += '<rect class="nx" x="' + (14 + nx.p[0] * C) + '" y="' + (14 + nx.p[1] * C) + '" width="' + (C - 8) + '" height="' + (C - 8) + '"/>';
    $('grid').innerHTML = out;
    $('s1').textContent = 'Expanded: ' + st.expanded;
    $('s2').textContent = 'Open: ' + st.open.length + '   Closed: ' + Object.keys(st.closed).length;
    $('s3').textContent = st.cur ? 'Last: g ' + st.cur.g + ' + h ' + st.cur.h + ' = f ' + (st.cur.g + st.cur.h) : 'Last: none';
    $('s4').textContent = nx ? 'Next: f ' + (nx.g + nx.h) + ' (h ' + nx.h + ')' : st.path.length ? 'Path length: ' + (st.path.length - 1) : '';
    $('say').textContent = msg;
    $('step').disabled = $('run').disabled = st.done;
  }
  $('step').addEventListener('click', function () { stop(); step(); });
  $('run').addEventListener('click', run);
  $('reset').addEventListener('click', reset);
  reset();
})();
</script>
