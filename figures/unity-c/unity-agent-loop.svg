<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Agent loop in a Unity project: edit C#, recompile, run EditMode tests, run C# in the live Editor via MCP, verify, repeat. Outside the loop: never hand-edit scene or prefab YAML, create or rename .meta files, or move assets in a shell.">
<style>
.unity-agent-loop-t{font-size:14px;fill:var(--fig-ink);font-weight:600}
.unity-agent-loop-h{font-size:13px;fill:var(--fig-ink)}
.unity-agent-loop-s{font-size:12px;fill:var(--fig-muted)}
.unity-agent-loop-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.unity-agent-loop-ar{stroke:var(--fig-muted);stroke-width:1.75;fill:none}
.unity-agent-loop-g{fill:none;stroke:var(--fig-accent);stroke-width:3;opacity:0;animation:unity-agent-loop-on 7.5s ease-in-out infinite}
.unity-agent-loop-ck{font-size:20px;font-weight:700;fill:var(--fig-ok);opacity:0;animation:unity-agent-loop-on 7.5s ease-in-out infinite}
@keyframes unity-agent-loop-on{0%{opacity:0}3%,17%{opacity:1}20%,100%{opacity:0}}
</style>
<defs><marker id="unity-agent-loop-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--fig-muted)"/></marker></defs>
<text class="unity-agent-loop-s" x="16" y="30">Inspect, change, verify, against the live Editor</text>
<rect class="unity-agent-loop-box" x="16" y="48" width="180" height="56" rx="12"/><text class="unity-agent-loop-t" x="30" y="72">Edit C#</text><text class="unity-agent-loop-s" x="30" y="91">Unity APIs, not YAML</text><rect class="unity-agent-loop-g" x="13" y="45" width="186" height="62" rx="14" style="animation-delay:0.0s"/><rect class="unity-agent-loop-box" x="230" y="48" width="180" height="56" rx="12"/><text class="unity-agent-loop-t" x="244" y="72">Recompile</text><text class="unity-agent-loop-s" x="244" y="91">check console errors</text><rect class="unity-agent-loop-g" x="227" y="45" width="186" height="62" rx="14" style="animation-delay:1.5s"/><rect class="unity-agent-loop-box" x="444" y="48" width="180" height="56" rx="12"/><text class="unity-agent-loop-t" x="458" y="72">Run EditMode tests</text><text class="unity-agent-loop-s" x="458" y="91">-runTests, read the XML</text><rect class="unity-agent-loop-g" x="441" y="45" width="186" height="62" rx="14" style="animation-delay:3.0s"/><rect class="unity-agent-loop-box" x="444" y="150" width="180" height="56" rx="12"/><text class="unity-agent-loop-t" x="458" y="174" style="font-size:13px">Run C# in the Editor</text><text class="unity-agent-loop-s" x="458" y="193">via MCP: hierarchy</text><rect class="unity-agent-loop-g" x="441" y="147" width="186" height="62" rx="14" style="animation-delay:4.5s"/><rect class="unity-agent-loop-box" x="230" y="150" width="180" height="56" rx="12"/><text class="unity-agent-loop-t" x="244" y="174">Verify</text><text class="unity-agent-loop-s" x="244" y="193">validator + tests pass</text><rect class="unity-agent-loop-g" x="227" y="147" width="186" height="62" rx="14" style="animation-delay:6.0s"/><text class="unity-agent-loop-ck" x="396" y="182" text-anchor="middle" style="animation-delay:6s">✓</text><line class="unity-agent-loop-ar" x1="198" y1="76" x2="226" y2="76" marker-end="url(#unity-agent-loop-a)"/><line class="unity-agent-loop-ar" x1="412" y1="76" x2="440" y2="76" marker-end="url(#unity-agent-loop-a)"/><line class="unity-agent-loop-ar" x1="534" y1="106" x2="534" y2="146" marker-end="url(#unity-agent-loop-a)"/><line class="unity-agent-loop-ar" x1="442" y1="178" x2="414" y2="178" marker-end="url(#unity-agent-loop-a)"/><path class="unity-agent-loop-ar" d="M228 178H106V110" marker-end="url(#unity-agent-loop-a)"/><text class="unity-agent-loop-s" x="167" y="170" text-anchor="middle">repeat</text><rect x="16" y="258" width="196" height="32" rx="10" style="fill:var(--fig-bad);fill-opacity:.1;stroke:var(--fig-bad);stroke-width:1.5"/><text class="unity-agent-loop-h" x="114" y="279" text-anchor="middle">hand-edit .unity / .prefab</text><rect x="222" y="258" width="196" height="32" rx="10" style="fill:var(--fig-bad);fill-opacity:.1;stroke:var(--fig-bad);stroke-width:1.5"/><text class="unity-agent-loop-h" x="320" y="279" text-anchor="middle">create or rename .meta</text><rect x="428" y="258" width="196" height="32" rx="10" style="fill:var(--fig-bad);fill-opacity:.1;stroke:var(--fig-bad);stroke-width:1.5"/><text class="unity-agent-loop-h" x="526" y="279" text-anchor="middle">mv assets in a shell</text>
<line x1="16" y1="226" x2="624" y2="226" style="stroke:var(--fig-line);stroke-width:1"/>
<text x="16" y="248" style="font-size:13px;font-weight:700;fill:var(--fig-bad)">Never, by hand or by shell</text>
<text class="unity-agent-loop-s" x="16" y="314">Move and rename through AssetDatabase.MoveAsset, which keeps the GUID.</text>
</svg>