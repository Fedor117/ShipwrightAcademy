<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Ours adds a BoxCollider and lists it on the GameObject; Theirs changes speed. A line-based merge loses the m_Component entry and orphans the collider; UnityYAMLMerge matches objects by fileID and keeps both changes.">
<style>
.unity-smart-merge-s{font-size:12px;fill:var(--fig-muted)}
.unity-smart-merge-c{font-size:12px;fill:var(--fig-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.unity-smart-merge-panel{fill:none;stroke:var(--fig-line);stroke-width:1.5}
.unity-smart-merge-pl{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.unity-smart-merge-none{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.unity-smart-merge-acc{fill:var(--fig-accent);fill-opacity:.14;stroke:var(--fig-accent);stroke-width:1.5}
.unity-smart-merge-acc2{fill:var(--fig-accent2);fill-opacity:.14;stroke:var(--fig-accent2);stroke-width:1.5}
.unity-smart-merge-ok{fill:var(--fig-ok);fill-opacity:.12;stroke:var(--fig-ok);stroke-width:1.5}
.unity-smart-merge-bad{fill:var(--fig-bad);fill-opacity:.12;stroke:var(--fig-bad);stroke-width:1.5}
.unity-smart-merge-ar{stroke:var(--fig-muted);stroke-width:1.75;fill:none}
.unity-smart-merge-g{fill:none;stroke:var(--fig-ink);stroke-width:2.5;opacity:0;animation:unity-smart-merge-hl 6s ease-in-out infinite}
@keyframes unity-smart-merge-hl{0%{opacity:0}5%,26%{opacity:.8}32%,100%{opacity:0}}
</style>
<defs><marker id="unity-smart-merge-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--fig-muted)"/></marker></defs>
<rect class="unity-smart-merge-panel" x="16" y="24" width="288" height="156" rx="12"/><text x="28" y="46" style="font-size:14px;font-weight:700;fill:var(--fig-ink)">Ours</text><rect class="unity-smart-merge-acc" x="28" y="58" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="77">&amp;100 GameObject m_Component +&amp;300</text><rect class="unity-smart-merge-g" x="25" y="55" width="270" height="34" rx="10" style="animation-delay:0s"/><rect class="unity-smart-merge-pl" x="28" y="94" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="113">&amp;114 Player speed: 6.5</text><rect class="unity-smart-merge-g" x="25" y="91" width="270" height="34" rx="10" style="animation-delay:2s"/><rect class="unity-smart-merge-acc" x="28" y="130" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="149">&amp;300 BoxCollider (new)</text><rect class="unity-smart-merge-g" x="25" y="127" width="270" height="34" rx="10" style="animation-delay:4s"/><rect class="unity-smart-merge-panel" x="336" y="24" width="288" height="156" rx="12"/><text x="348" y="46" style="font-size:14px;font-weight:700;fill:var(--fig-ink)">Theirs</text><rect class="unity-smart-merge-pl" x="348" y="58" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="77">&amp;100 GameObject</text><rect class="unity-smart-merge-g" x="345" y="55" width="270" height="34" rx="10" style="animation-delay:0s"/><rect class="unity-smart-merge-acc2" x="348" y="94" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="113">&amp;114 Player speed: 8</text><rect class="unity-smart-merge-g" x="345" y="91" width="270" height="34" rx="10" style="animation-delay:2s"/><rect class="unity-smart-merge-none" x="348" y="130" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="149">&amp;300 not in this branch</text><rect class="unity-smart-merge-g" x="345" y="127" width="270" height="34" rx="10" style="animation-delay:4s"/><line class="unity-smart-merge-ar" x1="160" y1="184" x2="160" y2="208" marker-end="url(#unity-smart-merge-a)"/><line class="unity-smart-merge-ar" x1="480" y1="184" x2="480" y2="208" marker-end="url(#unity-smart-merge-a)"/><text class="unity-smart-merge-s" x="320" y="199" text-anchor="middle">merge Ours + Theirs</text><rect class="unity-smart-merge-panel" x="16" y="214" width="288" height="156" rx="12"/><text x="28" y="236" style="font-size:14px;font-weight:700;fill:var(--fig-bad)">Line-based text merge</text><rect class="unity-smart-merge-bad" x="28" y="248" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="267">&amp;100 GameObject m_Component: lost</text><rect class="unity-smart-merge-pl" x="28" y="284" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="303">&amp;114 Player speed: 8</text><rect class="unity-smart-merge-bad" x="28" y="320" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="38" y="339">&amp;300 BoxCollider, orphaned</text><rect class="unity-smart-merge-panel" x="336" y="214" width="288" height="156" rx="12"/><text x="348" y="236" style="font-size:14px;font-weight:700;fill:var(--fig-ok)">UnityYAMLMerge (Smart Merge)</text><rect class="unity-smart-merge-ok" x="348" y="248" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="267">&amp;100 GameObject m_Component +&amp;300</text><rect class="unity-smart-merge-g" x="345" y="245" width="270" height="34" rx="10" style="animation-delay:0s"/><rect class="unity-smart-merge-ok" x="348" y="284" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="303">&amp;114 Player speed: 8</text><rect class="unity-smart-merge-g" x="345" y="281" width="270" height="34" rx="10" style="animation-delay:2s"/><rect class="unity-smart-merge-ok" x="348" y="320" width="264" height="28" rx="8"/><text class="unity-smart-merge-c" x="358" y="339">&amp;300 BoxCollider</text><rect class="unity-smart-merge-g" x="345" y="317" width="270" height="34" rx="10" style="animation-delay:4s"/>
</svg>