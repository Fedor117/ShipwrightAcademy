<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="A scene references a script by the GUID in its .meta file. Renaming in the Editor keeps GUID 3f2a so the reference survives; renaming with mv in a shell leaves the meta behind, Unity generates GUID 7b1e and the scene shows a missing script.">
<style>
.unity-meta-guid-rename-t{font-size:14px;fill:var(--fig-ink);font-weight:600}
.unity-meta-guid-rename-h{font-size:13px;fill:var(--fig-ink)}
.unity-meta-guid-rename-s{font-size:12px;fill:var(--fig-muted)}
.unity-meta-guid-rename-c{font-size:12px;fill:var(--fig-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.unity-meta-guid-rename-ok{font-size:13px;fill:var(--fig-ok);font-weight:600}
.unity-meta-guid-rename-bad{font-size:13px;fill:var(--fig-bad);font-weight:600}
.unity-meta-guid-rename-panel{fill:none;stroke:var(--fig-line);stroke-width:1.5}
.unity-meta-guid-rename-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.unity-meta-guid-rename-meta{fill:var(--fig-accent);fill-opacity:.12;stroke:var(--fig-accent);stroke-width:1.75}
.unity-meta-guid-rename-lok{stroke:var(--fig-ok);stroke-width:2}
.unity-meta-guid-rename-lbad{stroke:var(--fig-bad);stroke-width:2;stroke-dasharray:5 4}
.unity-meta-guid-rename-A{animation:unity-meta-guid-rename-a 6s ease-in-out infinite}
.unity-meta-guid-rename-B{opacity:0;animation:unity-meta-guid-rename-b 6s ease-in-out infinite}
@keyframes unity-meta-guid-rename-a{0%,40%{opacity:1}46%,64%{opacity:0}72%,100%{opacity:1}}
@keyframes unity-meta-guid-rename-b{0%,40%{opacity:0}46%,64%{opacity:1}72%,100%{opacity:0}}
</style>
<rect class="unity-meta-guid-rename-panel" x="16" y="20" width="296" height="292" rx="12"/><text x="32" y="46" style="font-size:14px;font-weight:700;fill:var(--fig-ok)">Renamed in the Editor</text><rect class="unity-meta-guid-rename-box" x="32" y="60" width="264" height="80" rx="10"/><text class="unity-meta-guid-rename-t" x="44" y="83">Level.unity</text><text class="unity-meta-guid-rename-c" x="44" y="105">m_Script: guid 3f2a…</text><text class="unity-meta-guid-rename-ok" x="44" y="127">✓ script found</text><line x1="246" y1="142" x2="246" y2="188" class="unity-meta-guid-rename-lok"/><rect class="unity-meta-guid-rename-box" x="32" y="190" width="150" height="50" rx="10"/><text class="unity-meta-guid-rename-h unity-meta-guid-rename-B" x="107" y="220" text-anchor="middle">PlayerController.cs</text><text class="unity-meta-guid-rename-h unity-meta-guid-rename-A" x="107" y="220" text-anchor="middle">Hero.cs</text><rect class="unity-meta-guid-rename-meta" x="196" y="190" width="100" height="50" rx="10"/><text class="unity-meta-guid-rename-t" x="246" y="210" text-anchor="middle">.meta</text><text class="unity-meta-guid-rename-c" x="246" y="229" text-anchor="middle">3f2a…</text><text class="unity-meta-guid-rename-s" x="32" y="270">Path changed, GUID kept,</text><text class="unity-meta-guid-rename-s" x="32" y="288">so every reference still resolves.</text><rect class="unity-meta-guid-rename-panel" x="328" y="20" width="296" height="292" rx="12"/><text x="344" y="46" style="font-size:14px;font-weight:700;fill:var(--fig-bad)">Renamed with mv in a shell</text><rect class="unity-meta-guid-rename-box" x="344" y="60" width="264" height="80" rx="10"/><text class="unity-meta-guid-rename-t" x="356" y="83">Level.unity</text><text class="unity-meta-guid-rename-c" x="356" y="105">m_Script: guid 3f2a…</text><text class="unity-meta-guid-rename-ok unity-meta-guid-rename-B" x="356" y="127">✓ script found</text><text class="unity-meta-guid-rename-bad unity-meta-guid-rename-A" x="356" y="127">✗ Missing script (Unknown)</text><line x1="558" y1="142" x2="558" y2="188" class="unity-meta-guid-rename-lok unity-meta-guid-rename-B"/><g class="unity-meta-guid-rename-A"><line x1="558" y1="142" x2="558" y2="188" class="unity-meta-guid-rename-lbad"/><circle cx="558" cy="165" r="10" style="fill:var(--fig-panel);stroke:var(--fig-bad);stroke-width:1.5"/><text x="558" y="170" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--fig-bad)">×</text></g><rect class="unity-meta-guid-rename-box" x="344" y="190" width="150" height="50" rx="10"/><text class="unity-meta-guid-rename-h unity-meta-guid-rename-B" x="419" y="220" text-anchor="middle">PlayerController.cs</text><text class="unity-meta-guid-rename-h unity-meta-guid-rename-A" x="419" y="220" text-anchor="middle">Hero.cs</text><rect class="unity-meta-guid-rename-meta" x="508" y="190" width="100" height="50" rx="10"/><text class="unity-meta-guid-rename-t" x="558" y="210" text-anchor="middle">.meta</text><text class="unity-meta-guid-rename-c unity-meta-guid-rename-B" x="558" y="229" text-anchor="middle">3f2a…</text><text class="unity-meta-guid-rename-c unity-meta-guid-rename-A" x="558" y="229" text-anchor="middle" style="fill:var(--fig-bad)">7b1e…</text><g class="unity-meta-guid-rename-A"><rect x="508" y="252" width="100" height="44" rx="10" style="fill:none;stroke:var(--fig-bad);stroke-width:1.5;stroke-dasharray:5 4"/><text x="558" y="270" text-anchor="middle" style="font-size:12px;fill:var(--fig-bad)">old 3f2a…</text><text x="558" y="287" text-anchor="middle" style="font-size:12px;fill:var(--fig-bad)">deleted</text></g><text class="unity-meta-guid-rename-s unity-meta-guid-rename-A" x="344" y="270">Unity saw a new file</text><text class="unity-meta-guid-rename-s unity-meta-guid-rename-A" x="344" y="288">and gave it a new GUID.</text>
</svg>