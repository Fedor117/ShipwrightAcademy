<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" role="img" aria-label="A graph mapping HDR scene values from 0 to 8 to display values from 0 to 1. Clamping goes flat at 1.0 so all highlights become the same white, while an ACES tonemapping curve rolls highlights off smoothly."><style>.graphics-tonemap-curve-t{font-size:13px;fill:var(--fig-ink)} .graphics-tonemap-curve-m{font-size:13px;fill:var(--fig-muted)} .graphics-tonemap-curve-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-tonemap-curve-mid{text-anchor:middle} .graphics-tonemap-curve-end{text-anchor:end} .graphics-tonemap-curve-mono{font-family:ui-monospace,Menlo,monospace} .graphics-tonemap-curve-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-tonemap-curve-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-tonemap-curve-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-tonemap-curve-ac{stroke:var(--fig-accent);stroke-width:2.5;fill:none} .graphics-tonemap-curve-cl{stroke:var(--fig-bad);stroke-width:2.5;fill:none;stroke-dasharray:7 5} .graphics-tonemap-curve-st{stop-color:var(--fig-warn)} .graphics-tonemap-curve-sc{stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:3 4} .graphics-tonemap-curve-da{fill:var(--fig-accent);stroke:var(--fig-bg);stroke-width:2} .graphics-tonemap-curve-db{fill:var(--fig-bad);stroke:var(--fig-bg);stroke-width:2} .graphics-tonemap-curve-sw{fill:var(--fig-accent)} .graphics-tonemap-curve-swb{fill:var(--fig-bad)} .graphics-tonemap-curve-sl{transform:translateX(100px);animation:graphics-tonemap-curve-sl 7s linear infinite alternate}@keyframes graphics-tonemap-curve-sl{0%{transform:translateX(0px)}3.13%{transform:translateX(12.5px)}6.25%{transform:translateX(25px)}9.38%{transform:translateX(37.5px)}12.5%{transform:translateX(50px)}18.75%{transform:translateX(75px)}25%{transform:translateX(100px)}37.5%{transform:translateX(150px)}50%{transform:translateX(200px)}62.5%{transform:translateX(250px)}75%{transform:translateX(300px)}87.5%{transform:translateX(350px)}100%{transform:translateX(400px)}} .graphics-tonemap-curve-da{transform:translate(170px,85.33px);animation:graphics-tonemap-curve-da 7s linear infinite alternate}@keyframes graphics-tonemap-curve-da{0%{transform:translate(70px,250px)}3.13%{transform:translate(82.5px,182.66px)}6.25%{transform:translate(95px,139.06px)}9.38%{transform:translate(107.5px,117.55px)}12.5%{transform:translate(120px,105.32px)}18.75%{transform:translate(145px,92.18px)}25%{transform:translate(170px,85.33px)}37.5%{transform:translate(220px,78.33px)}50%{transform:translate(270px,74.78px)}62.5%{transform:translate(320px,72.65px)}75%{transform:translate(370px,71.22px)}87.5%{transform:translate(420px,70.2px)}100%{transform:translate(470px,70px)}} .graphics-tonemap-curve-db{transform:translate(170px,70px);animation:graphics-tonemap-curve-db 7s linear infinite alternate}@keyframes graphics-tonemap-curve-db{0%{transform:translate(70px,250px)}3.13%{transform:translate(82.5px,205px)}6.25%{transform:translate(95px,160px)}9.38%{transform:translate(107.5px,115px)}12.5%{transform:translate(120px,70px)}18.75%{transform:translate(145px,70px)}25%{transform:translate(170px,70px)}37.5%{transform:translate(220px,70px)}50%{transform:translate(270px,70px)}62.5%{transform:translate(320px,70px)}75%{transform:translate(370px,70px)}87.5%{transform:translate(420px,70px)}100%{transform:translate(470px,70px)}}</style><text class="graphics-tonemap-curve-h" x="20" y="30">HDR scene value → display value</text><line class="graphics-tonemap-curve-ln" x1="70" y1="60" x2="70" y2="250"/><line class="graphics-tonemap-curve-ln" x1="70" y1="250" x2="476" y2="250"/><line class="graphics-tonemap-curve-ln" x1="70" y1="70" x2="470" y2="70" stroke-dasharray="2 5"/><text class="graphics-tonemap-curve-m graphics-tonemap-curve-end" x="60" y="74">1.0</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-end" x="60" y="254">0</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="70" y="270">0</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="120" y="270">1</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="170" y="270">2</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="270" y="270">4</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="470" y="270">8</text><text class="graphics-tonemap-curve-m graphics-tonemap-curve-mid" x="270" y="290">scene value (linear HDR)</text><path class="graphics-tonemap-curve-cl" d="M70 250 L120 70 L470 70"/><path class="graphics-tonemap-curve-ac" d="M70 250L75 227.35L80 196.08L85 171.07L90 152.66L95 139.06L100 128.81L105 120.87L110 114.58L115 109.5L120 105.32L125 101.82L130 98.85L135 96.31L140 94.11L145 92.18L150 90.48L155 88.97L160 87.63L165 86.42L170 85.33L175 84.33L180 83.43L185 82.6L190 81.84L195 81.14L200 80.49L205 79.89L210 79.33L215 78.81L220 78.33L225 77.87L230 77.44L235 77.04L240 76.66L245 76.31L250 75.97L255 75.65L260 75.35L265 75.06L270 74.78L275 74.52L280 74.28L285 74.04L290 73.82L295 73.6L300 73.39L305 73.2L310 73.01L315 72.82L320 72.65L325 72.48L330 72.32L335 72.17L340 72.02L345 71.87L350 71.73L355 71.6L360 71.47L365 71.35L370 71.22L375 71.11L380 70.99L385 70.88L390 70.78L395 70.68L400 70.58L405 70.48L410 70.38L415 70.29L420 70.2L425 70.12L430 70.03L435 70L440 70L445 70L450 70L455 70L460 70L465 70L470 70"/><line class="graphics-tonemap-curve-sc graphics-tonemap-curve-sl" x1="70" y1="60" x2="70" y2="250"/><circle class="graphics-tonemap-curve-db" cx="0" cy="0" r="5.5"/><circle class="graphics-tonemap-curve-da" cx="0" cy="0" r="5.5"/><rect class="graphics-tonemap-curve-swb" x="500" y="62" width="14" height="4" rx="2"/><text class="graphics-tonemap-curve-t" x="522" y="68">clamp at 1.0</text><rect class="graphics-tonemap-curve-sw" x="500" y="88" width="14" height="4" rx="2"/><text class="graphics-tonemap-curve-t" x="522" y="94">ACES tonemap</text><text class="graphics-tonemap-curve-m" x="500" y="140">Clamp: everything</text><text class="graphics-tonemap-curve-m" x="500" y="158">above 1.0 is the</text><text class="graphics-tonemap-curve-m" x="500" y="176">same flat white.</text><text class="graphics-tonemap-curve-m" x="500" y="212">Curve: highlights</text><text class="graphics-tonemap-curve-m" x="500" y="230">roll off and keep</text><text class="graphics-tonemap-curve-m" x="500" y="248">their gradation.</text></svg>