<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-label="Four transparent quads drawn back to front, from far to near, so alpha blending composes correctly. Where all four overlap the pixel is shaded four times, which is overdraw; ten full screen layers cost ten times the fill rate."><style>.graphics-alpha-overdraw-t{font-size:13px;fill:var(--fig-ink)} .graphics-alpha-overdraw-m{font-size:13px;fill:var(--fig-muted)} .graphics-alpha-overdraw-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-alpha-overdraw-mid{text-anchor:middle} .graphics-alpha-overdraw-end{text-anchor:end} .graphics-alpha-overdraw-mono{font-family:ui-monospace,Menlo,monospace} .graphics-alpha-overdraw-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-alpha-overdraw-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-alpha-overdraw-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-alpha-overdraw-q{fill:var(--fig-accent);fill-opacity:.22;stroke:var(--fig-accent);stroke-width:1.5} .graphics-alpha-overdraw-blk{fill:var(--fig-accent);fill-opacity:.55} .graphics-alpha-overdraw-dot{fill:var(--fig-accent2)} .graphics-alpha-overdraw-v0{animation:graphics-alpha-overdraw-v0 8s linear infinite}@keyframes graphics-alpha-overdraw-v0{0%{opacity:1}99.99%{opacity:1}100%{opacity:1}} .graphics-alpha-overdraw-v1{animation:graphics-alpha-overdraw-v1 8s linear infinite}@keyframes graphics-alpha-overdraw-v1{0%{opacity:1}14.99%{opacity:1}15%{opacity:0}24.99%{opacity:0}25%{opacity:1}99.99%{opacity:1}100%{opacity:1}} .graphics-alpha-overdraw-v2{animation:graphics-alpha-overdraw-v2 8s linear infinite}@keyframes graphics-alpha-overdraw-v2{0%{opacity:1}14.99%{opacity:1}15%{opacity:0}41.99%{opacity:0}42%{opacity:1}99.99%{opacity:1}100%{opacity:1}} .graphics-alpha-overdraw-v3{animation:graphics-alpha-overdraw-v3 8s linear infinite}@keyframes graphics-alpha-overdraw-v3{0%{opacity:1}14.99%{opacity:1}15%{opacity:0}58.99%{opacity:0}59%{opacity:1}99.99%{opacity:1}100%{opacity:1}}</style><text class="graphics-alpha-overdraw-h" x="20" y="30">Transparent quads, drawn back to front</text><g class="graphics-alpha-overdraw-v0"><rect class="graphics-alpha-overdraw-q" x="40" y="52" width="150" height="120" rx="10"/><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-end" x="180" y="72">1 far</text></g><g class="graphics-alpha-overdraw-v1"><rect class="graphics-alpha-overdraw-q" x="75" y="80" width="150" height="120" rx="10"/><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-end" x="215" y="100">2</text></g><g class="graphics-alpha-overdraw-v2"><rect class="graphics-alpha-overdraw-q" x="110" y="108" width="150" height="120" rx="10"/><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-end" x="250" y="128">3</text></g><g class="graphics-alpha-overdraw-v3"><rect class="graphics-alpha-overdraw-q" x="145" y="136" width="150" height="120" rx="10"/><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-end" x="285" y="156">4 near</text></g><g class="graphics-alpha-overdraw-v3"><text class="graphics-alpha-overdraw-h graphics-alpha-overdraw-mid" x="167" y="166">4×</text></g><text class="graphics-alpha-overdraw-m" x="20" y="300">10 full-screen layers = 10× the fill-rate cost</text><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-mono" x="340" y="52">out = src.rgb·src.a</text><text class="graphics-alpha-overdraw-t graphics-alpha-overdraw-mono" x="356" y="72">+ dst.rgb·(1 − src.a)</text><text class="graphics-alpha-overdraw-h" x="340" y="112">Draw order, sorted by distance</text><g class="graphics-alpha-overdraw-v0"><circle class="graphics-alpha-overdraw-dot" cx="348" cy="131" r="4"/></g><text class="graphics-alpha-overdraw-t" x="362" y="136">quad 1</text><text class="graphics-alpha-overdraw-m graphics-alpha-overdraw-end" x="470" y="136">9.2 m</text><g class="graphics-alpha-overdraw-v1"><circle class="graphics-alpha-overdraw-dot" cx="348" cy="157" r="4"/></g><text class="graphics-alpha-overdraw-t" x="362" y="162">quad 2</text><text class="graphics-alpha-overdraw-m graphics-alpha-overdraw-end" x="470" y="162">6.5 m</text><g class="graphics-alpha-overdraw-v2"><circle class="graphics-alpha-overdraw-dot" cx="348" cy="183" r="4"/></g><text class="graphics-alpha-overdraw-t" x="362" y="188">quad 3</text><text class="graphics-alpha-overdraw-m graphics-alpha-overdraw-end" x="470" y="188">4.1 m</text><g class="graphics-alpha-overdraw-v3"><circle class="graphics-alpha-overdraw-dot" cx="348" cy="209" r="4"/></g><text class="graphics-alpha-overdraw-t" x="362" y="214">quad 4</text><text class="graphics-alpha-overdraw-m graphics-alpha-overdraw-end" x="470" y="214">2.0 m</text><text class="graphics-alpha-overdraw-m" x="340" y="262">centre pixel shaded:</text><g class="graphics-alpha-overdraw-v0"><rect class="graphics-alpha-overdraw-blk" x="478" y="248" width="22" height="22" rx="5"/></g><g class="graphics-alpha-overdraw-v1"><rect class="graphics-alpha-overdraw-blk" x="506" y="248" width="22" height="22" rx="5"/></g><g class="graphics-alpha-overdraw-v2"><rect class="graphics-alpha-overdraw-blk" x="534" y="248" width="22" height="22" rx="5"/></g><g class="graphics-alpha-overdraw-v3"><rect class="graphics-alpha-overdraw-blk" x="562" y="248" width="22" height="22" rx="5"/></g><text class="graphics-alpha-overdraw-m" x="340" y="300">depth test on, depth write off</text></svg>