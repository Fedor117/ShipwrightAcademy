<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="A 2 by 2 block of texels with a sample point moving between their centres. Point filtering jumps to the nearest texel value while bilinear filtering blends all four with weights equal to the overlap of a one-texel box around the sample."><style>.graphics-bilinear-weights-t{font-size:13px;fill:var(--fig-ink)} .graphics-bilinear-weights-m{font-size:13px;fill:var(--fig-muted)} .graphics-bilinear-weights-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-bilinear-weights-mid{text-anchor:middle} .graphics-bilinear-weights-end{text-anchor:end} .graphics-bilinear-weights-mono{font-family:ui-monospace,Menlo,monospace} .graphics-bilinear-weights-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-bilinear-weights-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-bilinear-weights-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-bilinear-weights-tx{stroke:var(--fig-line);stroke-width:1.5;fill:var(--fig-accent)} .graphics-bilinear-weights-c{fill:var(--fig-muted)} .graphics-bilinear-weights-fp{fill:var(--fig-accent2);fill-opacity:.14;stroke:var(--fig-ink);stroke-width:1.5;stroke-dasharray:5 4} .graphics-bilinear-weights-dot{fill:var(--fig-accent2)} .graphics-bilinear-weights-mv{animation:graphics-bilinear-weights-mv 8s linear infinite} @keyframes graphics-bilinear-weights-mv{0%{transform:translate(0,0)}25%{transform:translate(50px,0)}50%{transform:translate(50px,50px)}75%{transform:translate(0,50px)}100%{transform:translate(0,0)}} .graphics-bilinear-weights-trk{fill:var(--fig-line);fill-opacity:.35} .graphics-bilinear-weights-bar{fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5;transform-box:fill-box;transform-origin:50% 100%} .graphics-bilinear-weights-ring{fill:none;stroke:var(--fig-accent2);stroke-width:3} .graphics-bilinear-weights-sw{fill:var(--fig-accent)} .graphics-bilinear-weights-bTL{transform:scaleY(0.5625)