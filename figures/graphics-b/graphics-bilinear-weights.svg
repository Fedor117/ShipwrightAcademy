8s linear infinite}@keyframes graphics-bilinear-weights-rBR{0%{opacity:0}37.49%{opacity:0}37.5%{opacity:1}62.49%{opacity:1}62.5%{opacity:0}99.99%{opacity:0}100%{opacity:0}} .graphics-bilinear-weights-pt{fill-opacity:.2;animation:graphics-bilinear-weights-pt 8s linear infinite}@keyframes graphics-bilinear-weights-pt{0%{fill-opacity:0.2}12.49%{fill-opacity:0.2}12.5%{fill-opacity:0.9}37.49%{fill-opacity:0.9}37.5%{fill-opacity:0.7}62.49%{fill-opacity:0.7}62.5%{fill-opacity:0.5}87.49%{fill-opacity:0.5}87.5%{fill-opacity:0.2}100%{fill-opacity:0.2}} .graphics-bilinear-weights-bl{fill-opacity:0.42;animation:graphics-bilinear-weights-bl 8s linear infinite}@keyframes graphics-bilinear-weights-bl{0%{fill-opacity:0.42}25%{fill-opacity:0.71}50%{fill-opacity:0.67}75%{fill-opacity:0.51}100%{fill-opacity:0.42}}</style><text class="graphics-bilinear-weights-h" x="30" y="36">Texels around the sample</text><text class="graphics-bilinear-weights-h" x="300" y="36">Bilinear weights</text><rect class="graphics-bilinear-weights-tx" x="30" y="55" width="100" height="100" fill-opacity="0.2"/><rect class="graphics-bilinear-weights-tx" x="130" y="55" width="100" height="100" fill-opacity="0.9"/><rect class="graphics-bilinear-weights-tx" x="30" y="155" width="100" height="100" fill-opacity="0.5"/><rect class="graphics-bilinear-weights-tx" x="130" y="155" width="100" height="100" fill-opacity="0.7"/><rect class="graphics-bilinear-weights-ring graphics-bilinear-weights-rTL" x="33" y="58" width="94" height="94" rx="4"/><rect class="graphics-bilinear-weights-ring graphics-bilinear-weights-rTR" x="133" y="58" width="94" height="94" rx="4"/><rect class="graphics-bilinear-weights-ring graphics-bilinear-weights-rBL" x="33" y="158" width="94" height="94" rx="4"/><rect class="graphics-bilinear-weights-ring graphics-bilinear-weights-rBR" x="133" y="158" width="94" height="94" rx="4"/><circle class="graphics-bilinear-weights-c" cx="80" cy="105" r="3"/><circle class="graphics-bilinear-weights-c" cx="180" cy