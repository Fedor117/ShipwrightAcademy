<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img" aria-label="A mip chain from 1024 by 1024 down to 1 by 1, each level half the size of the previous, with a memory bar showing the extra levels add about 33 percent. A quad shrinking on screen highlights which mip level is chosen."><style>.graphics-mip-chain-scale-t{font-size:13px;fill:var(--fig-ink)} .graphics-mip-chain-scale-m{font-size:13px;fill:var(--fig-muted)} .graphics-mip-chain-scale-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-mip-chain-scale-mid{text-anchor:middle} .graphics-mip-chain-scale-end{text-anchor:end} .graphics-mip-chain-scale-mono{font-family:ui-monospace,Menlo,monospace} .graphics-mip-chain-scale-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-mip-chain-scale-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-mip-chain-scale-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-mip-chain-scale-sq{fill:var(--fig-accent);fill-opacity:.2;stroke:var(--fig-accent);stroke-width:1.5} .graphics-mip-chain-scale-ring{fill:none;stroke:var(--fig-accent2);stroke-width:2.5} .graphics-mip-chain-scale-q{fill:var(--fig-accent);fill-opacity:.3;stroke:var(--fig-accent);stroke-width:1.5;transform-box:fill-box;transform-origin:50% 50%;animation:graphics-mip-chain-scale-q 7.5s linear infinite} .graphics-mip-chain-scale-m0{fill:var(--fig-accent);fill-opacity:.35} .graphics-mip-chain-scale-m1{fill:var(--fig-accent2);fill-opacity:.4}@keyframes graphics-mip-chain-scale-q{0%{transform:scale(1)}19.99%{transform:scale(1)}20%{transform:scale(0.5)}39.99%{transform:scale(0.5)}40%{transform:scale(0.25)}59.99%{transform:scale(0.25)}60%{transform:scale(0.125)}79.99%{transform:scale(0.125)}80%{transform:scale(0.0625)}99.99%{transform:scale(0.0625)}100%{transform:scale(1)}} .graphics-mip-chain-scale-k0{opacity:1;animation:graphics-mip-chain-scale-k0 7.5s linear infinite}@keyframes graphics-mip-chain-scale-k0{0%{opacity:1}19.99%{opacity:1}20%{opacity:0}99.99%{opacity:0}100%{opacity:0}} .graphics-mip-chain-scale-k1{opacity:0;animation:graphics-mip-chain-scale-k1 7.5s linear infinite}@keyframes graphics-mip-chain-scale-k1{0%{opacity:0}19.99%{opacity:0}20%{opacity:1}39.99%{opacity:1}40%{opacity:0}99.99%{opacity:0}100%{opacity:0}} .graphics-mip-chain-scale-k2{opacity:0;animation:graphics-mip-chain-scale-k2 7.5s linear infinite}@keyframes graphics-mip-chain-scale-k2{0%{opacity:0}39.99%{opacity:0}40%{opacity:1}59.99%{opacity:1}60%{opacity:0}99.99%{opacity:0}100%{opacity:0}} .graphics-mip-chain-scale-k3{opacity:0;animation:graphics-mip-chain-scale-k3 7.5s linear infinite}@keyframes graphics-mip-chain-scale-k3{0%{opacity:0}59.99%{opacity:0}60%{opacity:1}79.99%{opacity:1}80%{opacity:0}99.99%{opacity:0}100%{opacity:0}} .graphics-mip-chain-scale-k4{opacity:0;animation:graphics-mip-chain-scale-k4 7.5s linear infinite}@keyframes graphics-mip-chain-scale-k4{0%{opacity:0}79.99%{opacity:0}80%{opacity:1}99.99%{opacity:1}100%{opacity:1}}</style><text class="graphics-mip-chain-scale-h" x="24" y="30">Mip chain, drawn to scale</text><text class="graphics-mip-chain-scale-h graphics-mip-chain-scale-mid" x="573" y="30">Quad recedes</text><rect class="graphics-mip-chain-scale-sq" x="24" y="44" width="176" height="176" rx="3"/><text class="graphics-mip-chain-scale-t graphics-mip-chain-scale-mid" x="112" y="240">1024</text><rect class="graphics-mip-chain-scale-ring graphics-mip-chain-scale-k0" x="19" y="39" width="186" height="186" rx="5"/><rect class="graphics-mip-chain-scale-sq" x="212" y="132" width="88" height="88" rx="3"/><text class="graphics-mip-chain-scale-t graphics-mip-chain-scale-mid" x="256" y="240">512</text><rect class="graphics-mip-chain-scale-ring graphics-mip-chain-scale-k1" x="207" y="127" width="98" height="98" rx="5"/><rect class="graphics-mip-chain-scale-sq" x="312" y="176" width="44" height="44" rx="3"/><text class="graphics-mip-chain-scale-t graphics-mip-chain-scale-mid" x="334" y="240">256</text><rect class=