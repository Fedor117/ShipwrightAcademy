<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Two frame timelines drawn to scale in milliseconds. CPU-bound: the CPU takes 24 ms while the GPU finishes in 9 ms and idles. GPU-bound: the GPU needs 20 ms while the CPU finishes in 8 ms and waits on a fence. A dashed line marks the 16.6 ms budget for 60 fps."><style>.graphics-cpu-gpu-bound-t{font-size:13px;fill:var(--fig-ink)} .graphics-cpu-gpu-bound-m{font-size:13px;fill:var(--fig-muted)} .graphics-cpu-gpu-bound-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-cpu-gpu-bound-mid{text-anchor:middle} .graphics-cpu-gpu-bound-end{text-anchor:end} .graphics-cpu-gpu-bound-mono{font-family:ui-monospace,Menlo,monospace} .graphics-cpu-gpu-bound-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-cpu-gpu-bound-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-cpu-gpu-bound-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-cpu-gpu-bound-cpu{fill:var(--fig-accent);fill-opacity:.35;stroke:var(--fig-accent);stroke-width:1.5} .graphics-cpu-gpu-bound-gpu{fill:var(--fig-accent2);fill-opacity:.35;stroke:var(--fig-accent2);stroke-width:1.5} .graphics-cpu-gpu-bound-idle{fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:5 4} .graphics-cpu-gpu-bound-bud{stroke:var(--fig-warn);stroke-width:2;stroke-dasharray:6 4} .graphics-cpu-gpu-bound-ph{stroke:var(--fig-ink);stroke-width:2;fill:none;animation:graphics-cpu-gpu-bound-ph 6s linear infinite} @keyframes graphics-cpu-gpu-bound-ph{0%{transform:translateX(0)}100%{transform:translateX(432px)}}</style><text class="graphics-cpu-gpu-bound-h" x="20" y="28">CPU-bound: 24 ms frame, GPU busy only 9 ms</text><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-end" x="140" y="61">CPU</text><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-end" x="140" y="93">GPU</text><rect class="graphics-cpu-gpu-bound-cpu" x="150" y="44" width="432" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-mid" x="366" y="61">scripts, culling, draw submission</text><rect class="graphics-cpu-gpu-bound-gpu" x="150" y="76" width="162" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-mid" x="231" y="93">9 ms</text><rect class="graphics-cpu-gpu-bound-idle" x="312" y="76" width="270" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="515.4" y="93">idle, starved</text><text class="graphics-cpu-gpu-bound-h" x="20" y="140">GPU-bound: GPU needs 20 ms, CPU waits</text><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-end" x="140" y="173">CPU</text><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-end" x="140" y="205">GPU</text><rect class="graphics-cpu-gpu-bound-cpu" x="150" y="156" width="144" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-mid" x="222" y="173">8 ms</text><rect class="graphics-cpu-gpu-bound-idle" x="294" y="156" width="216" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="369.6" y="173">waits on fence</text><rect class="graphics-cpu-gpu-bound-gpu" x="150" y="188" width="360" height="24" rx="5"/><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-mid" x="330" y="205">pixels, overdraw, post</text><line class="graphics-cpu-gpu-bound-bud" x1="448.8" y1="36" x2="448.8" y2="222"/><line class="graphics-cpu-gpu-bound-ln" x1="150" y1="234" x2="582" y2="234"/><line class="graphics-cpu-gpu-bound-ln" x1="150" y1="234" x2="150" y2="240"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="150" y="256">0</text><line class="graphics-cpu-gpu-bound-ln" x1="294" y1="234" x2="294" y2="240"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="294" y="256">8</text><line class="graphics-cpu-gpu-bound-ln" x1="448.8" y1="234" x2="448.8" y2="240"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="448.8" y="256">16.6</text><line class="graphics-cpu-gpu-bound-ln" x1="510" y1="234" x2="510" y2="240"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="510" y="256">20</text><line class="graphics-cpu-gpu-bound-ln" x1="582" y1="234" x2="582" y2="240"/><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-mid" x="582" y="256">24</text><text class="graphics-cpu-gpu-bound-m graphics-cpu-gpu-bound-end" x="140" y="256">ms</text><text class="graphics-cpu-gpu-bound-t graphics-cpu-gpu-bound-mid" x="448.8" y="278">16.6 ms = 60 fps budget</text><path class="graphics-cpu-gpu-bound-ph" d="M150 38 V106 M150 150 V218"/></svg>