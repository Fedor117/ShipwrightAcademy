<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="A sphere lit by a light orbiting it. Brightness at each point is max(0, N dot L), so it falls off as the cosine of the angle between the surface normal and the light direction and is clamped to zero on the far side. A plot tracks the angle for one surface point."><style>.graphics-lambert-orbit-t{font-size:13px;fill:var(--fig-ink)} .graphics-lambert-orbit-m{font-size:13px;fill:var(--fig-muted)} .graphics-lambert-orbit-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-lambert-orbit-mid{text-anchor:middle} .graphics-lambert-orbit-end{text-anchor:end} .graphics-lambert-orbit-mono{font-family:ui-monospace,Menlo,monospace} .graphics-lambert-orbit-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-lambert-orbit-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-lambert-orbit-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-lambert-orbit-st{stop-color:var(--fig-warn)} .graphics-lambert-orbit-sun{fill:var(--fig-warn);stroke:var(--fig-warn);stroke-width:2} .graphics-lambert-orbit-rot{transform-box:view-box;transform-origin:170px 172px;transform:rotate(-70deg);animation:graphics-lambert-orbit-rot 9s linear infinite} .graphics-lambert-orbit-rotp{transform-box:view-box;transform-origin:239.28px 132px;transform:rotate(-70deg);animation:graphics-lambert-orbit-rot 9s linear infinite} .graphics-lambert-orbit-cr{transform-box:fill-box;transform-origin:50% 50%;transform:rotate(70deg);animation:graphics-lambert-orbit-cr 9s linear infinite} @keyframes graphics-lambert-orbit-rot{0%{transform:rotate(-70deg)}100%{transform:rotate(290deg)}} @keyframes graphics-lambert-orbit-cr{0%{transform:rotate(70deg)}100%{transform:rotate(-290deg)}} .graphics-lambert-orbit-n{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-lambert-orbit-l{stroke:var(--fig-warn);stroke-width:2.5;fill:none} .graphics-lambert-orbit-ah{fill:var(--fig-ink)} .graphics-lambert-orbit-ahl{fill:var(--fig-warn)} .graphics-lambert-orbit-cv{stroke:var(--fig-accent);stroke-width:2.5;fill:none} .graphics-lambert-orbit-cl{stroke:var(--fig-bad);stroke-width:2.5;fill:none} .graphics-lambert-orbit-mk{fill:var(--fig-accent2);stroke:var(--fig-bg);stroke-width:2} .graphics-lambert-orbit-mk{transform:translate(428.89px,115.74px);animation:graphics-lambert-orbit-mk 9s linear infinite}@keyframes graphics-lambert-orbit-mk{0%{transform:translate(428.89px,115.74px)}2.5%{transform:translate(417.89px,105.71px)}5%{transform:translate(406.89px,98.01px)}7.5%{transform:translate(395.89px,92.82px)}10%{transform:translate(384.89px,90.27px)}11.11%{transform:translate(380px,90px)}12.5%{transform:translate(386.11px,90.42px)}15%{transform:translate(397.11px,93.27px)}17.5%{transform:translate(408.11px,98.74px)}20%{transform:translate(419.11px,106.71px)}22.5%{transform:translate(430.11px,116.98px)}25%{transform:translate(441.11px,129.29px)}27.5%{transform:translate(452.11px,143.35px)}30%{transform:translate(463.11px,158.79px)}32.5%{transform:translate(474.11px,175.26px)}35%{transform:translate(485.11px,192.33px)}36.11%{transform:translate(490px,200px)}37.5%{transform:translate(496.11px,200px)}40%{transform:translate(507.11px,200px)}42.5%{transform:translate(518.11px,200px)}45%{transform:translate(529.11px,200px)}47.5%{transform:translate(540.11px,200px)}50%{transform:translate(551.11px,200px)}52.5%{transform:translate(562.11px,200px)}55%{transform:translate(573.11px,200px)}57.5%{transform:translate(584.11px,200px)}60%{transform:translate(595.11px,200px)}61.11%{transform:translate(600px,200px)}62.5%{transform:translate(593.89px,200px)}65%{transform:translate(582.89px,200px)}67.5%{transform:translate(571.89px,200px)}70%{transform:translate(560.89px,200px)}72.5%{transform:translate(549.89px,200px)}75%{transform:translate(538.89px,200px)}77.5%{transform:translate(527.89px,200px)}80%{transform:translate(516.89px,200px)}82.5%{transform:translate(505.89px,200px)}85%{transform:translate(494.89px,200px)}87.5%{transform:translate(483.89px,190.41px)}90%{transform:translate(472.89px,173.39px)}92.5%{transform:translate(461.89px,157.02px)}95%{transform:translate(450.89px,141.71px)}97.5%{transform:translate(439.89px,127.83px)}100%{transform:translate(428.89px,115.74px)}}</style><defs><linearGradient id="graphics-lambert-orbit-g" x1="0" y1="0" x2="1" y2="0"><stop class="graphics-lambert-orbit-st" offset="0" stop-opacity="0"/><stop class="graphics-lambert-orbit-st" offset=".5" stop-opacity="0"/><stop class="graphics-lambert-orbit-st" offset="1" stop-opacity=".95"/></linearGradient><clipPath id="graphics-lambert-orbit-clip"><circle cx="170" cy="172" r="80"/></clipPath></defs><text class="graphics-lambert-orbit-h" x="20" y="26">Lambert: max(0, dot(N, L))</text><circle class="graphics-lambert-orbit-pn" cx="170" cy="172" r="80"/><g clip-path="url(#graphics-lambert-orbit-clip)"><g class="graphics-lambert-orbit-rot"><rect x="90" y="92" width="160" height="160" fill="url(#graphics-lambert-orbit-g)"/></g></g><circle cx="170" cy="172" r="80" class="graphics-lambert-orbit-ln"/><circle cx="170" cy="172" r="128" class="graphics-lambert-orbit-ln" stroke-dasharray="3 5"/><g class="graphics-lambert-orbit-rot"><circle class="graphics-lambert-orbit-sun" cx="298" cy="172" r="10"/></g><line class="graphics-lambert-orbit-n" x1="239.28" y1="132" x2="265.26" y2="117"/><circle class="graphics-lambert-orbit-ah" cx="265.26" cy="117" r="3.5"/><text class="graphics-lambert-orbit-h" x="261.26" y="109">N</text><g class="graphics-lambert-orbit-rotp"><line class="graphics-lambert-orbit-l" x1="239.28" y1="132" x2="269.28" y2="132"/><circle class="graphics-lambert-orbit-ahl" cx="269.28" cy="132" r="3.5"/><g class="graphics-lambert-orbit-cr"><text class="graphics-lambert-orbit-h" x="277.28" y="137">L</text></g></g><circle class="graphics-lambert-orbit-ah" cx="239.28" cy="132" r="4"/><text class="graphics-lambert-orbit-h" x="380" y="62">brightness = max(0, cos θ)</text><line cla