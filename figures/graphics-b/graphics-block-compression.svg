<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="A 4 by 4 texel block of 512 raw bits collapsing into a 128 bit BC7 block, beside a bar chart drawn to scale of bits per texel for RGBA8, BC7, ASTC 4x4, BC1, ETC2, ASTC 6x6 and ASTC 12x12."><style>.graphics-block-compression-t{font-size:13px;fill:var(--fig-ink)} .graphics-block-compression-m{font-size:13px;fill:var(--fig-muted)} .graphics-block-compression-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-block-compression-mid{text-anchor:middle} .graphics-block-compression-end{text-anchor:end} .graphics-block-compression-mono{font-family:ui-monospace,Menlo,monospace} .graphics-block-compression-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-block-compression-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-block-compression-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-block-compression-tx{fill:var(--fig-accent);stroke:var(--fig-bg);stroke-width:1} .graphics-block-compression-raw{fill:var(--fig-muted);fill-opacity:.45} .graphics-block-compression-cmp{fill:var(--fig-accent);fill-opacity:.75} .graphics-block-compression-ghost{opacity:0;transform-box:fill-box;transform-origin:0 0;animation:graphics-block-compression-gh 6s ease-in-out infinite}@keyframes graphics-block-compression-gh{0%{opacity:0;transform:translateY(0) scaleY(1)}12%{opacity:.85;transform:translateY(0) scaleY(1)}22%{opacity:.85;transform:translateY(0) scaleY(1)}62%{opacity:.85;transform:translateY(155px) scaleY(.25)}80%{opacity:0;transform:translateY(155px) scaleY(.25)}100%{opacity:0;transform:translateY(155px) scaleY(.25)}}</style><text class="graphics-block-compression-h" x="24" y="32">One 4×4 block</text><rect class="graphics-block-compression-tx" x="30" y="50" width="28" height="28" fill-opacity="0.25"/><rect class="graphics-block-compression-tx" x="58" y="50" width="28" height="28" fill-opacity="0.4"/><rect class="graphics-block-compression-tx" x="86" y="50" width="28" height="28" fill-opacity="0.55"/><rect class="graphics-block-compression-tx" x="114" y="50" width="28" height="28" fill-opacity="0.7"/><rect class="graphics-block-compression-tx" x="30" y="78" width="28" height="28" fill-opacity="0.35"/><rect class="graphics-block-compression-tx" x="58" y="78" width="28" height="28" fill-opacity="0.5"/><rect class="graphics-block-compression-tx" x="86" y="78" width="28" height="28" fill-opacity="0.65"/><rect class="graphics-block-compression-tx" x="114" y="78" width="28" height="28" fill-opacity="0.8"/><rect class="graphics-block-compression-tx" x="30" y="106" width="28" height="28" fill-opacity="0.45"/><rect class="graphics-block-compression-tx" x="58" y="106" width="28" height="28" fill-opacity="0.6"/><rect class="graphics-block-compression-tx" x="86" y="106" width="28" height="28" fill-opacity="0.75"/><rect class="graphics-block-compression-tx" x="114" y="106" width="28" height="28" fill-opacity="0.9"/><rect class="graphics-block-compression-tx" x="30" y="134" width="28" height="28" fill-opacity="0.55"/><rect class="graphics-block-compression-tx" x="58" y="134" width="28" height="28" fill-opacity="0.7"/><rect class="graphics-block-compression-tx" x="86" y="134" width="28" height="28" fill-opacity="0.85"/><rect class="graphics-block-compression-tx" x="114" y="134" width="28" height="28" fill-opacity="0.95"/><g class="graphics-block-compression-ghost"><rect class="graphics-block-compression-tx" x="30" y="50" width="28" height="28" fill-opacity="0.25"/><rect class="graphics-block-compression-tx" x="58" y="50" width="28" height="28" fill-opacity="0.4"/><rect class="graphics-block-compression-tx" x="86" y="50" width="28" height="28" fill-opacity="0.55"/><rect class="graphics-block-compression-tx" x="114" y="50" width="28" height="28" fill-opacity="0.7"/><rect class="graphics-block-compression-tx" x="30" y="78" width="28" height="28" fill-opacity="0.35"/><rect class="graphics-block-compression-tx" x="58" y="78" width="28" height="28" fill-opacity="0.5"/><rect class="graphics-block-compression-tx" x="86" y="78" width="28" height="28" fill-opacity="0.65"/><rect class="graphics-block-compression-tx" x="114" y="78" width="28" height="28" fill-opacity="0.8"/><rect class="graphics-block-compression-tx" x="30" y="106" width="28" height="28" fill-opacity="0.45"/><rect class="graphics-block-compression-tx" x="58" y="106" width="28" height="28" fill-opacity="0.6"/><rect class="graphics-block-compression-tx" x="86" y="106" width="28" height="28" fill-opacity="0.75"/><rect class="graphics-block-compression-tx" x="114" y="106" width="28" height="28" fill-opacity="0.9"/><rect class="graphics-block-compression-tx" x="30" y="134" width="28" height="28" fill-opacity="0.55"/><rect class="graphics-block-compression-tx" x="58" y="134" width="28" height="28" fill-opacity="0.7"/><rect class="graphics-block-compression-tx" x="86" y="134" width="28" height="28" fill-opacity="0.85"/><rect class="graphics-block-compression-tx" x="114" y="134" width="28" height="28" fill-opacity="0.95"/></g><text class="graphics-block-compression-t" x="24" y="184">RGBA8: 16 × 32 = 512 bits</text><rect class="graphics-block-compression-cmp" x="30" y="205" width="112" height="28" rx="3"/><text class="graphics-block-compression-t" x="152" y="224">BC7: 128 bits</text><rect class="graphics-block-compression-cmp" x="30" y="248" width="112" height="14" rx="3"/><text class="graphics-block-compression-t" x="152" y="260">BC1: 64 bits</text><text class="graphics-block-compression-m" x="24" y="296">area = bits, same scale</text><text class="graphics-block-compression-h" x="262" y="32">Bits per texel, to scale</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="66">RGBA8</text><rect class="graphics-block-compression-raw" x="356" y="52" width="224" height="20" rx="4"/><text class="graphics-block-compression-m" x="588" y="67">32</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="100">BC7</text><rect class="graphics-block-compression-cmp" x="356" y="86" width="56" height="20" rx="4"/><text class="graphics-block-compression-m" x="420" y="101">8</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="134">ASTC 4×4</text><rect class="graphics-block-compression-cmp" x="356" y="120" width="56" height="20" rx="4"/><text class="graphics-block-compression-m" x="420" y="135">8</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="168">BC1</text><rect class="graphics-block-compression-cmp" x="356" y="154" width="28" height="20" rx="4"/><text class="graphics-block-compression-m" x="392" y="169">4</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="202">ETC2</text><rect class="graphics-block-compression-cmp" x="356" y="188" width="28" height="20" rx="4"/><text class="graphics-block-compression-m" x="392" y="203">4</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="236">ASTC 6×6</text><rect class="graphics-block-compression-cmp" x="356" y="222" width="24.92" height="20" rx="4"/><text class="graphics-block-compression-m" x="388.92" y="237">≈3.6</text><text class="graphics-block-compression-t graphics-block-compression-end" x="348" y="270">ASTC 12×12</text><rect class="graphics-block-compression-cmp" x="356" y="256" width="6.23" height="20" rx="2"/><text class="graphics-block-compression-m" x="370.23" y="271">0.89</text><line class="graphics-block-compression-ln" x1="356" y1="46" x2="356" y2="288"/><text class="graphics-block-compression-m" x="262" y="316">2048² with mips: RGBA8 ≈ 22 MB, ASTC 6×6 under 4 MB</text></svg>