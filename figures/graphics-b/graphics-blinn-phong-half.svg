<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" role="img" aria-label="Blinn-Phong vectors at a surface point: normal N, view vector V, a moving light vector L and the half vector H halfway between L and V. A plot of pow(dot(N,H), shininess) for shininess 8 and 64 shows the highlight is tight for high shininess, with markers tracking the current H angle."><style>.graphics-blinn-phong-half-t{font-size:13px;fill:var(--fig-ink)} .graphics-blinn-phong-half-m{font-size:13px;fill:var(--fig-muted)} .graphics-blinn-phong-half-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-blinn-phong-half-mid{text-anchor:middle} .graphics-blinn-phong-half-end{text-anchor:end} .graphics-blinn-phong-half-mono{font-family:ui-monospace,Menlo,monospace} .graphics-blinn-phong-half-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-blinn-phong-half-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-blinn-phong-half-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-blinn-phong-half-rt{transform-box:view-box;transform-origin:190px 240px} .graphics-blinn-phong-half-cr{transform-box:fill-box;transform-origin:50% 50%} .graphics-blinn-phong-half-aL{transform:rotate(-70deg);animation:graphics-blinn-phong-half-aL 6s linear infinite} .graphics-blinn-phong-half-cL{transform:rotate(70deg);animation:graphics-blinn-phong-half-cL 6s linear infinite} .graphics-blinn-phong-half-aH{transform:rotate(-15deg);animation:graphics-blinn-phong-half-aH 6s linear infinite} .graphics-blinn-phong-half-cH{transform:rotate(15deg);animation:graphics-blinn-phong-half-cH 6s linear infinite}@keyframes graphics-blinn-phong-half-aL{0%{transform:rotate(-70deg)}50%{transform:rotate(-10deg)}100%{transform:rotate(-70deg)}}@keyframes graphics-blinn-phong-half-cL{0%{transform:rotate(70deg)}50%{transform:rotate(10deg)}100%{transform:rotate(70deg)}}@keyframes graphics-blinn-phong-half-aH{0%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-15deg)}}@keyframes graphics-blinn-phong-half-cH{0%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}} .graphics-blinn-phong-half-vN{stroke:var(--fig-ink);stroke-width:2} .graphics-blinn-phong-half-vV{stroke:var(--fig-accent2);stroke-width:2.5} .graphics-blinn-phong-half-vL{stroke:var(--fig-warn);stroke-width:2.5} .graphics-blinn-phong-half-vH{stroke:var(--fig-accent);stroke-width:3} .graphics-blinn-phong-half-fN{fill:var(--fig-ink)} .graphics-blinn-phong-half-fV{fill:var(--fig-accent2)} .graphics-blinn-phong-half-fL{fill:var(--fig-warn)} .graphics-blinn-phong-half-fH{fill:var(--fig-accent)} .graphics-blinn-phong-half-c8{stroke:var(--fig-accent2);stroke-width:2.5;fill:none} .graphics-blinn-phong-half-c64{stroke:var(--fig-accent);stroke-width:2.5;fill:none} .graphics-blinn-phong-half-vl{stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 4} .graphics-blinn-phong-half-vm{transform:translateX(73.33px);animation:graphics-blinn-phong-half-vm 6s linear infinite}@keyframes graphics-blinn-phong-half-vm{0%{transform:translateX(73.33px)}5%{transform:translateX(80.67px)}10%{transform:translateX(88px)}15%{transform:translateX(95.33px)}20%{transform:translateX(102.67px)}25%{transform:translateX(110px)}30%{transform:translateX(117.33px)}35%{transform:translateX(124.67px)}40%{transform:translateX(132px)}45%{transform:translateX(139.33px)}50%{transform:translateX(146.67px)}55%{transform:translateX(139.33px)}60%{transform:translateX(132px)}65%{transform:translateX(124.67px)}70%{transform:translateX(117.33px)}75%{transform:translateX(110px)}80%{transform:translateX(102.67px)}85%{transform:translateX(95.33px)}90%{transform:translateX(88px)}95%{transform:translateX(80.67px)}100%{transform:translateX(73.33px)}} .graphics-blinn-phong-half-d8{transform:translate(473.33px,113.91px);animation:graphics-blinn-phong-half-d8 6s linear infinite}@keyframes graphics-blinn-phong-half-d8{0%{transform:translate(473.33px,113.91px)}5%{transform:translate(480