<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Shadow mapping: a strip of depth texels rendered from a light above a floating occluder. A probe pixel slides along the ground, reads its texel and compares depths: equal means lit, farther than the stored depth means in shadow. Insets show shadow acne from too little bias and peter-panning from too much."><style>.graphics-shadow-map-compare-t{font-size:13px;fill:var(--fig-ink)} .graphics-shadow-map-compare-m{font-size:13px;fill:var(--fig-muted)} .graphics-shadow-map-compare-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-shadow-map-compare-mid{text-anchor:middle} .graphics-shadow-map-compare-end{text-anchor:end} .graphics-shadow-map-compare-mono{font-family:ui-monospace,Menlo,monospace} .graphics-shadow-map-compare-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-shadow-map-compare-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-shadow-map-compare-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-shadow-map-compare-tl{fill:var(--fig-accent)} .graphics-shadow-map-compare-pr{animation:graphics-shadow-map-compare-pr 8s linear infinite} @keyframes graphics-shadow-map-compare-pr{0%{transform:translateX(0)}50%{transform:translateX(320px)}100%{transform:translateX(0)}} .graphics-shadow-map-compare-pl{stroke:var(--fig-accent2);stroke-width:2;stroke-dasharray:5 4} .graphics-shadow-map-compare-pd{fill:var(--fig-accent2);stroke:var(--fig-bg);stroke-width:2} .graphics-shadow-map-compare-pf{fill:none;stroke:var(--fig-accent2);stroke-width:2.5} .graphics-shadow-map-compare-ok{fill:var(--fig-ok)} .graphics-shadow-map-compare-bad{fill:var(--fig-bad)} .graphics-shadow-map-compare-shd{fill:var(--fig-ink);fill-opacity:.28} .graphics-shadow-map-compare-stp{stroke:var(--fig-ink);stroke-opacity:.5;stroke-width:3} .graphics-shadow-map-compare-lt{stroke:var(--fig-warn);stroke-width:2;stroke-dasharray:6 5} .graphics-shadow-map-compare-halo{stroke:var(--fig-bg);stroke-width:5;stroke-linejoin:round;paint-order:stroke} .graphics-shadow-map-compare-on{opacity:1;animation:graphics-shadow-map-compare-on 8s linear infinite} .graphics-shadow-map-compare-off{opacity:0;animation:graphics-shadow-map-compare-off 8s linear infinite}@keyframes graphics-shadow-map-compare-on{0%{opacity:1}14.68%{opacity:1}14.69%{opacity:0}28.43%{opacity:0}28.44%{opacity:1}71.55%{opacity:1}71.56%{opacity:0}85.3%{opacity:0}85.31%{opacity:1}99.99%{opacity:1}100%{opacity:1}}@keyframes graphics-shadow-map-compare-off{0%{opacity:0}14.68%{opacity:0}14.69%{opacity:1}28.43%{opacity:1}28.44%{opacity:0}71.55%{opacity:0}71.56%{opacity:1}85.3%{opacity:1}85.31%{opacity:0}99.99%{opacity:0}100%{opacity:0}}</style><defs><pattern id="graphics-shadow-map-compare-stripe" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="graphics-shadow-map-compare-stp" x1="0" y1="0" x2="0" y2="7"/></pattern></defs><text class="graphics-shadow-map-compare-h" x="30" y="30">Directional light, looking down</text><line class="graphics-shadow-map-compare-lt" x1="30" y1="44" x2="390" y2="44"/><rect class="graphics-shadow-map-compare-tl" x="34" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="56" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="78" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="100" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="122" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="144" y="54" width="22" height="20" fill-opacity="0.7" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="166" y="54" width="22" height="20" fill-opacity="0.7" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="188" y="54" width="22" height="20" fill-opacity="0.7" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="210" y="54" width="22" height="20" fill-opacity="0.7" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="232" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="254" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="276" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="298" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="320" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="342" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><rect class="graphics-shadow-map-compare-tl" x="364" y="54" width="22" height="20" fill-opacity="0.18" stroke="none"/><g class="graphics-shadow-map-compare-pr"><line class="graphics-shadow-map-compare-pl" x1="50" y1="76" x2="50" y2="272"/><rect class="graphics-shadow-map-compare-pf" x="39" y="52" width="22" height="24" rx="3"/><circle class="graphics-shadow-map-compare-pd" cx="50" cy="280" r="7"/></g><rect class="graphics-shadow-map-compare-ln" x="34" y="54" width="352" height="20" rx="2"/><text class="graphics-shadow-map-compare-m graphics-shadow-map-compare-halo" x="34" y="96">shadow map: depth seen from the light</text><rect class="graphics-shadow-map-compare-pn" x="144" y="150" width="88" height="18" rx="4" style="stroke:var(--fig-ink)"/><text class="graphics-shadow-map-compare-t graphics-shadow-map-compare-halo" x="242" y="164">occluder (depth 90)</text><rect class="graphics-shadow-map-compare-shd" x="144" y="270" width="88" height="10"/><line class="graphics-shadow-map-compare-ink" x1="30" y1="280" x2="390" y2="280"/><text class="graphics-shadow-map-compare-t graphics-shadow-map-compare-halo" x="300" y="268">ground (220)</text><text class="graphics-shadow-map-compare-m" x="30" y="306">probe pixel: reads its texel, compares depths</text><rect class="graphics-shadow-map-compare-pn" x="415" y="40" width="210" height="128" rx="12"/><text class="graphics-shadow-map-compare-m" x="430" y="68">pixel depth from light</text><text class="graphics-shadow-map-compare-t graphics-shadow-map-compare-end" x="610" y="68">220</text><text class="graphics-shadow-map-compare-m" x="430" y="96">shadow map stores</text><text class="graphics-shadow-map-compare-t graphics-shadow-map-compare-end graphics-shadow-map-compare-on" x="610" y="96">220</text><text class="graphics-shadow-map-compare-t graphics-shadow-map-compare-end graphics-shadow-map-compare-off" x="610" y="96">90</text><line class="graphics-shadow-map-compare-ln" x1="430" y1="112" x2="610" y2="112"/><text class="graphics-shadow-map-compare-h graphics-shadow-map-compare-mid graphics-shadow-map-compare-on" x="520" y="146"><tspan class="graphics-shadow-map-compare-ok">220 ≤ 220 → lit</tspan></text><text class="graphics-shadow-map-compare-h graphics-shadow-map-compare-mid graphics-shadow-map-compare-off" x="520" y="146"><tspan class="graphics-shadow-map-compare-bad">220 &gt; 90 → in shadow</tspan></text><rect class="graphics-shadow-map-compare-pn" x="425" y="188" width="80" height="56" rx="8"/><rect x="433" y="214" width="64" height="18" fill="url(#graphics-shadow-map-compare-stripe)"/><line class="graphics-shadow-map-compare-ink" x1="433" y1="214" x2="497" y2="214"/><text class="graphics-shadow-map-compare-h" x="517" y="210">Shadow acne</text><text class="graphics-shadow-map-compare-m" x="517" y="230">bias too small</text><rect class="graphics-shadow-map-compare-pn" x="425" y="260" width="80" height="56" rx="8"/><line class="graphics-shadow-map-compare-ink" x1="433" y1="304" x2="497" y2="304"/><rect class="graphics-shadow-map-compare-pn" x="447" y="278" width="16" height="26" rx="2" style="stroke:var(--fig-ink)"/><rect class="graphics-shadow-map-compare-shd" x="474" y="299" width="20" height="5" rx="1"/><text class="graphics-shadow-map-compare-h" x="517" y="282">Peter-panning</text><text class="graphics-shadow-map-compare-m" x="517" y="302">bias too large</text></svg>