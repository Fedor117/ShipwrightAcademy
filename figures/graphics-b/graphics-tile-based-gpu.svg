<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" role="img" aria-label="Immediate-mode GPUs read and write the framebuffer in DRAM for every triangle. Tile-based GPUs bin triangles into screen tiles, shade one tile at a time in on-chip memory, and write each finished tile to system memory once."><style>.graphics-tile-based-gpu-t{font-size:13px;fill:var(--fig-ink)} .graphics-tile-based-gpu-m{font-size:13px;fill:var(--fig-muted)} .graphics-tile-based-gpu-h{font-size:14px;font-weight:600;fill:var(--fig-ink)} .graphics-tile-based-gpu-mid{text-anchor:middle} .graphics-tile-based-gpu-end{text-anchor:end} .graphics-tile-based-gpu-mono{font-family:ui-monospace,Menlo,monospace} .graphics-tile-based-gpu-pn{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5} .graphics-tile-based-gpu-ln{stroke:var(--fig-line);stroke-width:1.5;fill:none} .graphics-tile-based-gpu-ink{stroke:var(--fig-ink);stroke-width:2;fill:none} .graphics-tile-based-gpu-tri{fill:var(--fig-accent);fill-opacity:.25;stroke:var(--fig-accent);stroke-width:1.5} .graphics-tile-based-gpu-tr2{fill:var(--fig-accent2);fill-opacity:.25;stroke:var(--fig-accent2);stroke-width:1.5} .graphics-tile-based-gpu-dn{stroke:var(--fig-bad);stroke-width:2;stroke-dasharray:4 6;animation:graphics-tile-based-gpu-dn 1s linear infinite} .graphics-tile-based-gpu-up{stroke:var(--fig-bad);stroke-width:2;stroke-dasharray:4 6;animation:graphics-tile-based-gpu-up 1s linear infinite} @keyframes graphics-tile-based-gpu-dn{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}} @keyframes graphics-tile-based-gpu-up{0%{stroke-dashoffset:0}100%{stroke-dashoffset:20}} .graphics-tile-based-gpu-cur{fill:none;stroke:var(--fig-ink);stroke-width:2.5} .graphics-tile-based-gpu-done{fill:var(--fig-ok);opacity:0} .graphics-tile-based-gpu-pulse{fill:var(--fig-ok);animation:graphics-tile-based-gpu-pu 0.6s linear infinite} @keyframes graphics-tile-based-gpu-pu{0%{transform:translateY(0);opacity:0}55%{transform:translateY(0);opacity:0}60%{opacit