<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-label="Ten on/off keyword toggles switch on one by one while a grid of compiled variants doubles each time, from 1 to 1,024. Below, to scale, the worked example: 288 variants per pass, cut to 36 by turning three keywords into uniform branches."><style>.graphics-shader-variants-t{font-size:13px;fill:var(--fig-ink)}.graphics-shader-variants-m{font-size:12px;fill:var(--fig-muted)}.graphics-shader-variants-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-shader-variants-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-shader-variants-e{text-anchor:end}.graphics-shader-variants-mid{text-anchor:middle}.graphics-shader-variants-kw{font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fig-ink)}.graphics-shader-variants-big{font-size:26px;font-weight:700;fill:var(--fig-accent)}@keyframes graphics-shader-variants-k0{0%,7.5%{opacity:0}9%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k0{animation:graphics-shader-variants-k0 8s infinite}@keyframes graphics-shader-variants-k1{0%,15%{opacity:0}16.5%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k1{animation:graphics-shader-variants-k1 8s infinite}@keyframes graphics-shader-variants-k2{0%,22.5%{opacity:0}24%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k2{animation:graphics-shader-variants-k2 8s infinite}@keyframes graphics-shader-variants-k3{0%,30%{opacity:0}31.5%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k3{animation:graphics-shader-variants-k3 8s infinite}@keyframes graphics-shader-variants-k4{0%,37.5%{opacity:0}39%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k4{animation:graphics-shader-variants-k4 8s infinite}@keyframes graphics-shader-variants-k5{0%,45%{opacity:0}46.5%,95%{opacity:1}100%{opacity:0}}.graphics-shader-variants-k5{animation:graphics-shader-variants-k5 8s infinite}@keyframes graphics-shader-variants-k6{0%,52.5%{opacity: