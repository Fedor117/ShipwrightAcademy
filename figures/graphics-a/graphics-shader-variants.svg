pacity:1}60.5%,100%{opacity:0}}.graphics-shader-variants-g7{opacity:0;animation:graphics-shader-variants-g7 8s infinite}@keyframes graphics-shader-variants-g8{0%,60%{opacity:0}60.5%,67.5%{opacity:1}68%,100%{opacity:0}}.graphics-shader-variants-g8{opacity:0;animation:graphics-shader-variants-g8 8s infinite}@keyframes graphics-shader-variants-g9{0%,67.5%{opacity:0}68%,75%{opacity:1}75.5%,100%{opacity:0}}.graphics-shader-variants-g9{opacity:0;animation:graphics-shader-variants-g9 8s infinite}@keyframes graphics-shader-variants-g10{0%,75%{opacity:0}75.5%,95%{opacity:1}95.5%,100%{opacity:0}}.graphics-shader-variants-g10{opacity:1;animation:graphics-shader-variants-g10 8s infinite}</style><defs><pattern id="graphics-shader-variants-cell" x="250" y="44" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0.75" y="0.75" width="6.5" height="6.5" rx="1.5" fill="var(--fig-accent)"/></pattern></defs><text class="graphics-shader-variants-h" x="24" y="28">Keywords, one pass</text><text class="graphics-shader-variants-h" x="250" y="28">Compiled variants</text><rect x="24" y="44" width="34" height="18" rx="9" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><circle cx="33" cy="53" r="6" fill="var(--fig-muted)" fill-opacity="0.6"/><g class="graphics-shader-variants-k0"><rect x="24" y="44" width="34" height="18" rx="9" fill="var(--fig-accent)"/><circle cx="49" cy="53" r="6" fill="var(--fig-bg)"/></g><text class="graphics-shader-variants-kw" x="68" y="57.5">FOG</text><rect x="24" y="70" width="34" height="18" rx="9" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><circle cx="33" cy="79" r="6" fill="var(--fig-muted)" fill-opacity="0.6"/><g class="graphics-shader-variants-k1"><rect x="24" y="70" width="34" height="18" rx="9" fill="var(--fig-accent)"/><circle cx="49" cy="79" r="6" fill="var(--fig-bg)"/></g><text class="graphics-shader-variants-kw" x="68" y="83.5">NORMAL_MAP</text><rect x="24" y="96" width="34" height="18" rx="9" fill="var(