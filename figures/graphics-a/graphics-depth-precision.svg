<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="Log-log plot of the smallest depth gap a depth buffer can resolve against distance. Standard 24-bit depth grows with distance squared, reaching 0.15 m at 500 m and 0.6 m at 1000 m; reversed-Z with float32 grows only linearly and stays far smaller."><style>.graphics-depth-precision-t{font-size:13px;fill:var(--fig-ink)}.graphics-depth-precision-m{font-size:12px;fill:var(--fig-muted)}.graphics-depth-precision-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-depth-precision-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-depth-precision-e{text-anchor:end}.graphics-depth-precision-mid{text-anchor:middle}@keyframes graphics-depth-precision-sc{0%,6%{transform:translate(0px,0px)}86%,100%{transform:translate(504px,0px)}}@keyframes graphics-depth-precision-a{0%,6%{transform:translate(0px,0px)}86%,100%{transform:translate(504px,-195px)}}@keyframes graphics-depth-precision-b{0%,6%{transform:translate(0px,0px)}86%,100%{transform:translate(504px,-97.5px)}}@keyframes graphics-depth-precision-f{0%,90%{opacity:1}96%,100%{opacity:0}}.graphics-depth-precision-sc{animation:graphics-depth-precision-sc 6s linear infinite,graphics-depth-precision-f 6s infinite}.graphics-depth-precision-a{animation:graphics-depth-precision-a 6s linear infinite,graphics-depth-precision-f 6s infinite}.graphics-depth-precision-b{animation:graphics-depth-precision-b 6s linear infinite,graphics-depth-precision-f 6s infinite}.graphics-depth-precision-sc,.graphics-depth-precision-a,.graphics-depth-precision-b{opacity:0}</style><line x1="96" y1="36" x2="600" y2="36" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-e" x="88" y="40">1 m</text><line x1="96" y1="101" x2="600" y2="101" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-e" x="88" y="105">1 cm</text><line x1="96" y1="166" x2="600" y2="166" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-e" x="88" y="170">0.1 mm</text><line x1="96" y1="231" x2="600" y2="231" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-e" x="88" y="235">1 µm</text><line x1="96" y1="296" x2="600" y2="296" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-e" x="88" y="300">10 nm</text><line x1="96" y1="36" x2="96" y2="296" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-mid" x="96" y="314">1 m</text><line x1="264" y1="36" x2="264" y2="296" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-mid" x="264" y="314">10 m</text><line x1="432" y1="36" x2="432" y2="296" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-mid" x="432" y="314">100 m</text><line x1="600" y1="36" x2="600" y2="296" stroke="var(--fig-line)" stroke-width="1"/><text class="graphics-depth-precision-m graphics-depth-precision-mid" x="600" y="314">1000 m</text><text class="graphics-depth-precision-m graphics-depth-precision-mid" x="348" y="336">distance from camera (near = 0.1, far = 1000, log scale)</text><text class="graphics-depth-precision-m" x="16" y="20">smallest resolvable gap (log scale)</text><line x1="96" y1="238.3" x2="600" y2="43.3" stroke="var(--fig-bad)" stroke-width="2.5"/><line x1="96" y1="270.8" x2="600" y2="173.3" stroke="var(--fig-ok)" stroke-width="2.5"/><circle cx="264" cy="173.3" r="4.5" fill="var(--fig-bad)"/><text class="graphics-depth-precision-t" x="274" y="193.3">0.00006 m at 10 m</text><circle cx="432" cy="108.3" r="4.5" fill="var(--fig-bad)"/><text class="graphics-depth-precision-t" x="422" y="96.3" style="text-anchor:end">0.006 m at 100 m</text><circle cx="549.4" cy="62.9" r="4.5" fill="var(--fig-bad)"/><circle cx="600" cy="43.3" r="4.5" fill="var(--fig-bad)"/><text class="graphics-depth-precision-t" x="600" y="104" style="text-anchor:end">0.15 m at 500 m</text><text x="110" y="62" style="font-size:13px;font-weight:600;fill:var(--fig-bad)">standard Z, 24-bit fixed</text><text class="graphics-depth-precision-m" x="110" y="80">gap ≈ z² / (near · 2^24)</text><text x="344.2" y="252.8" style="font-size:13px;font-weight:600;fill:var(--fig-ok)">reversed-Z, float32</text><text class="graphics-depth-precision-m" x="344.2" y="268.8">gap grows only in step with z</text><line class="graphics-depth-precision-sc" x1="96" y1="36" x2="96" y2="296" stroke="var(--fig-accent)" stroke-width="1.5" stroke-dasharray="4 4"/><circle class="graphics-depth-precision-a" cx="96" cy="238.3" r="6" fill="var(--fig-bg)" stroke="var(--fig-bad)" stroke-width="2.5"/><circle class="graphics-depth-precision-b" cx="96" cy="270.8" r="6" fill="var(--fig-bg)" stroke="var(--fig-ok)" stroke-width="2.5"/></svg>