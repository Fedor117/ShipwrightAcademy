<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" role="img" aria-label="A head vertex travels object, world, view, clip, NDC and screen space, with its coordinates in each: the model, view and projection matrices, then the divide by w and the viewport mapping."><style>.graphics-space-chain-t{font-size:13px;fill:var(--fig-ink)}.graphics-space-chain-m{font-size:12px;fill:var(--fig-muted)}.graphics-space-chain-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-space-chain-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-space-chain-e{text-anchor:end}.graphics-space-chain-mid{text-anchor:middle}@keyframes graphics-space-chain-dot{0%,11%{transform:translate(0px,0px);opacity:1}16.7%,27.7%{transform:translate(212px,0px);opacity:1}33.3%,44.3%{transform:translate(424px,0px);opacity:1}50%,61%{transform:translate(424px,170px);opacity:1}66.7%,77.7%{transform:translate(212px,170px);opacity:1}83.3%,94.3%{transform:translate(0px,170px);opacity:1}97%{transform:translate(0px,170px);opacity:0}98%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:1}}@keyframes graphics-space-chain-hl{0%,14.7%{opacity:1}17.2%,98%{opacity:0}100%{opacity:1}}.graphics-space-chain-dot{animation:graphics-space-chain-dot 7.2s infinite}.graphics-space-chain-hl{opacity:0;animation:graphics-space-chain-hl 7.2s infinite}.graphics-space-chain-h0{animation-delay:0s}.graphics-space-chain-h1{animation-delay:-6s}.graphics-space-chain-h2{animation-delay:-4.8s}.graphics-space-chain-h3{animation-delay:-3.6s}.graphics-space-chain-h4{animation-delay:-2.4s}.graphics-space-chain-h5{animation-delay:-1.2s}.graphics-space-chain-x{font-size:13px;fill:var(--fig-accent);font-weight:600}.graphics-space-chain-op{font-size:12px;font-weight:600;fill:var(--fig-accent2)}</style><text class="graphics-space-chain-m graphics-space-chain-c" x="28" y="24">clip = Projection · View · Model · position</text><rect x="28" y="44" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h0" x="28" y="44" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="42" y="70">Object</text><text class="graphics-space-chain-x graphics-space-chain-c" x="42" y="100" style="font-size:12px">(0.1, 1.7, 0)</text><text class="graphics-space-chain-m" x="42" y="124">relative to the pivot</text><rect x="240" y="44" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h1" x="240" y="44" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="254" y="70">World</text><text class="graphics-space-chain-x graphics-space-chain-c" x="254" y="100" style="font-size:12px">(10.1, 1.7, 5)</text><text class="graphics-space-chain-m" x="254" y="124">shared scene space</text><rect x="452" y="44" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h2" x="452" y="44" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="466" y="70">View</text><text class="graphics-space-chain-x graphics-space-chain-c" x="466" y="100" style="font-size:12px">(0.1, 0.5, −5)</text><text class="graphics-space-chain-m" x="466" y="124">camera looks down −z</text><rect x="452" y="214" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h3" x="452" y="214" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="466" y="240">Clip</text><text class="graphics-space-chain-x graphics-space-chain-c" x="466" y="270" style="font-size:12px">(0.1, 0.87, 4.9, 5)</text><text class="graphics-space-chain-m" x="466" y="294">w = view depth</text><rect x="240" y="214" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h4" x="240" y="214" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="254" y="240">NDC</text><text class="graphics-space-chain-x graphics-space-chain-c" x="254" y="270" style="font-size:12px">(0.02, 0.17, 0.98)</text><text class="graphics-space-chain-m" x="254" y="294">x, y in −1..1, z 0..1</text><rect x="28" y="214" width="160" height="96" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-space-chain-hl graphics-space-chain-h5" x="28" y="214" width="160" height="96" rx="10" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="2"/><text class="graphics-space-chain-h" x="42" y="240">Screen</text><text class="graphics-space-chain-x graphics-space-chain-c" x="42" y="270" style="font-size:12px">(1305, 595) px</text><text class="graphics-space-chain-m" x="42" y="294">2560×1440, y from top</text><line x1="192" y1="100" x2="230" y2="100" stroke="var(--fig-muted)" stroke-width="1.5"/><polygon points="227,95 236,100 227,105" fill="var(--fig-muted)"/><text class="graphics-space-chain-op graphics-space-chain-mid" x="214" y="90">Model</text><line x1="404" y1="100" x2="442" y2="100" stroke="var(--fig-muted)" stroke-width="1.5"/><polygon points="439,95 448,100 439,105" fill="var(--fig-muted)"/><text class="graphics-space-chain-op graphics-space-chain-mid" x="426" y="90">View</text><line x1="532" y1="144" x2="532" y2="204" stroke="var(--fig-muted)" stroke-width="1.5"/><polygon points="527,201 532,210 537,201" fill="var(--fig-muted)"/><text class="graphics-space-chain-op graphics-space-chain-e" x="522" y="181">Projection</text><line x1="448" y1="270" x2="410" y2="270" stroke="var(--fig-muted)" stroke-width="1.5"/><polygon points="413,265 404,270 413,275" fill="var(--fig-muted)"/><text class="graphics-space-chain-op graphics-space-chain-mid" x="426" y="260">÷ w</text><line x1="236" y1="270" x2="198" y2="270" stroke="var(--fig-muted)" stroke-width="1.5"/><polygon points="201,265 192,270 201,275" fill="var(--fig-muted)"/><text class="graphics-space-chain-op graphics-space-chain-mid" x="214" y="260" style="font-size:11.5px">viewport</text><circle class="graphics-space-chain-dot" cx="170" cy="62" r="6" fill="var(--fig-accent)"/></svg>