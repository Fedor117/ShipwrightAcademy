<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-label="Two panels. Left: a square rotates 60 degrees in place, then moves along x, ending turned at the new spot. Right: the square moves along x first, then the 60 degree rotation swings it around the origin like a planet."><style>.graphics-transform-order-t{font-size:13px;fill:var(--fig-ink)}.graphics-transform-order-m{font-size:12px;fill:var(--fig-muted)}.graphics-transform-order-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-transform-order-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-transform-order-e{text-anchor:end}.graphics-transform-order-mid{text-anchor:middle}@keyframes graphics-transform-order-lr{0%,10%{transform:rotate(0deg)}35%,94%{transform:rotate(-60deg)}95%,100%{transform:rotate(0deg)}}@keyframes graphics-transform-order-lt{0%,45%{transform:translateX(0px)}70%,94%{transform:translateX(150px)}95%,100%{transform:translateX(0px)}}@keyframes graphics-transform-order-rt{0%,10%{transform:translateX(0px)}35%,94%{transform:translateX(150px)}95%,100%{transform:translateX(0px)}}@keyframes graphics-transform-order-rr{0%,45%{transform:rotate(0deg)}70%,94%{transform:rotate(-60deg)}95%,100%{transform:rotate(0deg)}}@keyframes graphics-transform-order-fd{0%,88%{opacity:1}92%,96%{opacity:0}100%{opacity:1}}.graphics-transform-order-lr{transform-box:view-box;transform-origin:56px 236px;transform:rotate(-60deg);animation:graphics-transform-order-lr 6s infinite}.graphics-transform-order-lt{transform-box:view-box;transform-origin:56px 236px;transform:translateX(150px);animation:graphics-transform-order-lt 6s infinite}.graphics-transform-order-rt{transform-box:view-box;transform-origin:368px 236px;transform:translateX(150px);animation:graphics-transform-order-rt 6s infinite}.graphics-transform-order-rr{transform-box:view-box;transform-origin:368px 236px;transform:rotate(-60deg);animation:graphics-transform-order-rr 6s infinite}.graphics-transform-order-f{animation:graphics-transform-order-fd 6s infinite}</style><rect x="12" y="10" width="300" height="296" rx="12" fill="var(--fig-panel)"/><rect x="328" y="10" width="300" height="296" rx="12" fill="var(--fig-panel)"/><text class="graphics-transform-order-h" x="30" y="40">Rotate, then translate</text><text class="graphics-transform-order-m graphics-transform-order-c" x="30" y="61">M = T · R   (R applies first)</text><text class="graphics-transform-order-h" x="346" y="40">Translate, then rotate</text><text class="graphics-transform-order-m graphics-transform-order-c" x="346" y="61">M = R · T   (T applies first)</text><line x1="34" y1="236" x2="292" y2="236" stroke="var(--fig-line)" stroke-width="1.5"/><line x1="56" y1="258" x2="56" y2="84" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-transform-order-m graphics-transform-order-mid" x="56" y="274">origin</text><text class="graphics-transform-order-m" x="280" y="228">x</text><line x1="346" y1="236" x2="608" y2="236" stroke="var(--fig-line)" stroke-width="1.5"/><line x1="368" y1="258" x2="368" y2="84" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-transform-order-m graphics-transform-order-mid" x="368" y="274">origin</text><text class="graphics-transform-order-m" x="596" y="228">x</text><g transform="translate(150 0) rotate(-60 56 236)"><rect x="38" y="218" width="36" height="36" rx="5" fill="none" stroke="var(--fig-accent)" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/></g><g transform="rotate(-60 368 236) translate(150 0)"><rect x="350" y="218" width="36" height="36" rx="5" fill="none" stroke="var(--fig-accent)" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/></g><path d="M518 236 A150 150 0 0 0 443 106.1" fill="none" stroke="var(--fig-accent2)" stroke-width="1.5" stroke-dasharray="5 5"/><text class="graphics-transform-order-m" x="508" y="140" style="fill:var(--fig-accent2)">swings around</text><text class="graphics-transform-order-m" x="508" y="156" style="fill:var(--fig-accent2)">the origin</text><text class="graphics-transform-order-m" x="168" y="184">turned in place</text><text class="graphics-transform-order-m" x="168" y="200">at the new spot</text><g class="graphics-transform-order-f"><g class="graphics-transform-order-lt"><g class="graphics-transform-order-lr"><rect x="38" y="218" width="36" height="36" rx="5" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="2"/><line x1="56" y1="236" x2="74" y2="236" stroke="var(--fig-ink)" stroke-width="2"/><circle cx="74" cy="236" r="3.5" fill="var(--fig-ink)"/></g></g></g><g class="graphics-transform-order-f"><g class="graphics-transform-order-rr"><g class="graphics-transform-order-rt"><rect x="350" y="218" width="36" height="36" rx="5" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="2"/><line x1="368" y1="236" x2="386" y2="236" stroke="var(--fig-ink)" stroke-width="2"/><circle cx="386" cy="236" r="3.5" fill="var(--fig-ink)"/></g></g></g><text class="graphics-transform-order-m" x="30" y="292">1 rotate 60°  ·  2 move +x by 150</text><text class="graphics-transform-order-m" x="346" y="292">1 move +x by 150  ·  2 rotate 60°</text></svg>