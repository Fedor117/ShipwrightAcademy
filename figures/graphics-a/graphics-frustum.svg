<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-label="Side view of a 60 degree perspective frustum with near and far planes. A bar of fixed height moves away from the camera and its height on screen shrinks in proportion to one over depth."><style>.graphics-frustum-t{font-size:13px;fill:var(--fig-ink)}.graphics-frustum-m{font-size:12px;fill:var(--fig-muted)}.graphics-frustum-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-frustum-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-frustum-e{text-anchor:end}.graphics-frustum-mid{text-anchor:middle}@keyframes graphics-frustum-o{0%,10%{transform:translateX(0px)}20%{transform:translateX(40px)}30%{transform:translateX(90px)}40%{transform:translateX(140px)}50%,60%{transform:translateX(190px)}70%{transform:translateX(140px)}80%{transform:translateX(90px)}90%{transform:translateX(40px)}100%{transform:translateX(0px)}}@keyframes graphics-frustum-u{0%,10%{transform:rotate(-15.26deg) scaleX(1.140)}20%{transform:rotate(-11.31deg) scaleX(1.530)}30%{transform:rotate(-8.53deg) scaleX(2.022)}40%{transform:rotate(-6.84deg) scaleX(2.518)}50%,60%{transform:rotate(-5.71deg) scaleX(3.015)}70%{transform:rotate(-6.84deg) scaleX(2.518)}80%{transform:rotate(-8.53deg) scaleX(2.022)}90%{transform:rotate(-11.31deg) scaleX(1.530)}100%{transform:rotate(-15.26deg) scaleX(1.140)}}@keyframes graphics-frustum-l{0%,10%{transform:rotate(15.26deg) scaleX(1.140)}20%{transform:rotate(11.31deg) scaleX(1.530)}30%{transform:rotate(8.53deg) scaleX(2.022)}40%{transform:rotate(6.84deg) scaleX(2.518)}50%,60%{transform:rotate(5.71deg) scaleX(3.015)}70%{transform:rotate(6.84deg) scaleX(2.518)}80%{transform:rotate(8.53deg) scaleX(2.022)}90%{transform:rotate(11.31deg) scaleX(1.530)}100%{transform:rotate(15.26deg) scaleX(1.140)}}@keyframes graphics-frustum-s{0%,10%{transform:scaleY(1.000)}20%{transform:scaleY(0.733)}30%{transform:scaleY(0.550)}40%{transform:scaleY(0.440)}50%,60%{transform:scaleY(0.367)}70%{transform:scaleY(0.440)}80%{transform:scaleY(0.550)}90%{transform:scaleY(0.733)}100%{transform:scaleY(1.000)}}.graphics-frustum-o{animation:graphics-frustum-o 7s infinite}.graphics-frustum-u{transform-box:view-box;transform-origin:40px 200px;animation:graphics-frustum-u 7s infinite;transform:rotate(-15.26deg) scaleX(1.140)}.graphics-frustum-l{transform-box:view-box;transform-origin:40px 200px;animation:graphics-frustum-l 7s infinite;transform:rotate(15.26deg) scaleX(1.140)}.graphics-frustum-s{transform-box:view-box;transform-origin:525px 200px;animation:graphics-frustum-s 7s infinite}</style><path d="M40 200 L360 15.2 L360 384.8 Z" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-opacity="0.5" stroke-width="1.5"/><line x1="70" y1="182.7" x2="70" y2="217.3" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><line x1="360" y1="15.2" x2="360" y2="384.8" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="200" x2="374" y2="200" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 5"/><text class="graphics-frustum-t graphics-frustum-mid" x="70" y="239.3">near</text><text class="graphics-frustum-t" x="370" y="31.2">far</text><path d="M86 173.4 A53 53 0 0 1 86 226.6" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/><text class="graphics-frustum-m" x="14" y="120">60° vertical FOV</text><rect x="12" y="189" width="22" height="22" rx="5" fill="var(--fig-ink)"/><polygon points="33,194 40,200 33,206" fill="var(--fig-ink)"/><text class="graphics-frustum-m" x="60" y="384">depth = distance along the view axis</text><line class="graphics-frustum-u" x1="40" y1="200" x2="140" y2="200" stroke="var(--fig-accent2)" stroke-opacity="0.6" stroke-width="1.5"/><line class="graphics-frustum-l" x1="40" y1="200" x2="140" y2="200" stroke="var(--fig-accent2)" stroke-opacity="0.6" stroke-width="1.5"/><g class="graphics-frustum-o"><line x1="150" y1="170" x2="150" y2="230" stroke="var(--fig-accent2)" stroke-width="7" stroke-linecap="round"/></g><text class="graphics-frustum-h" x="450" y="60">On screen</text><rect x="470" y="90" width="110" height="220" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-frustum-m graphics-frustum-e" x="462" y="102">+1</text><text class="graphics-frustum-m graphics-frustum-e" x="462" y="204">0</text><text class="graphics-frustum-m graphics-frustum-e" x="462" y="310">−1</text><line x1="492" y1="148.1" x2="558" y2="148.1" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="492" y1="251.9" x2="558" y2="251.9" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="3 4"/><rect class="graphics-frustum-s" x="516" y="148.1" width="18" height="103.9" rx="6" fill="var(--fig-accent2)"/><text class="graphics-frustum-t graphics-frustum-c" x="450" y="346">y_ndc = y_view / depth</text><text class="graphics-frustum-m" x="450" y="366">x_ndc uses the same rule</text><text class="graphics-frustum-m" x="450" y="384">2.7× the depth: 1/2.7 the height</text></svg>