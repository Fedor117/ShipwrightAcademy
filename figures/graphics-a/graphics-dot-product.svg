<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Unit vector a fixed, unit vector b rotating from 30 to 180 degrees; the projection of b onto a shrinks from 0.866 to 0 to minus 1, and b is inside the 90 degree cone only while the dot product exceeds 0.707."><style>.graphics-dot-product-t{font-size:13px;fill:var(--fig-ink)}.graphics-dot-product-m{font-size:12px;fill:var(--fig-muted)}.graphics-dot-product-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-dot-product-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-dot-product-e{text-anchor:end}.graphics-dot-product-mid{text-anchor:middle}@keyframes graphics-dot-product-rot{0%,20%{transform:rotate(-30deg)}25%,45%{transform:rotate(-60deg)}50%,70%{transform:rotate(-90deg)}75%,92%{transform:rotate(-180deg)}100%{transform:rotate(-30deg)}}@keyframes graphics-dot-product-pr{0%,20%{transform:scaleX(0.866)}25%,45%{transform:scaleX(0.5)}50%,70%{transform:scaleX(0)}75%,92%{transform:scaleX(-1)}100%{transform:scaleX(0.866)}}@keyframes graphics-dot-product-pp{0%,20%{transform:translateX(121.244px) scaleY(0.5)}25%,45%{transform:translateX(70px) scaleY(0.866)}50%,70%{transform:translateX(0px) scaleY(1)}75%,92%{transform:translateX(-140px) scaleY(0)}100%{transform:translateX(121.244px) scaleY(0.5)}}@keyframes graphics-dot-product-lab{0%,17%{opacity:1}19%,98%{opacity:0}100%{opacity:1}}.graphics-dot-product-b{transform-box:view-box;transform-origin:170px 200px;transform:rotate(-30deg);animation:graphics-dot-product-rot 8s infinite}.graphics-dot-product-pr{transform-box:view-box;transform-origin:170px 200px;transform:scaleX(0.866);animation:graphics-dot-product-pr 8s infinite}.graphics-dot-product-pp{transform-box:view-box;transform-origin:170px 200px;transform:translateX(121.244px) scaleY(0.5);animation:graphics-dot-product-pp 8s infinite}.graphics-dot-product-l{opacity:0;animation:graphics-dot-product-lab 8s infinite}.graphics-dot-product-l1{opacity:1}.graphics-dot-product-l2{animation-delay:-6s}.graphics-dot-product-l3{animation-delay:-4s}.graphics-dot-product-l4{animation-delay:-2s}.graphics-dot-product-big{font-size:16px;font-weight:600;fill:var(--fig-ink)}.graphics-dot-product-v{font-size:15px;font-weight:600;fill:var(--fig-accent2)}.graphics-dot-product-ok{font-size:13px;font-weight:600;fill:var(--fig-ok)}.graphics-dot-product-bad{font-size:13px;font-weight:600;fill:var(--fig-bad)}.graphics-dot-product-n{font-size:13px;font-weight:600;fill:var(--fig-ink)}</style><path d="M170 200 L269 101 A140 140 0 0 1 269 299 Z" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-opacity="0.35" stroke-width="1.5"/><text class="graphics-dot-product-m" x="282" y="302">90° cone</text><path d="M30 200 A140 140 0 0 1 310 200" fill="none" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="22" y1="200" x2="330" y2="200" stroke="var(--fig-line)" stroke-width="1.5"/><rect class="graphics-dot-product-pr" x="170" y="205" width="140" height="7" rx="3.5" fill="var(--fig-accent2)" fill-opacity="0.55"/><line class="graphics-dot-product-pp" x1="170" y1="200" x2="170" y2="60" stroke="var(--fig-accent2)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="170" y1="200" x2="300" y2="200" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><polygon points="298,193 312,200 298,207" fill="var(--fig-accent)"/><text x="318" y="205" style="font-size:15px;font-weight:600;fill:var(--fig-accent)">a</text><g class="graphics-dot-product-b"><line x1="170" y1="200" x2="298" y2="200" stroke="var(--fig-accent2)" stroke-width="3" stroke-linecap="round"/><polygon points="298,193 312,200 298,207" fill="var(--fig-accent2)"/></g><circle cx="170" cy="200" r="4" fill="var(--fig-ink)"/><text class="graphics-dot-product-t" x="370" y="52">a · b = |a| |b| cos θ</text><text class="graphics-dot-product-m" x="370" y="74">for unit vectors: a · b = cos θ</text><g class="graphics-dot-product-l graphics-dot-product-l1"><text class="graphics-dot-product-big" x="370" y="122">θ = 30°</text><text class="graphics-dot-product-v" x="370" y="148">a · b = 0.866</text><text class="graphics-dot-product-ok" x="370" y="176">inside the cone</text><text class="graphics-dot-product-m" x="370" y="196">0.866 > 0.707 = cos 45°</text></g><g class="graphics-dot-product-l graphics-dot-product-l2"><text class="graphics-dot-product-big" x="370" y="122">θ = 60°</text><text class="graphics-dot-product-v" x="370" y="148">a · b = 0.5</text><text class="graphics-dot-product-bad" x="370" y="176">outside the cone</text><text class="graphics-dot-product-m" x="370" y="196">0.5 < 0.707</text></g><g class="graphics-dot-product-l graphics-dot-product-l3"><text class="graphics-dot-product-big" x="370" y="122">θ = 90°</text><text class="graphics-dot-product-v" x="370" y="148">a · b = 0</text><text class="graphics-dot-product-n" x="370" y="176">perpendicular</text><text class="graphics-dot-product-m" x="370" y="196">no component along a</text></g><g class="graphics-dot-product-l graphics-dot-product-l4"><text class="graphics-dot-product-big" x="370" y="122">θ = 180°</text><text class="graphics-dot-product-v" x="370" y="148">a · b = −1</text><text class="graphics-dot-product-n" x="370" y="176">opposite direction</text><text class="graphics-dot-product-m" x="370" y="196">projection points backwards</text></g><line x1="370" y1="232" x2="392" y2="232" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><text class="graphics-dot-product-t" x="402" y="236">a: guard forward</text><line x1="370" y1="256" x2="392" y2="256" stroke="var(--fig-accent2)" stroke-width="3" stroke-linecap="round"/><text class="graphics-dot-product-t" x="402" y="260">b: direction to player</text><rect x="370" y="276" width="22" height="7" rx="3.5" fill="var(--fig-accent2)" fill-opacity="0.55"/><text class="graphics-dot-product-t" x="402" y="284">projection of b onto a</text></svg>