<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="Six pipeline stages in a row: input assembly, vertex shader, clip and cull, rasterize, fragment shader, output merger. Above each, the same triangle as it looks after that stage, from three indexed vertices to a covered pixel grid to depth-tested pixels."><style>.graphics-pipeline-stages-t{font-size:13px;fill:var(--fig-ink)}.graphics-pipeline-stages-m{font-size:12px;fill:var(--fig-muted)}.graphics-pipeline-stages-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-pipeline-stages-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-pipeline-stages-e{text-anchor:end}.graphics-pipeline-stages-mid{text-anchor:middle}@keyframes graphics-pipeline-stages-hl{0%,14%{opacity:1}17.5%,98%{opacity:0}100%{opacity:1}}.graphics-pipeline-stages-hl{opacity:0;animation:graphics-pipeline-stages-hl 6s infinite}.graphics-pipeline-stages-h1{animation-delay:-5s}.graphics-pipeline-stages-h2{animation-delay:-4s}.graphics-pipeline-stages-h3{animation-delay:-3s}.graphics-pipeline-stages-h4{animation-delay:-2s}.graphics-pipeline-stages-h5{animation-delay:-1s}.graphics-pipeline-stages-hl.graphics-pipeline-stages-h0{opacity:1}.graphics-pipeline-stages-s{font-size:11.5px;fill:var(--fig-muted)}.graphics-pipeline-stages-n{font-size:11px;fill:var(--fig-muted)}</style><text class="graphics-pipeline-stages-h" x="10" y="26">One triangle through the pipeline</text><rect x="372" y="15" width="14" height="14" rx="4" fill="var(--fig-accent)" fill-opacity="0.16" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-pipeline-stages-m" x="392" y="26">programmable</text><rect x="490" y="15" width="14" height="14" rx="4" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-pipeline-stages-m" x="510" y="26">fixed-function</text><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h0" x="6" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="10" y="178" width="92" height="56" rx="10" fill="var(--fig-panel)" fill-opacity="1" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="56" y="202" style="font-weight:600">Input</text><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="56" y="220" style="font-weight:600">assembly</text><text class="graphics-pipeline-stages-s graphics-pipeline-stages-mid" x="56" y="254">vertices + indices</text><polygon points="107,201 114,206 107,211" fill="var(--fig-muted)"/><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h1" x="112" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="116" y="178" width="92" height="56" rx="10" fill="var(--fig-accent)" fill-opacity="0.16" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="162" y="202" style="font-weight:600">Vertex</text><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="162" y="220" style="font-weight:600">shader</text><text class="graphics-pipeline-stages-s graphics-pipeline-stages-mid" x="162" y="254">clip-space positions</text><polygon points="213,201 220,206 213,211" fill="var(--fig-muted)"/><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h2" x="218" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="222" y="178" width="92" height="56" rx="10" fill="var(--fig-panel)" fill-opacity="1" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="268" y="202" style="font-weight:600">Clip &</text><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="268" y="220" style="font-weight:600">cull</text><text class="graphics-pipeline-stages-s graphics-pipeline-stages-mid" x="268" y="254">clipped to the view</text><polygon points="319,201 326,206 319,211" fill="var(--fig-muted)"/><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h3" x="324" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="328" y="178" width="92" height="56" rx="10" fill="var(--fig-panel)" fill-opacity="1" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="374" y="211" style="font-weight:600">Rasterize</text><text class="graphics-pipeline-stages-s graphics-pipeline-stages-mid" x="374" y="254">fragments</text><polygon points="425,201 432,206 425,211" fill="var(--fig-muted)"/><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h4" x="430" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="434" y="178" width="92" height="56" rx="10" fill="var(--fig-accent)" fill-opacity="0.16" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="480" y="202" style="font-weight:600">Fragment</text><text class="graphics-pipeline-stages-t graphics-pipeline-stages-mid" x="480" y="220" style="font-weight:600">shader</text><text class="graphics-pipeline-stages-s graphics-pipeline-stages-mid" x="480" y="254">shaded fragments</text><polygon points="531,201 538,206 531,211" fill="var(--fig-muted)"/><rect class="graphics-pipeline-stages-hl graphics-pipeline-stages-h5" x="536" y="44" width="100" height="194" rx="12" fill="var(--fig-accent)" fill-opacity="0.06" stroke="var(--fig-accent)" stroke-width="2"/><rect x="540" y="178" width="92" height="56" rx="10" fill="var(--fig-panel)" fill-opacity="1" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-pipeline-stages-t grap