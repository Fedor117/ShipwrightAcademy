<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-label="Yaw, pitch and roll axes of an Euler gimbal. As pitch rises from 0 to 90 degrees the roll axis tilts until it lies on the yaw axis, so two of the three angles spin about the same axis: gimbal lock."><style>.graphics-gimbal-lock-t{font-size:13px;fill:var(--fig-ink)}.graphics-gimbal-lock-m{font-size:12px;fill:var(--fig-muted)}.graphics-gimbal-lock-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-gimbal-lock-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-gimbal-lock-e{text-anchor:end}.graphics-gimbal-lock-mid{text-anchor:middle}@keyframes graphics-gimbal-lock-sh{0%,12%{transform:rotate(-38.66deg) scaleX(0.64)}25%{transform:rotate(19.53deg) scaleX(0.459)}37.5%{transform:rotate(69.43deg) scaleX(0.711)}50%,88%{transform:rotate(90deg) scaleX(1)}92%{transform:rotate(69.43deg) scaleX(0.711)}96%{transform:rotate(19.53deg) scaleX(0.459)}100%{transform:rotate(-38.66deg) scaleX(0.64)}}@keyframes graphics-gimbal-lock-hd{0%,12%{transform:rotate(-38.66deg) translateX(70.4px)}25%{transform:rotate(19.53deg) translateX(50.5px)}37.5%{transform:rotate(69.43deg) translateX(78.2px)}50%,88%{transform:rotate(90deg) translateX(110px)}92%{transform:rotate(69.43deg) translateX(78.2px)}96%{transform:rotate(19.53deg) translateX(50.5px)}100%{transform:rotate(-38.66deg) translateX(70.4px)}}@keyframes graphics-gimbal-lock-zt{0%,12%{transform:translate(51px,-55.2px)}25%{transform:translate(46.5px,22.9px)}37.5%{transform:translate(15.8px,90.1px)}50%,88%{transform:translate(-18px,128px)}92%{transform:translate(15.8px,90.1px)}96%{transform:translate(46.5px,22.9px)}100%{transform:translate(51px,-55.2px)}}@keyframes graphics-gimbal-lock-bar{0%,12%{transform:scaleX(0)}50%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}@keyframes graphics-gimbal-lock-s0{0%,12%{opacity:1}15%,97%{opacity:0}100%{opacity:1}}@keyframes graphics-gimbal-lock-s1{0%,13%{opacity:0}16%,46%{opacity:1}49%,100%{opacity:0}}@keyframes graphics-gimbal-lock-s2{0%,47%{opacity:0}50%,88%{opacity:1}91%,100%{opacity:0}}.graphics-gimbal-lock-sh{transform-box:view-box;transform-origin:170px 170px;transform:rotate(90deg) scaleX(1);animation:graphics-gimbal-lock-sh 7s infinite}.graphics-gimbal-lock-hd{transform-box:view-box;transform-origin:170px 170px;transform:rotate(90deg) translateX(110px);animation:graphics-gimbal-lock-hd 7s infinite}.graphics-gimbal-lock-zt{transform:translate(-18px,128px);animation:graphics-gimbal-lock-zt 7s infinite}.graphics-gimbal-lock-bar{transform-box:view-box;transform-origin:430px 0px;animation:graphics-gimbal-lock-bar 7s infinite}.graphics-gimbal-lock-s0{opacity:0;animation:graphics-gimbal-lock-s0 7s infinite}.graphics-gimbal-lock-s1{opacity:0;animation:graphics-gimbal-lock-s1 7s infinite}.graphics-gimbal-lock-s2{animation:graphics-gimbal-lock-s2 7s infinite}.graphics-gimbal-lock-k{font-size:15px;font-weight:600}</style><line x1="170" y1="36" x2="170" y2="284" stroke="var(--fig-accent)" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="170" y1="170" x2="170" y2="62" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><polygon points="164,64 170,50 176,64" fill="var(--fig-accent)"/><text class="graphics-gimbal-lock-k" x="182" y="60" style="fill:var(--fig-accent)">Y</text><line x1="170" y1="170" x2="272" y2="170" stroke="var(--fig-ink)" stroke-width="3" stroke-linecap="round"/><polygon points="270,164 284,170 270,176" fill="var(--fig-ink)"/><text class="graphics-gimbal-lock-k" x="292" y="175" style="fill:var(--fig-ink)">X</text><line class="graphics-gimbal-lock-sh" x1="170" y1="170" x2="280" y2="170" stroke="var(--fig-accent2)" stroke-width="3.5"/><g class="graphics-gimbal-lock-hd"><polygon points="158,163 172,170 158,177" fill="var(--fig-accent2)"/></g><text class="graphics-gimbal-lock-k graphics-gimbal-lock-zt graphics-gimbal-lock-mid" x="188" y="175" style="fill:var(--fig-accent2)">Z</text><circle cx="170" cy="170" r="5" fill="var(--fig-ink)"/><text class="graphics-gimbal-lock-h" x="384" y="44">Euler angles (Unity order Z, X, Y)</text><text class="graphics-gimbal-lock-m" x="384" y="84">pitch</text><rect x="430" y="74" width="180" height="12" rx="6" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1"/><rect class="graphics-gimbal-lock-bar" x="430" y="74" width="180" height="12" rx="6" fill="var(--fig-accent2)" fill-opacity="0.7"/><text class="graphics-gimbal-lock-m" x="430" y="104">0°</text><text class="graphics-gimbal-lock-m graphics-gimbal-lock-e" x="610" y="104">90°</text><g class="graphics-gimbal-lock-s0"><text x="384" y="144" style="font-size:14px;font-weight:600;fill:var(--fig-ok)">Three independent axes</text><text class="graphics-gimbal-lock-m" x="384" y="166">each angle turns the object</text><text class="graphics-gimbal-lock-m" x="384" y="184">a different way</text></g><g class="graphics-gimbal-lock-s1"><text x="384" y="144" style="font-size:14px;font-weight:600;fill:var(--fig-ink)">Pitch tilts the roll axis</text><text class="graphics-gimbal-lock-m" x="384" y="166">toward the yaw axis</text><text class="graphics-gimbal-lock-m" x="384" y="184"></text></g><g class="graphics-gimbal-lock-s2"><text x="384" y="144" style="font-size:14px;font-weight:600;fill:var(--fig-bad)">Gimbal lock at pitch 90°</text><text class="graphics-gimbal-lock-m" x="384" y="166">roll and yaw now spin about</text><text class="graphics-gimbal-lock-m" x="384" y="184">one axis: a degree of freedom lost</text></g><line x1="384" y1="218" x2="406" y2="218" stroke="var(--fig-accent)" stroke-width="3" stroke-linecap="round"/><text class="graphics-gimbal-lock-t" x="416" y="222">Y  yaw (outer ring)</text><line x1="384" y1="242" x2="406" y2="242" stroke="var(--fig-ink)" stroke-width="3" stroke-linecap="round"/><text class="graphics-gimbal-lock-t" x="416" y="246">X  pitch (middle ring)</text><line x1="384" y1="266" x2="406" y2="266" stroke="var(--fig-accent2)" stroke-width="3" stroke-linecap="round"/><text class="graphics-gimbal-lock-t" x="416" y="270">Z  roll (inner ring)</text><text class="graphics-gimbal-lock-t" x="384" y="302" style="font-weight:600">Fix: store a quaternion</text></svg>