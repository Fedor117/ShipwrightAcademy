<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" role="img" aria-label="Two CPU and GPU timelines over 60 ms, drawn to scale. Pipelined, the CPU records frame N+1 while the GPU renders frame N, so a frame completes every 14 ms. With a blocking readback the CPU waits for the GPU each frame and frames take 6 + 14 = 20 ms."><style>.graphics-cpu-gpu-overlap-t{font-size:13px;fill:var(--fig-ink)}.graphics-cpu-gpu-overlap-m{font-size:12px;fill:var(--fig-muted)}.graphics-cpu-gpu-overlap-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-cpu-gpu-overlap-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-cpu-gpu-overlap-e{text-anchor:end}.graphics-cpu-gpu-overlap-mid{text-anchor:middle}@keyframes graphics-cpu-gpu-overlap-ph{0%{transform:translateX(0px)}100%{transform:translateX(520px)}}.graphics-cpu-gpu-overlap-ph{animation:graphics-cpu-gpu-overlap-ph 6s linear infinite}.graphics-cpu-gpu-overlap-k{font-size:12px;font-weight:600;fill:var(--fig-ink);text-anchor:middle}.graphics-cpu-gpu-overlap-lab{font-size:13px;font-weight:600;fill:var(--fig-muted);text-anchor:end}</style><text class="graphics-cpu-gpu-overlap-h" x="16" y="24">Pipelined: the GPU renders frame N while the CPU records N+1</text><text class="graphics-cpu-gpu-overlap-lab" x="84" y="59">CPU</text><text class="graphics-cpu-gpu-overlap-lab" x="84" y="95">GPU</text><rect x="97" y="40" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="122" y="58">N</text><rect x="218.3" y="40" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="243.3" y="58">N+1</text><rect x="339.7" y="40" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="364.7" y="58">N+2</text><rect x="461" y="40" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="486" y="58">N+3</text><rect x="582.3" y="40" width="32.7" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="598.6" y="58">N+4</text><rect x="97" y="76" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="156.7" y="94">N−1</text><rect x="218.3" y="76" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="278" y="94">N</text><rect x="339.7" y="76" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="399.4" y="94">N+1</text><rect x="461" y="76" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="520.6" y="94">N+2</text><rect x="582.3" y="76" width="32.7" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="598.6" y="94">N+3</text><text class="graphics-cpu-gpu-overlap-m" x="104" y="130">a frame every 14 ms = max(CPU 6, GPU 14); the GPU is never idle</text><text class="graphics-cpu-gpu-overlap-h" x="16" y="170">Blocking readback: the CPU waits, nothing overlaps</text><text class="graphics-cpu-gpu-overlap-lab" x="84" y="205">CPU</text><text class="graphics-cpu-gpu-overlap-lab" x="84" y="241">GPU</text><rect x="97" y="186" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="122" y="204">N</text><rect x="149" y="186" width="119.3" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="208.7" y="204" style="fill:var(--fig-bad)">waits</text><rect x="97" y="222" width="50" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="122" y="240" style="fill:var(--fig-bad)">idle</text><rect x="149" y="222" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="208.7" y="240">N</text><rect x="270.3" y="186" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="295.3" y="204">N+1</text><rect x="322.3" y="186" width="119.3" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="382" y="204" style="fill:var(--fig-bad)">waits</text><rect x="270.3" y="222" width="50" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="295.3" y="240" style="fill:var(--fig-bad)">idle</text><rect x="322.3" y="222" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="382" y="240">N+1</text><rect x="443.7" y="186" width="50" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.22" stroke="var(--fig-accent)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="468.7" y="204">N+2</text><rect x="495.7" y="186" width="119.3" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="555.4" y="204" style="fill:var(--fig-bad)">waits</text><rect x="443.7" y="222" width="50" height="28" rx="6" fill="none" stroke="var(--fig-bad)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="468.7" y="240" style="fill:var(--fig-bad)">idle</text><rect x="495.7" y="222" width="119.3" height="28" rx="6" fill="var(--fig-accent2)" fill-opacity="0.22" stroke="var(--fig-accent2)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-k" x="555.4" y="240">N+2</text><text class="graphics-cpu-gpu-overlap-m" x="104" y="276">a frame every 20 ms = CPU 6 + GPU 14</text><line x1="96" y1="292" x2="616" y2="292" stroke="var(--fig-line)" stroke-width="1.5"/><line x1="96" y1="292" x2="96" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="96" y="314">0</text><line x1="182.7" y1="292" x2="182.7" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="182.7" y="314">10</text><line x1="269.3" y1="292" x2="269.3" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="269.3" y="314">20</text><line x1="356" y1="292" x2="356" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="356" y="314">30</text><line x1="442.7" y1="292" x2="442.7" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="442.7" y="314">40</text><line x1="529.3" y1="292" x2="529.3" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="529.3" y="314">50</text><line x1="616" y1="292" x2="616" y2="298" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-cpu-gpu-overlap-m graphics-cpu-gpu-overlap-mid" x="616" y="314">60 ms</text><path class="graphics-cpu-gpu-overlap-ph" d="M96 34V110M96 180V292" fill="none" stroke="var(--fig-ink)" stroke-opacity="0.55" stroke-width="1.5"/></svg>