<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Two warps of 32 lanes run the same if/else. In the divergent warp half the lanes are masked while shadeA runs and the other half while shadeB runs, so it pays 8 time units; the coherent warp skips shadeB and finishes in 5."><style>.graphics-warp-divergence-t{font-size:13px;fill:var(--fig-ink)}.graphics-warp-divergence-m{font-size:12px;fill:var(--fig-muted)}.graphics-warp-divergence-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-warp-divergence-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-warp-divergence-e{text-anchor:end}.graphics-warp-divergence-mid{text-anchor:middle}@keyframes graphics-warp-divergence-dact{0%,11.5%{opacity:1}13%,86.5%{opacity:0}88%,100%{opacity:1}}@keyframes graphics-warp-divergence-da{0%,11.5%{opacity:0}13%,49%{opacity:1}50.5%,100%{opacity:0}}@keyframes graphics-warp-divergence-db{0%,49%{opacity:0}50.5%,86.5%{opacity:1}88%,100%{opacity:0}}@keyframes graphics-warp-divergence-cact{0%,11.5%{opacity:1}13%,49%{opacity:0}50.5%,61.5%{opacity:1}63%,100%{opacity:0}}@keyframes graphics-warp-divergence-ca{0%,11.5%{opacity:0}13%,49%{opacity:1}50.5%,100%{opacity:0}}@keyframes graphics-warp-divergence-cdone{0%,61.5%{opacity:0}63%,100%{opacity:1}}@keyframes graphics-warp-divergence-hl{0%,12%{transform:translateY(0px)}12.5%,49.5%{transform:translateY(22px)}50%,87%{transform:translateY(66px)}87.5%,100%{transform:translateY(88px)}}@keyframes graphics-warp-divergence-pd{0%{transform:translateX(0px)}100%{transform:translateX(480px)}}@keyframes graphics-warp-divergence-pc{0%{transform:translateX(0px);opacity:1}62.5%{transform:translateX(300px);opacity:1}64%,100%{transform:translateX(300px);opacity:0}}.graphics-warp-divergence-dact{opacity:0;animation:graphics-warp-divergence-dact 8s infinite}.graphics-warp-divergence-da{opacity:1;animation:graphics-warp-divergence-da 8s infinite}.graphics-warp-divergence-db{opacity:0;animation:graphics-warp-divergence-db 8s infinite}.graphics-warp-divergence-cact{opacity:0;animation:graphics-warp-divergence-cact 8s infinite}.graphics-warp-divergence-ca{opacity:1;animation:graphics-warp-divergence-ca 8s infinite}.graphics-warp-divergence-cdone{opacity:0;animation:graphics-warp-divergence-cdone 8s infinite}.graphics-warp-divergence-hl{transform:translateY(22px);animation:graphics-warp-divergence-hl 8s infinite}.graphics-warp-divergence-pd{opacity:0;animation:graphics-warp-divergence-pd 8s linear infinite,graphics-warp-divergence-op 8s infinite}.graphics-warp-divergence-pc{opacity:0;animation:graphics-warp-divergence-pc 8s linear infinite}@keyframes graphics-warp-divergence-op{0%,100%{opacity:1}}.graphics-warp-divergence-code{font-size:13px;fill:var(--fig-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}</style><rect x="16" y="14" width="292" height="122" rx="10" fill="var(--fig-panel)"/><rect class="graphics-warp-divergence-hl" x="20" y="22" width="284" height="20" rx="5" fill="var(--fig-accent)" fill-opacity="0.16"/><text class="graphics-warp-divergence-code" x="30" y="37" xml:space="preserve">if (noise(uv) > 0.5)</text><text class="graphics-warp-divergence-code" x="30" y="59" xml:space="preserve">    c = shadeA();</text><text class="graphics-warp-divergence-code" x="30" y="81" xml:space="preserve">else</text><text class="graphics-warp-divergence-code" x="30" y="103" xml:space="preserve">    c = shadeB();</text><text class="graphics-warp-divergence-code" x="30" y="125" xml:space="preserve">return c;</text><text class="graphics-warp-divergence-h" x="330" y="34">32 lanes, one instruction stream</text><text class="graphics-warp-divergence-m" x="330" y="56">A noisy mask splits the warp: the hardware</text><text class="graphics-warp-divergence-m" x="330" y="74">runs shadeA with half the lanes masked off,</text><text class="graphics-warp-divergence-m" x="330" y="92">then shadeB with the other half.</text><text class="graphics-warp-divergence-m" x="330" y="118">A coherent warp runs one side only.</text><text class="graphics-warp-divergence-t" x="24" y="172" style="font-weight:600">Divergent warp: 16 lanes take each side</text><path d="M24 184h15v26h-15zM41.5 184h15v26h-15zM59 184h15v26h-15zM76.5 184h15v26h-15zM94 184h15v26h-15zM111.5 184h15v26h-15zM129 184h15v26h-15zM146.5 184h15v26h-15zM164 184h15v26h-15zM181.5 184h15v26h-15zM199 184h15v26h-15zM216.5 184h15v26h-15zM234 184h15v26h-15zM251.5 184h15v26h-15zM269 184h15v26h-15zM286.5 184h15v26h-15zM304 184h15v26h-15zM321.5 184h15v26h-15zM339 184h15v26h-15zM356.5 184h15v26h-15zM374 184h15v26h-15zM391.5 184h15v26h-15zM409 184h15v26h-15zM426.5 184h15v26h-15zM444 184h15v26h-15zM461.5 184h15v26h-15zM479 184h15v26h-15zM496.5 184h15v26h-15zM514 184h15v26h-15zM531.5 184h15v26h-15zM549 184h15v26h-15zM566.5 184h15v26h-15z" fill="none" stroke="var(--fig-line)" stroke-width="1.5"/><text class="graphics-warp-divergence-t" x="24" y="264" style="font-weight:600">Coherent warp: all 32 lanes take shadeA</text><path d="M24 276h15v26h-15zM41.5 276h15v26h-15zM59 276h15v26h-15zM76.5 276h15v26h-15zM94 276h15v26h-15zM111.5 276h15v26h-15zM129 276h15v26h-15zM146.5 276h15v26h-15zM164 276h15v26h-15zM181.5 276h15v26h-15zM199 276h15v26h-15zM216.5 276h15v26h-15zM234 276h15v26h-15zM251.5 276h15v26h-15zM269 276h15v26h-15zM286.5 276h15v26h-15zM304 276h15v26h-15zM321.5 276h15v26h-15zM339 276h15v26h-15zM356.5 276h15v26h-15zM374 276h15v26h-15zM391.5 276h15v26h-15zM409 276h15v26h-15zM426.5 276h15v26h-15zM444 276h15v26h-15zM461.5 276h15v26h-15zM479 276h15v26h-15zM496.5 276h15v26h-15zM514 276h15v26h-15zM531.5 276h15v26h-15zM549 276h15v26h-15zM566.5 276h15v26h-15z" fill="none" stroke="var(--fig-line)" stroke-width="1.5"/><path class="graphics-warp-divergence-dact" d="M24 184h15v26h-15zM41.5 184h15v26h-15zM59 184h15v26h-15zM76.5 184h15v26h-15zM94 184h15v26h-15zM111.5 184h15v26h-15zM129 184h15v26h-15zM146.5 184h15v26h-15zM164 184h15v26h-15zM181.5 184h15v26h-15zM199 184h15v26h-15zM216.5 184h15v26h-15zM234 184