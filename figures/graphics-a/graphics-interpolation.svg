ansform:translateX(120px) rotate(-26.57deg)}70%,80%{transform:translateX(80px) rotate(0.00deg)}88%{transform:translateX(40px) rotate(26.57deg)}100%{transform:translateX(0px) rotate(45.00deg)}}.graphics-interpolation-gh{transform-box:view-box;transform-origin:400px 236px;transform:translateX(80px) rotate(0.00deg);animation:graphics-interpolation-gh 7s infinite}@keyframes graphics-interpolation-ar{0%{transform:translateX(0px)}12%{transform:translateX(40px)}20%,30%{transform:translateX(80px)}38%{transform:translateX(120px)}50%{transform:translateX(160px)}62%{transform:translateX(120px)}70%,80%{transform:translateX(80px)}88%{transform:translateX(40px)}100%{transform:translateX(0px)}}.graphics-interpolation-ar{transform-box:view-box;transform-origin:400px 236px;transform:translateX(80px);animation:graphics-interpolation-ar 7s infinite}</style><defs><linearGradient id="graphics-interpolation-g0" gradientUnits="userSpaceOnUse" x1="40" y1="200" x2="170.9" y2="59.5"><stop offset="0" style="stop-color:var(--fig-accent);stop-opacity:1"/><stop offset="1" style="stop-color:var(--fig-accent);stop-opacity:0"/></linearGradient><linearGradient id="graphics-interpolation-g1" gradientUnits="userSpaceOnUse" x1="296" y1="176" x2="133.4" y2="64.2"><stop offset="0" style="stop-color:var(--fig-accent2);stop-opacity:1"/><stop offset="1" style="stop-color:var(--fig-accent2);stop-opacity:0"/></linearGradient><linearGradient id="graphics-interpolation-g2" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="163.9" y2="188.4"><stop offset="0" style="stop-color:var(--fig-warn);stop-opacity:1"/><stop offset="1" style="stop-color:var(--fig-warn);stop-opacity:0"/></linearGradient></defs><text class="graphics-interpolation-h" x="16" y="22">Vertex outputs blend across the triangle</text><polygon points="40,200 296,176 150,40" fill="var(--fig-bg)"/><polygon points="40,200 296,176 150,40" fill="url(#graphics-interpolation-g0)" fill-opacity="0.85"/><polygon points="40,200 296,176 150,40" fill="url(#graph