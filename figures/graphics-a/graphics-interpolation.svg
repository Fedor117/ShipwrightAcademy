<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-label="Left: a triangle whose vertex colours blend across its surface while a fragment moves inside and its three barycentric weight bars change. Right: two unit vertex normals 90 degrees apart; the interpolated normal sweeping between them is only 0.71 long at the midpoint until it is normalized."><style>.graphics-interpolation-t{font-size:13px;fill:var(--fig-ink)}.graphics-interpolation-m{font-size:12px;fill:var(--fig-muted)}.graphics-interpolation-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.graphics-interpolation-c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.graphics-interpolation-e{text-anchor:end}.graphics-interpolation-mid{text-anchor:middle}@keyframes graphics-interpolation-pt{0%,10%{transform:translate(0px,0px)}22%,32%{transform:translate(-67.1px,33.7px)}47%,57%{transform:translate(73.7px,20.5px)}72%,82%{transform:translate(-6.6px,-54.3px)}100%{transform:translate(0px,0px)}}.graphics-interpolation-pt{animation:graphics-interpolation-pt 8s infinite}@keyframes graphics-interpolation-w0{0%,10%{transform:scaleX(0.3333)}22%,32%{transform:scaleX(0.7)}47%,57%{transform:scaleX(0.15)}72%,82%{transform:scaleX(0.15)}100%{transform:scaleX(0.3333)}}.graphics-interpolation-w0{transform-box:view-box;transform-origin:64px 0px;transform:scaleX(0.333);animation:graphics-interpolation-w0 8s infinite}@keyframes graphics-interpolation-w1{0%,10%{transform:scaleX(0.3333)}22%,32%{transform:scaleX(0.15)}47%,57%{transform:scaleX(0.7)}72%,82%{transform:scaleX(0.15)}100%{transform:scaleX(0.3333)}}.graphics-interpolation-w1{transform-box:view-box;transform-origin:64px 0px;transform:scaleX(0.333);animation:graphics-interpolation-w1 8s infinite}@keyframes graphics-interpolation-w2{0%,10%{transform:scaleX(0.3333)}22%,32%{transform:scaleX(0.15)}47%,57%{transform:scaleX(0.15)}72%,82%{transform:scaleX(0.7)}100%{transform:scaleX(0.3333)}}.graphics-interpolation-w2{transform-box:view-box;transfo