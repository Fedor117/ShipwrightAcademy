anslate(370px,174px)}58.5%{transform:translate(395px,172.6px)}63%{transform:translate(420px,166.4px)}67.5%{transform:translate(445px,157px)}72%{transform:translate(470px,145.9px)}76.5%{transform:translate(495px,134.6px)}81%{transform:translate(520px,124.6px)}85.5%{transform:translate(545px,117.5px)}90%{transform:translate(570px,114.8px)}100%{transform:translate(570px,114.8px)}}.engines-keyframe-curves-r0{animation:engines-keyframe-curves-r0 6s linear infinite}@keyframes engines-keyframe-curves-r0{0%,26.5%{opacity:1}27%,100%{opacity:0}}.engines-keyframe-curves-r1{animation:engines-keyframe-curves-r1 6s linear infinite}@keyframes engines-keyframe-curves-r1{0%,53.5%{opacity:1}54%,100%{opacity:0}}.engines-keyframe-curves-r2{animation:engines-keyframe-curves-r2 6s linear infinite}@keyframes engines-keyframe-curves-r2{0%,26.5%{opacity:0}27%,100%{opacity:1}}.engines-keyframe-curves-r3{animation:engines-keyframe-curves-r3 6s linear infinite}@keyframes engines-keyframe-curves-r3{0%,53.5%{opacity:0}54%,100%{opacity:1}}</style><line class="engines-keyframe-curves-ax" x1="70" y1="60" x2="70" y2="230"/><line class="engines-keyframe-curves-ax" x1="70" y1="230" x2="590" y2="230"/><text class="engines-keyframe-curves-s" x="78" y="40">curve: bone_17.position.x</text><line class="engines-keyframe-curves-lin" x1="370" y1="36" x2="394" y2="36"/><text class="engines-keyframe-curves-s" x="400" y="40">linear</text><line class="engines-keyframe-curves-cv" x1="460" y1="36" x2="484" y2="36"/><text class="engines-keyframe-curves-s" x="490" y="40">Hermite</text><polyline class="engines-keyframe-curves-lin" points="70,210.8 220,94 370,174 570,114.8"/><path class="engines-keyframe-curves-cv" d="M70 210.8C120 210.8 170 100.1 220 94C270 87.9 320 171 370 174C436.7 178 503.3 114.8 570 114.8"/><g class="engines-keyframe-curves-hd" transform="translate(295,0)"><line class="engines-keyframe-curves-ph" x1="0" y1="62" x2="0" y2="230"/><text class="engines-keyframe-curves-s engines-keyframe-curves-c" x="0