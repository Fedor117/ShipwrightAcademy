<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" aria-label="Two timelines drawn to scale in milliseconds. Top: a jump pressed 40 ms before landing is held in a 120 ms buffer and fires on landing. Bottom: after leaving a ledge, a press at +60 ms falls inside the 100 ms coyote window and jumps, while a press at +140 ms is too late."><style>.engines-jump-buffer-t{font-size:14px;fill:var(--fig-ink)}.engines-jump-buffer-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-jump-buffer-s{font-size:13px;fill:var(--fig-muted)}.engines-jump-buffer-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-jump-buffer-c{text-anchor:middle}.engines-jump-buffer-e{text-anchor:end}.engines-jump-buffer-ai{fill:var(--fig-panel)}.engines-jump-buffer-gd{fill:var(--fig-ok);fill-opacity:.18}.engines-jump-buffer-wn{fill:var(--fig-warn);fill-opacity:.35}.engines-jump-buffer-ax{stroke:var(--fig-line);stroke-width:1.5}.engines-jump-buffer-z{stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 4}.engines-jump-buffer-pr{fill:var(--fig-accent)}.engines-jump-buffer-ok{fill:var(--fig-ok)}.engines-jump-buffer-bd{fill:var(--fig-bad)}.engines-jump-buffer-cu{stroke:var(--fig-accent2);stroke-width:2}.engines-jump-buffer-ring{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:50% 50%}.engines-jump-buffer-cur{animation:engines-jump-buffer-cur 5s linear infinite}@keyframes engines-jump-buffer-cur{0%,5%{transform:translateX(20px)}85%,100%{transform:translateX(620px)}}.engines-jump-buffer-p0{animation:engines-jump-buffer-p0 5s ease-out infinite}@keyframes engines-jump-buffer-p0{0%,34.3%{opacity:0;transform:scale(1)}35.3%{opacity:.9;transform:scale(1)}44.3%,100%{opacity:0;transform:scale(2.6)}}.engines-jump-buffer-p1{animation:engines-jump-buffer-p1 5s ease-out infinite}@keyframes engines-jump-buffer-p1{0%,45%{opacity:0;transform:scale(1)}46%{opacity:.9;transform:scale(1)}55%,100%{opacity:0;transform:scale(2.6)}}.engines-jump-buffer-p2{animation:engines-jump-buffer-p2 5s ease-out infinite}@keyframes engines-jump-buffer-p2{0%,61%{opacity:0;transform:scale(1)}62%{opacity:.9;transform:scale(1)}71%,100%{opacity:0;transform:scale(2.6)}}.engines-jump-buffer-p3{animation:engines-jump-buffer-p3 5s ease-out infinite}@keyframes engines-jump-buffer-p3{0%,82.3%{opacity:0;transform:scale(1)}83.3%{opacity:.9;transform:scale(1)}92.3%,100%{opacity:0;transform:scale(2.6)}}</style><text class="engines-jump-buffer-h" x="20" y="30">Jump buffer: press 40 ms before landing</text><rect class="engines-jump-buffer-ai" x="20" y="56" width="300" height="28" rx="6"/><rect class="engines-jump-buffer-gd" x="320" y="56" width="300" height="28" rx="6"/><rect class="engines-jump-buffer-wn" x="240" y="60" width="240" height="20" rx="5"/><text class="engines-jump-buffer-s" x="30" y="75">airborne</text><text class="engines-jump-buffer-s engines-jump-buffer-e" x="610" y="75">grounded</text><text class="engines-jump-buffer-t engines-jump-buffer-c" x="400" y="75">buffer 120 ms</text><text class="engines-jump-buffer-h" x="20" y="128">Coyote time: press after leaving a ledge</text><rect class="engines-jump-buffer-gd" x="20" y="146" width="300" height="28" rx="6"/><rect class="engines-jump-buffer-ai" x="320" y="146" width="300" height="28" rx="6"/><rect class="engines-jump-buffer-wn" x="320" y="150" width="200" height="20" rx="5"/><text class="engines-jump-buffer-s" x="30" y="165">grounded</text><text class="engines-jump-buffer-s" x="528" y="165">airborne</text><text class="engines-jump-buffer-t engines-jump-buffer-c" x="376" y="165">coyote 100 ms</text><line class="engines-jump-buffer-z" x1="320" y1="46" x2="320" y2="182"/><circle class="engines-jump-buffer-pr" cx="240" cy="70" r="6"/><circle class="engines-jump-buffer-ok" cx="320" cy="70" r="7"/><circle class="engines-jump-buffer-ok" cx="440" cy="160" r="7"/><circle class="engines-jump-buffer-bd" cx="600" cy="160" r="6"/><circle class="engines-jump-buffer-ring engines-jump-buffer-p0" cx="240" cy="70" r="8" style="stroke:var(--fig-accent)"/><circle class="engines-jump-buffer-ring engines-jump-buffer-p1" cx="320" cy="70" r="8" style="stroke:var(--fig-ok)"/><circle class="engines-jump-buffer-ring engines-jump-buffer-p2" cx="440" cy="160" r="8" style="stroke:var(--fig-ok)"/><circle class="engines-jump-buffer-ring engines-jump-buffer-p3" cx="600" cy="160" r="8" style="stroke:var(--fig-bad)"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="240" y="102">press at -40 ms</text><text class="engines-jump-buffer-t" x="330" y="102">Jump() on landing</text><text class="engines-jump-buffer-s engines-jump-buffer-e" x="314" y="192">left ledge</text><text class="engines-jump-buffer-t engines-jump-buffer-c" x="440" y="192">+60 ms: Jump()</text><text class="engines-jump-buffer-s engines-jump-buffer-e" x="620" y="192">+140 ms: too late</text><line class="engines-jump-buffer-ax" x1="20" y1="212" x2="620" y2="212"/><line class="engines-jump-buffer-ax" x1="20" y1="212" x2="20" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="34" y="234">-150</text><line class="engines-jump-buffer-ax" x1="120" y1="212" x2="120" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="120" y="234">-100</text><line class="engines-jump-buffer-ax" x1="220" y1="212" x2="220" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="220" y="234">-50</text><line class="engines-jump-buffer-ax" x1="320" y1="212" x2="320" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="320" y="234">0</text><line class="engines-jump-buffer-ax" x1="420" y1="212" x2="420" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="420" y="234">+50</text><line class="engines-jump-buffer-ax" x1="520" y1="212" x2="520" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="520" y="234">+100</text><line class="engines-jump-buffer-ax" x1="620" y1="212" x2="620" y2="218"/><text class="engines-jump-buffer-s engines-jump-buffer-c" x="600" y="234">+150 ms</text><g class="engines-jump-buffer-cur" transform="translate(-100,0)"><line class="engines-jump-buffer-cu" x1="0" y1="44" x2="0" y2="212"/></g></svg>
