<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" role="img" aria-label="A navmesh of seven convex polygons around two obstacles. The dashed route through polygon centres zigzags; the funnel algorithm pulls it into a straight path that bends only at the two inner corners, and an agent follows it."><style>.engines-navmesh-t{font-size:14px;fill:var(--fig-ink)}.engines-navmesh-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-navmesh-s{font-size:13px;fill:var(--fig-muted)}.engines-navmesh-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-navmesh-c{text-anchor:middle}.engines-navmesh-e{text-anchor:end}.engines-navmesh-pg{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5;stroke-linejoin:round}.engines-navmesh-pt{stroke:var(--fig-accent2);stroke-width:3;stroke-linecap:round}.engines-navmesh-cr{fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-dasharray:5 5}.engines-navmesh-fn{fill:none;stroke:var(--fig-accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.engines-navmesh-ag{fill:var(--fig-accent)}.engines-navmesh-cn{fill:var(--fig-ink)}.engines-navmesh-mv{animation:engines-navmesh-mv 6s linear infinite}@keyframes engines-navmesh-mv{0%,10%{transform:translate(62px,250px);opacity:1}33.6%{transform:translate(250px,210px);opacity:1}50.1%{transform:translate(340px,110px);opacity:1}80%{transform:translate(580px,70px);opacity:1}88%{transform:translate(580px,70px);opacity:1}94%{transform:translate(580px,70px);opacity:0}94.1%{transform:translate(62px,250px);opacity:0}100%{transform:translate(62px,250px);opacity:1}}</style><polygon class="engines-navmesh-pg" points="30,210 150,210 130,290 30,290"/><polygon class="engines-navmesh-pg" points="150,210 250,210 250,290 130,290"/><polygon class="engines-navmesh-pg" points="250,210 340,210 340,290 250,290"/><polygon class="engines-navmesh-pg" points="250,110 340,110 340,210 250,210"/><polygon class="engines-navmesh-pg" points="250,30 340,30 340,110 250,110"/><polygon class="engines-navmesh-pg" points="340,30 470,30 450,110 340,110"/><polygon class="engines-navmesh-pg" points="470,30 610,30 610,110 450,110"/><line class="engines-navmesh-pt" x1="150" y1="210" x2="130" y2="290"/><line class="engines-navmesh-pt" x1="250" y1="210" x2="250" y2="290"/><line class="engines-navmesh-pt" x1="250" y1="210" x2="340" y2="210"/><line class="engines-navmesh-pt" x1="250" y1="110" x2="340" y2="110"/><line class="engines-navmesh-pt" x1="340" y1="30" x2="340" y2="110"/><line class="engines-navmesh-pt" x1="470" y1="30" x2="450" y2="110"/><polyline class="engines-navmesh-cr" points="62,250 195,250 295,250 295,160 295,70 400,70 580,70"/><polyline class="engines-navmesh-fn" points="62,250 250,210 340,110 580,70"/><circle class="engines-navmesh-cn" cx="250" cy="210" r="4"/><circle class="engines-navmesh-cn" cx="340" cy="110" r="4"/><circle class="engines-navmesh-cn" cx="62" cy="250" r="6"/><text class="engines-navmesh-s" x="52" y="278">start</text><circle class="engines-navmesh-cn" cx="580" cy="70" r="6"/><text class="engines-navmesh-s engines-navmesh-e" x="588" y="100">goal</text><g class="engines-navmesh-mv" transform="translate(295,160)"><circle class="engines-navmesh-ag" r="8"/></g><line class="engines-navmesh-cr" x1="30" y1="54" x2="56" y2="54"/><text class="engines-navmesh-t" x="66" y="59">polygon-centre route</text><line class="engines-navmesh-fn" x1="30" y1="84" x2="56" y2="84"/><text class="engines-navmesh-t" x="66" y="89">funnel path</text><line class="engines-navmesh-pt" x1="30" y1="114" x2="56" y2="114"/><text class="engines-navmesh-t" x="66" y="119">portal (shared edge)</text><text class="engines-navmesh-s" x="372" y="190">A* searches 7 polygons,</text><text class="engines-navmesh-s" x="372" y="210">then the funnel pulls the</text><text class="engines-navmesh-s" x="372" y="230">route tight to the corners</text></svg>
