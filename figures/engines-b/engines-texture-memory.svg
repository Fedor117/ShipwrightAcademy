<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" role="img" aria-label="Bars drawn to scale for one 2048 by 2048 texture with mips: RGBA32 21.3 MB, BC7 5.3 MB, ASTC 6x6 2.5 MB, ASTC 8x8 1.3 MB; the mip chain adds one third on top of each base level."><style>.engines-texture-memory-t{font-size:14px;fill:var(--fig-ink)}.engines-texture-memory-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-texture-memory-s{font-size:13px;fill:var(--fig-muted)}.engines-texture-memory-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-texture-memory-c{text-anchor:middle}.engines-texture-memory-e{text-anchor:end}.engines-texture-memory-a{fill:var(--fig-accent)}.engines-texture-memory-m{fill:var(--fig-accent);fill-opacity:.4}.engines-texture-memory-g{transform-box:fill-box;transform-origin:0 50%;animation:engines-texture-memory-g 6s cubic-bezier(.2,.7,.3,1) infinite}.engines-texture-memory-v{animation:engines-texture-memory-v 6s linear infinite}.engines-texture-memory-ax{stroke:var(--fig-line);stroke-width:1.5}@keyframes engines-texture-memory-g{0%,50%{transform:scaleX(1)}56%{transform:scaleX(0)}86%,100%{transform:scaleX(1)}}@keyframes engines-texture-memory-v{0%,50%{opacity:1}54%,80%{opacity:0}86%,100%{opacity:1}}</style><text class="engines-texture-memory-h" x="24" y="34">2048 x 2048 texture in GPU memory</text><rect class="engines-texture-memory-a" x="380" y="23" width="14" height="14" rx="3"/><text class="engines-texture-memory-s" x="400" y="34">base level</text><rect class="engines-texture-memory-m" x="486" y="23" width="14" height="14" rx="3"/><text class="engines-texture-memory-s" x="506" y="34">+ mips (x1.33)</text><line class="engines-texture-memory-ax" x1="180" y1="52" x2="180" y2="252"/><text class="engines-texture-memory-t" x="24" y="85">RGBA32</text><text class="engines-texture-memory-s" x="104" y="85">32 bpp</text><g class="engines-texture-memory-g"><rect class="engines-texture-memory-a" x="180" y="66" width="288" height="28" rx="4"/><rect class="engines-texture-memory-m" x="468" y="66" width="95.4" height="28" rx="4"/></g><text class="engines-texture-memory-t engines-texture-memory-v" x="573.4" y="85">21.3 MB</text><text class="engines-texture-memory-t" x="24" y="133">BC7</text><text class="engines-texture-memory-s" x="104" y="133">8 bpp</text><g class="engines-texture-memory-g"><rect class="engines-texture-memory-a" x="180" y="114" width="72" height="28" rx="4"/><rect class="engines-texture-memory-m" x="252" y="114" width="23.4" height="28" rx="4"/></g><text class="engines-texture-memory-t engines-texture-memory-v" x="285.4" y="133">5.3 MB</text><text class="engines-texture-memory-t" x="24" y="181">ASTC 6x6</text><text class="engines-texture-memory-s" x="104" y="181">3.56 bpp</text><g class="engines-texture-memory-g"><rect class="engines-texture-memory-a" x="180" y="162" width="34.2" height="28" rx="4"/><rect class="engines-texture-memory-m" x="214.2" y="162" width="10.8" height="28" rx="4"/></g><text class="engines-texture-memory-t engines-texture-memory-v" x="235" y="181">2.5 MB</text><text class="engines-texture-memory-t" x="24" y="229">ASTC 8x8</text><text class="engines-texture-memory-s" x="104" y="229">2 bpp</text><g class="engines-texture-memory-g"><rect class="engines-texture-memory-a" x="180" y="210" width="18" height="28" rx="4"/><rect class="engines-texture-memory-m" x="198" y="210" width="5.4" height="28" rx="4"/></g><text class="engines-texture-memory-t engines-texture-memory-v" x="213.4" y="229">1.3 MB</text></svg>
