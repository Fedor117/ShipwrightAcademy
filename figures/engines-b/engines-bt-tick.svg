<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" role="img" aria-label="A behaviour tree tick: the Selector tries the Flee sequence, whose IsHealthLow check fails; it then tries Attack, where CanSeeTarget and InRange succeed and Fire returns Running, so the selector returns Running and Chase and Patrol are never ticked."><style>.engines-bt-tick-t{font-size:14px;fill:var(--fig-ink)}.engines-bt-tick-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-bt-tick-s{font-size:13px;fill:var(--fig-muted)}.engines-bt-tick-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-bt-tick-c{text-anchor:middle}.engines-bt-tick-e{text-anchor:end}.engines-bt-tick-ln{stroke:var(--fig-line);stroke-width:1.5}.engines-bt-tick-dim{opacity:.45}.engines-bt-tick-ok{fill:var(--fig-ok);fill-opacity:.16;stroke:var(--fig-ok);stroke-width:2.5}.engines-bt-tick-bad{fill:var(--fig-bad);fill-opacity:.16;stroke:var(--fig-bad);stroke-width:2.5}.engines-bt-tick-warn{fill:var(--fig-warn);fill-opacity:.16;stroke:var(--fig-warn);stroke-width:2.5}.engines-bt-tick-accent{fill:var(--fig-accent);fill-opacity:.16;stroke:var(--fig-accent);stroke-width:2.5}.engines-bt-tick-selw{animation-name:engines-bt-tick-selw;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-selw{0%,12%{opacity:0}14%,75%{opacity:1}76%,100%{opacity:0}}.engines-bt-tick-flw{animation-name:engines-bt-tick-flw;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-flw{0%,18%{opacity:0}20%,33%{opacity:1}34%,100%{opacity:0}}.engines-bt-tick-atw{animation-name:engines-bt-tick-atw;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-atw{0%,38%{opacity:0}40%,69%{opacity:1}70%,100%{opacity:0}}.engines-bt-tick-iha{animation-name:engines-bt-tick-iha;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-iha{0%,8%{opacity:1}10%,28%{opacity:0}30%,100%{opacity:1}}.engines-bt-tick-fla{animation-name:engines-bt-tick-fla;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-fla{0%,8%{opacity:1}10%,34%{opacity:0}36%,100%{opacity:1}}.engines-bt-tick-csa{animation-name:engines-bt-tick-csa;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-csa{0%,8%{opacity:1}10%,46%{opacity:0}48%,100%{opacity:1}}.engines-bt-tick-ira{animation-name:engines-bt-tick-ira;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-ira{0%,8%{opacity:1}10%,54%{opacity:0}56%,100%{opacity:1}}.engines-bt-tick-fia{animation-name:engines-bt-tick-fia;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-fia{0%,8%{opacity:1}10%,62%{opacity:0}64%,100%{opacity:1}}.engines-bt-tick-ata{animation-name:engines-bt-tick-ata;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-ata{0%,8%{opacity:1}10%,70%{opacity:0}72%,100%{opacity:1}}.engines-bt-tick-sela{animation-name:engines-bt-tick-sela;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-bt-tick-sela{0%,8%{opacity:1}10%,76%{opacity:0}78%,100%{opacity:1}}</style><line class="engines-bt-tick-ln" x1="320" y1="52" x2="90" y2="92"/><line class="engines-bt-tick-ln" x1="320" y1="52" x2="242" y2="92"/><line class="engines-bt-tick-ln" x1="320" y1="52" x2="394" y2="92"/><line class="engines-bt-tick-ln" x1="320" y1="52" x2="546" y2="92"/><line class="engines-bt-tick-ln" x1="90" y1="124" x2="90" y2="238"/><line class="engines-bt-tick-ln" x1="242" y1="124" x2="242" y2="238"/><line class="engines-bt-tick-ln" x1="394" y1="124" x2="394" y2="194"/><rect class="engines-bt-tic