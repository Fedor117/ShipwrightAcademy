<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" role="img" aria-label="Two 256 MB heaps receive the same allocations. In the mixed heap, freeing the 25 MB level blocks leaves 200 MB free in holes too small for a 32 MB request; with arenas by lifetime the same 200 MB is one contiguous block and the request fits."><style>.engines-fragmentation-t{font-size:14px;fill:var(--fig-ink)}.engines-fragmentation-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-fragmentation-s{font-size:13px;fill:var(--fig-muted)}.engines-fragmentation-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-fragmentation-c{text-anchor:middle}.engines-fragmentation-e{text-anchor:end}.engines-fragmentation-lv{fill:var(--fig-accent)}.engines-fragmentation-lt{fill:var(--fig-accent2);fill-opacity:.5}.engines-fragmentation-hole{fill:none;stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:3 3}.engines-fragmentation-tk{fill:var(--fig-panel)}.engines-fragmentation-ol{fill:none;stroke:var(--fig-line);stroke-width:1.5}.engines-fragmentation-bad{fill:var(--fig-bad);fill-opacity:.12;stroke:var(--fig-bad);stroke-width:2}.engines-fragmentation-ok{fill:var(--fig-ok);fill-opacity:.2;stroke:var(--fig-ok);stroke-width:2}.engines-fragmentation-rb{fill:var(--fig-bad);font-size:14px}.engines-fragmentation-rk{fill:var(--fig-ok);font-size:14px}.engines-fragmentation-cv{transform-box:fill-box;transform-origin:100% 50%;animation-name:engines-fragmentation-cv;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-cv{0%,8%{transform:scaleX(0)}9%,14%{transform:scaleX(1)}34%,100%{transform:scaleX(0)}}.engines-fragmentation-lt{animation-name:engines-fragmentation-lt;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-lt{0%,8%{opacity:0}9%,40%{opacity:1}46%,100%{opacity:0}}.engines-fragmentation-st{animation-name:engines-fragmentation-st;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-st{0%,8%{opacity:1}10%,46%{opacity:0}49%,100%{opacity:1}}.engines-fragmentation-q1{animation-name:engines-fragmentation-q1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-q1{0%,8%{opacity:1;transform:translateX(0)}10%,50%{opacity:0;transform:translateX(-448px)}53%{opacity:1;transform:translateX(-448px)}72%,100%{opacity:1;transform:translateX(0)}}.engines-fragmentation-f1{animation-name:engines-fragmentation-f1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-f1{0%,8%{opacity:1}10%,72%{opacity:0}74%,100%{opacity:1}}.engines-fragmentation-q2{animation-name:engines-fragmentation-q2;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-q2{0%,8%{opacity:1;transform:translateY(0)}10%,50%{opacity:0;transform:translateY(-38px)}53%,58%{opacity:1;transform:translateY(-38px)}66%,100%{opacity:1;transform:translateY(0)}}.engines-fragmentation-f2{animation-name:engines-fragmentation-f2;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes engines-fragmentation-f2{0%,8%{opacity:1}10%,66%{opacity:0}68%,100%{opacity:1}}</style><text class="engines-fragmentation-h" x="64" y="34">One heap, mixed lifetimes</text><rect class="engines-fragmentation-lv" x="388" y="23" width="14" height="14" rx="3"/><text class="engines-fragmentation-s" x="408" y="34">long-lived 7 MB</text><rect class="engines-fragmentation-lt" style="animation:none;opacity:1" x="516" y="23" width="14" height="14" rx="3"/><text class="engines-fragmentation-s" x="536" y="34">level 25 MB</text><rect class="engines-fragmentation-tk" x="64" y="84" width="512" height="36" rx="6"/><rect class="engines-fragmentation-hole" x="79" y="87" width="48" height