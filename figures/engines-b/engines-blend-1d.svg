<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" role="img" aria-label="A 1D blend tree on speed: idle, walk and run each have a triangular weight curve. As the speed marker slides from 0 to 6 m/s and back, the weight bars for the three clips shift so they always sum to 1."><style>.engines-blend-1d-t{font-size:14px;fill:var(--fig-ink)}.engines-blend-1d-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-blend-1d-s{font-size:13px;fill:var(--fig-muted)}.engines-blend-1d-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-blend-1d-c{text-anchor:middle}.engines-blend-1d-e{text-anchor:end}.engines-blend-1d-ax{stroke:var(--fig-line);stroke-width:1.5}.engines-blend-1d-tr{fill:var(--fig-panel)}.engines-blend-1d-mk{fill:var(--fig-ink)}.engines-blend-1d-ml{stroke:var(--fig-ink);stroke-width:1.5}.engines-blend-1d-c0{fill:none;stroke:var(--fig-muted);stroke-width:2.5;stroke-linejoin:round}.engines-blend-1d-f0{fill:var(--fig-muted)}.engines-blend-1d-c1{fill:none;stroke:var(--fig-accent);stroke-width:2.5;stroke-linejoin:round}.engines-blend-1d-f1{fill:var(--fig-accent)}.engines-blend-1d-c2{fill:none;stroke:var(--fig-accent2);stroke-width:2.5;stroke-linejoin:round}.engines-blend-1d-f2{fill:var(--fig-accent2)}.engines-blend-1d-m{animation:engines-blend-1d-m 6s linear infinite}@keyframes engines-blend-1d-m{0%{transform:translateX(90px)}10%{transform:translateX(90px)}21.667%{transform:translateX(240px)}45%{transform:translateX(540px)}55%{transform:translateX(540px)}78.333%{transform:translateX(240px)}90%{transform:translateX(90px)}100%{transform:translateX(90px)}}.engines-blend-1d-w0{transform-box:fill-box;transform-origin:0 50%;animation:engines-blend-1d-w0 6s linear infinite}@keyframes engines-blend-1d-w0{0%{transform:scaleX(1)}10%{transform:scaleX(1)}21.667%{transform:scaleX(0)}45%{transform:scaleX(0)}55%{transform:scaleX(0)}78.333%{transform:scaleX(0)}90%{transform:scaleX(1)}100%{transform:scaleX(1)}}.engines-blend-1d-w1{transform-box:fill-box;transform-origin:0 50%;animation:engines-blend-1d-w1 6s linear infinite}@keyframes engines-blend-1d-w1{0%{transform:scaleX(0)}10%{transform:scaleX(0)}21.667%{transform:scaleX(1)}45%{transform:scaleX(0)}55%{transform:scaleX(0)}78.333%{transform:scaleX(1)}90%{transform:scaleX(0)}100%{transform:scaleX(0)}}.engines-blend-1d-w2{transform-box:fill-box;transform-origin:0 50%;animation:engines-blend-1d-w2 6s linear infinite}@keyframes engines-blend-1d-w2{0%{transform:scaleX(0)}10%{transform:scaleX(0)}21.667%{transform:scaleX(0)}45%{transform:scaleX(1)}55%{transform:scaleX(1)}78.333%{transform:scaleX(0)}90%{transform:scaleX(0)}100%{transform:scaleX(0)}}</style><polyline class="engines-blend-1d-c0" points="90,60 240,140"/><polyline class="engines-blend-1d-c1" points="90,140 240,60 540,140"/><polyline class="engines-blend-1d-c2" points="240,140 540,60"/><line class="engines-blend-1d-ax" x1="90" y1="140" x2="580" y2="140"/><line class="engines-blend-1d-ax" x1="90" y1="140" x2="90" y2="146"/><line class="engines-blend-1d-ax" x1="165" y1="140" x2="165" y2="146"/><line class="engines-blend-1d-ax" x1="240" y1="140" x2="240" y2="146"/><line class="engines-blend-1d-ax" x1="315" y1="140" x2="315" y2="146"/><line class="engines-blend-1d-ax" x1="390" y1="140" x2="390" y2="146"/><line class="engines-blend-1d-ax" x1="465" y1="140" x2="465" y2="146"/><line class="engines-blend-1d-ax" x1="540" y1="140" x2="540" y2="146"/><text class="engines-blend-1d-s engines-blend-1d-c" x="90" y="164">0</text><text class="engines-blend-1d-s engines-blend-1d-c" x="240" y="164">2</text><text class="engines-blend-1d-s engines-blend-1d-c" x="390" y="164">4</text><text class="engines-blend-1d-s engines-blend-1d-c" x="540" y="164">6 m/s</text><text class="engines-blend-1d-t" x="90" y="48">idle</text><text class="engines-blend-1d-t engines-blend-1d-c" x="240" y="48">walk</text><text class="engines-blend-1d-t engines-blend-1d-e" x="540" y="48">run</text><text class="engines-blend-1d-s" x="20" y="65">w = 1</text><text class="engines-blend-1d-s" x="20" y="145">speed</text><g class="engines-blend-1d-m" transform="translate(315,0)"><line class="engines-blend-1d-ml" x1="0" y1="56" x2="0" y2="140"/><path class="engines-blend-1d-mk" d="M0 140l7 11h-14z"/></g><text class="engines-blend-1d-t" x="90" y="197">idle</text><rect class="engines-blend-1d-tr" x="160" y="184" width="300" height="16" rx="8"/><rect class="engines-blend-1d-f0 engines-blend-1d-w0" x="160" y="184" width="300" height="16" rx="8" transform="scale(0,1)"/><text class="engines-blend-1d-t" x="90" y="227">walk</text><rect class="engines-blend-1d-tr" x="160" y="214" width="300" height="16" rx="8"/><rect class="engines-blend-1d-f1 engines-blend-1d-w1" x="160" y="214" width="300" height="16" rx="8" transform="scale(0.75,1)"/><text class="engines-blend-1d-t" x="90" y="257">run</text><rect class="engines-blend-1d-tr" x="160" y="244" width="300" height="16" rx="8"/><rect class="engines-blend-1d-f2 engines-blend-1d-w2" x="160" y="244" width="300" height="16" rx="8" transform="scale(0.25,1)"/><text class="engines-blend-1d-s" x="476" y="197">weight per clip</text><text class="engines-blend-1d-s" x="476" y="227">always sums to 1</text></svg>
