<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Lag compensation on the server: the target hitbox is recorded every 50 ms. When a shot arrives, the server rewinds the hitbox 150 ms (100 ms interpolation plus 50 ms travel) to where the shooter saw it, and the ray hits there."><style>.engines-lag-comp-t{font-size:14px;fill:var(--fig-ink)}.engines-lag-comp-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-lag-comp-s{font-size:13px;fill:var(--fig-muted)}.engines-lag-comp-b{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}.engines-lag-comp-c{text-anchor:middle}.engines-lag-comp-e{text-anchor:end}.engines-lag-comp-gh{fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 4}.engines-lag-comp-now{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}.engines-lag-comp-rw{fill:var(--fig-accent2);fill-opacity:.15;stroke:var(--fig-accent2);stroke-width:2.5}.engines-lag-comp-ray{stroke:var(--fig-bad);stroke-width:2;stroke-linecap:round}.engines-lag-comp-sh{fill:var(--fig-ink)}.engines-lag-comp-ip{fill:var(--fig-accent2);fill-opacity:.35}.engines-lag-comp-tr{fill:var(--fig-accent);fill-opacity:.35}.engines-lag-comp-hit{fill:var(--fig-ok)}.engines-lag-comp-ht{fill:var(--fig-ok);font-size:14px;font-weight:600}.engines-lag-comp-br{fill:none;stroke:var(--fig-muted);stroke-width:1.5}.engines-lag-comp-ar{fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.engines-lag-comp-mv{animation:engines-lag-comp-mv 6s ease-in-out infinite}@keyframes engines-lag-comp-mv{0%,10%{transform:translateX(300px)}35%,70%{transform:translateX(0)}85%,100%{transform:translateX(300px)}}.engines-lag-comp-hf{animation:engines-lag-comp-hf 6s linear infinite}@keyframes engines-lag-comp-hf{0%,35%{opacity:0}37%,68%{opacity:1}70%,100%{opacity:0}}</style><text class="engines-lag-comp-h" x="24" y="34">Shot arrives at the server now</text><text class="engines-lag-comp-s" x="24" y="56">rewind hitboxes 150 ms, test the ray, restore</text><path class="engines-lag-comp-br" d="M240 94v-6h340v6"/><text class="engines-lag-comp-s engines-lag-comp-c" x="410" y="78">server hitbox history (target moving right)</text><rect class="engines-lag-comp-gh" x="240" y="116" width="40" height="64" rx="8"/><text class="engines-lag-comp-s engines-lag-comp-c" x="260" y="204">-150 ms</text><rect class="engines-lag-comp-gh" x="340" y="116" width="40" height="64" rx="8"/><text class="engines-lag-comp-s engines-lag-comp-c" x="360" y="204">-100 ms</text><rect class="engines-lag-comp-gh" x="440" y="116" width="40" height="64" rx="8"/><text class="engines-lag-comp-s engines-lag-comp-c" x="460" y="204">-50 ms</text><rect class="engines-lag-comp-now" x="540" y="116" width="40" height="64" rx="8"/><text class="engines-lag-comp-h engines-lag-comp-c" x="560" y="204">now</text><path class="engines-lag-comp-ar" d="M590 148h24m-7 -6l7 6l-7 6"/><g class="engines-lag-comp-mv"><rect class="engines-lag-comp-rw" x="240" y="116" width="40" height="64" rx="8"/></g><line class="engines-lag-comp-ray" x1="68" y1="286" x2="262" y2="150"/><circle class="engines-lag-comp-sh" cx="60" cy="292" r="9"/><text class="engines-lag-comp-t" x="78" y="318">shooter</text><g class="engines-lag-comp-hf"><circle class="engines-lag-comp-hit" cx="262" cy="150" r="5"/><text class="engines-lag-comp-ht engines-lag-comp-c" x="260" y="108">hit</text></g><rect class="engines-lag-comp-ip" x="260" y="234" width="200" height="18" rx="4"/><rect class="engines-lag-comp-tr" x="460" y="234" width="100" height="18" rx="4"/><text class="engines-lag-comp-s engines-lag-comp-c" x="360" y="272">100 ms interpolation</text><text class="engines-lag-comp-s engines-lag-comp-c" x="510" y="272">50 ms travel</text></svg>
