<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Nested layout groups: one text change in a cell walks up to the root Vertical Layout Group, which then recomputes all 17 elements.">
<style>
.unity-layout-group-cascade-t{font-size:13px;fill:var(--fig-ink)}
.unity-layout-group-cascade-s{font-size:12px;fill:var(--fig-ink)}
.unity-layout-group-cascade-m{font-size:13px;fill:var(--fig-muted)}
.unity-layout-group-cascade-w{font-size:13px;fill:var(--fig-warn);font-weight:600}
.unity-layout-group-cascade-n{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.unity-layout-group-cascade-e{stroke:var(--fig-line);stroke-width:1.5;fill:none}
.unity-layout-group-cascade-up{stroke:var(--fig-warn);stroke-width:3;fill:none;stroke-linecap:round;opacity:0;animation:unity-layout-group-cascade-up 6s linear infinite}
.unity-layout-group-cascade-dirty{fill:var(--fig-warn);fill-opacity:.25;stroke:var(--fig-warn);stroke-width:2}
.unity-layout-group-cascade-re{fill:var(--fig-warn);opacity:0;animation:unity-layout-group-cascade-re 6s ease-out infinite}
@keyframes unity-layout-group-cascade-up{0%,12%{opacity:0}18%,72%{opacity:1}80%,100%{opacity:0}}
@keyframes unity-layout-group-cascade-re{0%,34%{opacity:0}40%{opacity:.45}72%{opacity:.3}80%,100%{opacity:0}}
</style>
