<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Layer Collision Matrix with EnemyBullet versus Enemy turned off: an enemy bullet passes through another enemy and hits the player.">
<style>
.unity-collision-matrix-bullets-t{font-size:13px;fill:var(--fig-ink)}
.unity-collision-matrix-bullets-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
.unity-collision-matrix-bullets-m{font-size:13px;fill:var(--fig-muted)}
.unity-collision-matrix-bullets-on{fill:var(--fig-accent);fill-opacity:.16;stroke:var(--fig-accent);stroke-width:1.5}
.unity-collision-matrix-bullets-off{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.unity-collision-matrix-bullets-ck{fill:none;stroke:var(--fig-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.unity-collision-matrix-bullets-ring{fill:none;stroke-width:2.5;opacity:0}
.unity-collision-matrix-bullets-r1{stroke:var(--fig-muted);animation:unity-collision-matrix-bullets-a1 5s linear infinite}
.unity-collision-matrix-bullets-r2{stroke:var(--fig-ok);animation:unity-collision-matrix-bullets-a2 5s linear infinite}
.unity-collision-matrix-bullets-bul{fill:var(--fig-warn);animation:unity-collision-matrix-bullets-move 5s linear infinite}
.unity-collision-matrix-bullets-ghost{fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-dasharray:4 4;opacity:0;animation:unity-collision-matrix-bullets-a1 5s linear infinite}
.unity-collision-matrix-bullets-burst{fill:var(--fig-ok);fill-opacity:.35;opacity:0;transform-box:fill-box;transform-origin:center;animation:unity-collision-matrix-bullets-burst 5s ease-out infinite}
@keyframes unity-collision-matrix-bullets-move{0%{transform:translateX(0);opacity:1}70%{transform:translateX(135px);opacity:1}72%{transform:translateX(135px);opacity:0}100%{transform:translateX(135px);opacity:0}}
@keyframes unity-collision-matrix-bullets-a1{0%,20%{opacity:0}23%,38%{opacity:1}42%,100%{opacity:0}}
@keyframes unity-collision-matrix-bullets-a2{0%,68%{opacity:0}71%,84%{opacity:1}88%,100%{opacity:0}}
@keyframes unity-collision-matrix-bullets-burst{0%,69%{opacity:0;transform:scale(.3)}71%{opacity:1;transform:scale(.6)}86%{opacity:0;transform:scale(1.6)}100%{opacity:0;transform:scale(1.6)}}
</style>
