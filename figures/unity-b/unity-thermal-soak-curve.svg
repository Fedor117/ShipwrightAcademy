<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Frame time over a 20 minute soak test on a phone. Running at 16.7 ms with no headroom, throttling pushes frame time to 25 ms, 60 to 40 fps. Starting at an 11 ms budget, the same 30 percent rise stays under 16.7 ms.">
<style>
.unity-thermal-soak-curve-s{font-size:12px;fill:var(--fig-muted)}
.unity-thermal-soak-curve-m{font-size:13px;fill:var(--fig-muted)}
.unity-thermal-soak-curve-bt{font-size:13px;fill:var(--fig-bad);font-weight:600}
.unity-thermal-soak-curve-ot{font-size:13px;fill:var(--fig-ok);font-weight:600}
.unity-thermal-soak-curve-g{stroke:var(--fig-line);stroke-width:1}
.unity-thermal-soak-curve-base{fill:none;stroke-width:2.5;stroke-opacity:.25}
.unity-thermal-soak-curve-draw{fill:none;stroke-width:2.5;stroke-dasharray:100;stroke-dashoffset:100;animation:unity-thermal-soak-curve-draw 7s linear infinite}
.unity-thermal-soak-curve-a{stroke:var(--fig-bad)}
.unity-thermal-soak-curve-b{stroke:var(--fig-ok)}
@keyframes unity-thermal-soak-curve-draw{0%{stroke-dashoffset:100}75%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:0;stroke-opacity:0}}
</style>
<line class="unity-thermal-soak-curve-g" x1="80" y1="260.0" x2="600" y2="260.0"/><text class="unity-thermal-soak-curve-s" x="70" y="264.0" text-anchor="end">0</text><line class="unity-thermal-soak-curve-g" x1="80" y1="193.3" x2="600" y2="193.3"/><text class="unity-thermal-soak-curve-s" x="70" y="197.3" text-anchor="end">10</text><line class="unity-thermal-soak-curve-g" x1="80" y1="126.7" x2="600" y2="126.7"/><text class="unity-thermal-soak-curve-s" x="70" y="130.7" text-anchor="end">20</text><line class="unity-thermal-soak-curve-g" x1="80" y1="60.0" x2="600" y2="60.0"/><text class="unity-thermal-soak-curve-s" x="70" y="64.0" text-anchor="end">30</text><text class="unity-thermal-soak-curve-s" x="80" y="280" text-anchor="middle">0</text><text class="unity-thermal-soak-curve-s" x="210" y="280" text-anchor="middle">5</text><text class="unity-thermal-soak-curve-s" x="340" y="280" text-anchor="middle">10</text><text class="unity-thermal-soak-curve-s" x="470" y="280" text-anchor="middle">15</text><text class="unity-thermal-soak-curve-s" x="600" y="280" text-anchor="middle">20</text>
<line x1="80" y1="148.7" x2="600" y2="148.7" stroke="var(--fig-warn)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="unity-thermal-soak-curve-s" x="596" y="142.7" text-anchor="end">16.7 ms = 60 fps</text>
<path class="unity-thermal-soak-curve-base unity-thermal-soak-curve-a" d="M80 148.7 L132 148.7 C171 148.7 197 93.3 236 93.3 L600 93.3"/><path class="unity-thermal-soak-curve-draw unity-thermal-soak-curve-a" pathLength="100" d="M80 148.7 L132 148.7 C171 148.7 197 93.3 236 93.3 L600 93.3"/>
<path class="unity-thermal-soak-curve-base unity-thermal-soak-curve-b" d="M80 186.7 L184 186.7 C230.79999999999998 186.7 267.20000000000005 163.3 314 163.3 L600 163.3"/><path class="unity-thermal-soak-curve-draw unity-thermal-soak-curve-b" pathLength="100" d="M80 186.7 L184 186.7 C230.79999999999998 186.7 267.20000000000005 163.3 314 163.3 L600 163.3"/>
<text class="unity-thermal-soak-curve-bt" x="596" y="83.3" text-anchor="end">no headroom: 16.7 → 25 ms (60 → 40 fps)</text>
<text class="unity-thermal-soak-curve-ot" x="596" y="183.3" text-anchor="end">11 ms budget: still under 16.7</text>
<text class="unity-thermal-soak-curve-m" x="249" y="123.3">SoC heats, clocks drop</text>
<text class="unity-thermal-soak-curve-m" x="340" y="306" text-anchor="middle">minutes of sustained play</text>
<text class="unity-thermal-soak-curve-m" transform="translate(28 160) rotate(-90)" text-anchor="middle">frame time (ms)</text>
</svg>
