<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A body moving under physics: with interpolation None it jumps once per 0.02 s fixed step; with Interpolate it glides between poses one step behind. Below, fixed steps every 20 ms against frames at 144 fps.">
<style>
.unity-rb-interpolate-lanes-t{font-size:14px;font-weight:600;fill:var(--fig-ink)}
.unity-rb-interpolate-lanes-m{font-size:13px;fill:var(--fig-muted)}
.unity-rb-interpolate-lanes-s{font-size:12px;fill:var(--fig-muted)}
.unity-rb-interpolate-lanes-tr{stroke:var(--fig-line);stroke-width:2;stroke-linecap:round}
.unity-rb-interpolate-lanes-pose{fill:var(--fig-line)}
.unity-rb-interpolate-lanes-b1{fill:var(--fig-bad);animation:unity-rb-interpolate-lanes-step 4s steps(8,end) infinite}
.unity-rb-interpolate-lanes-b2{fill:var(--fig-accent);animation:unity-rb-interpolate-lanes-lin 4s linear infinite}
.unity-rb-interpolate-lanes-ph{fill:var(--fig-accent2)}
.unity-rb-interpolate-lanes-fr{stroke:var(--fig-ink);stroke-opacity:.55;stroke-width:1.5}
@keyframes unity-rb-interpolate-lanes-step{from{transform:translateX(0)}to{transform:translateX(480px)}}
@keyframes unity-rb-interpolate-lanes-lin{0%,12.5%{transform:translateX(0)}100%{transform:translateX(420px)}}
</style>
<text class="unity-rb-interpolate-lanes-t" x="20" y="67">None</text>
<text class="unity-rb-interpolate-lanes-t" x="20" y="125">Interpolate</text>
<line class="unity-rb-interpolate-lanes-tr" x1="150" y1="62" x2="570" y2="62"/>
<line class="unity-rb-interpolate-lanes-tr" x1="150" y1="120" x2="570" y2="120"/>
<circle class="unity-rb-interpolate-lanes-pose" cx="150" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="150" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="210" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="210" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="270" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="270" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="330" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="330" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="390" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="390" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="450" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="450" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="510" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="510" cy="120" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="570" cy="62" r="3.5"/><circle class="unity-rb-interpolate-lanes-pose" cx="570" cy="120" r="3.5"/>
<circle class="unity-rb-interpolate-lanes-b1" cx="150" cy="62" r="9"/>
<circle class="unity-rb-interpolate-lanes-b2" cx="150" cy="120" r="9"/>
<text class="unity-rb-interpolate-lanes-s" x="150" y="90">same physics pose drawn on several frames: stutter</text>
<text class="unity-rb-interpolate-lanes-s" x="150" y="148">between previous and current pose, up to one step behind</text>
<line x1="20" y1="170" x2="620" y2="170" stroke="var(--fig-line)" stroke-width="1"/>
<text class="unity-rb-interpolate-lanes-m" x="20" y="204">Fixed step</text>
<text class="unity-rb-interpolate-lanes-m" x="20" y="248">Frame (144 fps)</text>
<line class="unity-rb-interpolate-lanes-tr" x1="130" y1="200" x2="590" y2="200"/>
<line class="unity-rb-interpolate-lanes-tr" x1="130" y1="244" x2="590" y2="244"/>
<rect class="unity-rb-interpolate-lanes-ph" x="126" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="130" y="278" text-anchor="middle">0</text><rect class="unity-rb-interpolate-lanes-ph" x="218" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="222" y="278" text-anchor="middle">20</text><rect class="unity-rb-interpolate-lanes-ph" x="310" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="314" y="278" text-anchor="middle">40</text><rect class="unity-rb-interpolate-lanes-ph" x="402" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="406" y="278" text-anchor="middle">60</text><rect class="unity-rb-interpolate-lanes-ph" x="494" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="498" y="278" text-anchor="middle">80</text><rect class="unity-rb-interpolate-lanes-ph" x="586" y="188" width="8" height="24" rx="3"/><text class="unity-rb-interpolate-lanes-s" x="590" y="278" text-anchor="middle">100 ms</text><line class="unity-rb-interpolate-lanes-fr" x1="130.0" y1="236" x2="130.0" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="161.9" y1="236" x2="161.9" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="193.9" y1="236" x2="193.9" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="225.8" y1="236" x2="225.8" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="257.8" y1="236" x2="257.8" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="289.7" y1="236" x2="289.7" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="321.6" y1="236" x2="321.6" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="353.6" y1="236" x2="353.6" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="385.5" y1="236" x2="385.5" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="417.5" y1="236" x2="417.5" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="449.4" y1="236" x2="449.4" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="481.3" y1="236" x2="481.3" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="513.3" y1="236" x2="513.3" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="545.2" y1="236" x2="545.2" y2="252"/><line class="unity-rb-interpolate-lanes-fr" x1="577.2" y1="236" x2="577.2" y2="252"/>
</svg>
