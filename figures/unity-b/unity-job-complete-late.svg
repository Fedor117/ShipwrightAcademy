<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="IJobParallelFor batches of 64 running on three worker threads. Completing late lets them overlap other main-thread work; calling Complete right after Schedule makes the main thread wait and the frame longer.">
<style>
.unity-job-complete-late-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
.unity-job-complete-late-l{font-size:13px;fill:var(--fig-muted)}
.unity-job-complete-late-e{font-size:12px;fill:var(--fig-ink)}
.unity-job-complete-late-n{font-size:11px;fill:var(--fig-ink)}
.unity-job-complete-late-bt{font-size:13px;fill:var(--fig-bad);font-weight:600}
.unity-job-complete-late-ot{font-size:13px;fill:var(--fig-ok);font-weight:600}
.unity-job-complete-late-mw{fill:var(--fig-accent);fill-opacity:.25;stroke:var(--fig-accent);stroke-width:1.5}
.unity-job-complete-late-wt{fill:var(--fig-warn);fill-opacity:.2;stroke:var(--fig-warn);stroke-width:1.5;stroke-dasharray:4 3}
.unity-job-complete-late-bj{fill:var(--fig-accent2);fill-opacity:.3;stroke:var(--fig-accent2);stroke-width:1.5;animation:unity-job-complete-late-bj 6s linear infinite backwards}
.unity-job-complete-late-k1{animation-delay:.5s}.unity-job-complete-late-k2{animation-delay:1s}.unity-job-complete-late-k3{animation-delay:1.5s}
@keyframes unity-job-complete-late-bj{0%{fill-opacity:.04;stroke-opacity:.3}5%,85%{fill-opacity:.3;stroke-opacity:1}95%,100%{fill-opacity:.04;stroke-opacity:.3}}
</style>
<text class="unity-job-complete-late-h" x="20" y="30">Complete() as late as possible</text>
<text class="unity-job-complete-late-l" x="20" y="61">Main</text><rect class="unity-job-complete-late-mw" x="130" y="44" width="20" height="24" rx="5"/><rect class="unity-job-complete-late-mw" x="152" y="44" width="238" height="24" rx="5"/><text class="unity-job-complete-late-e" x="162" y="60">other main-thread work</text><rect class="unity-job-complete-late-mw" x="392" y="44" width="10" height="24" rx="3"/>
<text class="unity-job-complete-late-l" x="20" y="89">Worker 1</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k0" x="152" y="76" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="171" y="89" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k1" x="192" y="76" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="211" y="89" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k2" x="232" y="76" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="251" y="89" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k3" x="272" y="76" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="291" y="89" text-anchor="middle">64</text>
<text class="unity-job-complete-late-l" x="20" y="111">Worker 2</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k0" x="152" y="98" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="171" y="111" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k1" x="192" y="98" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="211" y="111" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k2" x="232" y="98" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="251" y="111" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k3" x="272" y="98" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="291" y="111" text-anchor="middle">64</text>
