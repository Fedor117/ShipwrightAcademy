<text class="unity-job-complete-late-l" x="20" y="283">Worker 3</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k0" x="152" y="270" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="171" y="283" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k1" x="192" y="270" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="211" y="283" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k2" x="232" y="270" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="251" y="283" text-anchor="middle">64</text><rect class="unity-job-complete-late-bj unity-job-complete-late-k3" x="272" y="270" width="38" height="18" rx="4"/><text class="unity-job-complete-late-n" x="291" y="283" text-anchor="middle">64</text>
<line x1="550" y1="188" x2="550" y2="296" stroke="var(--fig-bad)" stroke-width="2"/><text class="unity-job-complete-late-bt" x="542" y="288" text-anchor="end">frame ends later</text><line x1="402" y1="224" x2="402" y2="296" stroke="var(--fig-muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
