<text class="unity-canvas-split-rebatch-bad" x="36" y="262">12 elements re-batched per tick</text>
<rect x="330" y="30" width="290" height="256" rx="12" fill="var(--fig-panel)" stroke="var(--fig-line)" stroke-width="1.5"/>
<text class="unity-canvas-split-rebatch-h" x="346" y="56">Split by update rate</text>
<rect class="unity-canvas-split-rebatch-cv" x="344" y="96" width="184" height="138" rx="10"/><text class="unity-canvas-split-rebatch-s" x="344" y="88">StaticFrame</text>
