<rect class="unity-canvas-split-rebatch-es" x="352" y="190" width="52" height="32" rx="8"/>
<rect class="unity-canvas-split-rebatch-es" x="410" y="190" width="52" height="32" rx="8"/>
<rect class="unity-canvas-split-rebatch-es" x="468" y="190" width="52" height="32" rx="8"/>
<rect class="unity-canvas-split-rebatch-ed" x="542" y="190" width="52" height="32" rx="8"/><rect class="unity-canvas-split-rebatch-fl" x="542" y="190" width="52" height="32" rx="8"/><text class="unity-canvas-split-rebatch-e" x="568" y="211" text-anchor="middle">HP</text>
<text class="unity-canvas-split-rebatch-ok" x="346" y="262">3 elements re-batched per tick</text>
