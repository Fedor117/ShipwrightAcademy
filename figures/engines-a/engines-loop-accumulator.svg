<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-label="Accumulator timeline: five render frames of 20, 12, 38, 12 and 15 ms; the accumulator collects each frameTime and drains it in fixed 16.7 ms steps, so frames run 1, 0, 3, 0 and 1 simulation steps and the remainder becomes the interpolation alpha"><style>.engines-loop-accumulator-t{font-size:13px;fill:var(--fig-ink)}.engines-loop-accumulator-m{font-size:13px;fill:var(--fig-muted)}.engines-loop-accumulator-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-loop-accumulator-c{text-anchor:middle}.engines-loop-accumulator-e{text-anchor:end}.engines-loop-accumulator-b0{animation:engines-loop-accumulator-kb0 7s linear infinite}@keyframes engines-loop-accumulator-kb0{0%{opacity:1}3%,20%{opacity:0}20.1%,100%{opacity:1}}.engines-loop-accumulator-c0{animation:engines-loop-accumulator-kc0 7s linear infinite}@keyframes engines-loop-accumulator-kc0{0%{fill-opacity:0}3%,22.1%{fill-opacity:0.6}27.1%,100%{fill-opacity:0}}.engines-loop-accumulator-f0{animation:engines-loop-accumulator-kf0 7s linear infinite}@keyframes engines-loop-accumulator-kf0{0%{opacity:1}3%,22.1%{opacity:0.15}27.1%,100%{opacity:1}}.engines-loop-accumulator-b1{animation:engines-loop-accumulator-kb1 7s linear infinite}@keyframes engines-loop-accumulator-kb1{0%{opacity:1}3%,29.6%{opacity:0}29.7%,100%{opacity:1}}.engines-loop-accumulator-b2{animation:engines-loop-accumulator-kb2 7s linear infinite}@keyframes engines-loop-accumulator-kb2{0%{opacity:1}3%,60.2%{opacity:0}60.3%,100%{opacity:1}}.engines-loop-accumulator-c2{animation:engines-loop-accumulator-kc2 7s linear infinite}@keyframes engines-loop-accumulator-kc2{0%{fill-opacity:0}3%,62.3%{fill-opacity:0.6}67.3%,100%{fill-opacity:0}}.engines-loop-accumulator-f2{animation:engines-loop-accumulator-kf2 7s linear infinite}@keyframes engines-loop-accumulator-kf2{0%{opacity:1}3%,62.3%{opacity:0.15}67.3%,100%{opacity:1}}.engines-loop-accumulator-b3{animation:engines-loop-accumulator-kb3 7s linear infinite}@keyframes engines-loop-accumulator-kb3{0%{opacity:1}3%,69.8%{opacity:0}69.9%,100%{opacity:1}}.engines-loop-accumulator-b4{animation:engines-loop-accumulator-kb4 7s linear infinite}@keyframes engines-loop-accumulator-kb4{0%{opacity:1}3%,81.9%{opacity:0}82%,100%{opacity:1}}.engines-loop-accumulator-c4{animation:engines-loop-accumulator-kc4 7s linear infinite}@keyframes engines-loop-accumulator-kc4{0%{fill-opacity:0}3%,84%{fill-opacity:0.6}89%,100%{fill-opacity:0}}.engines-loop-accumulator-f4{animation:engines-loop-accumulator-kf4 7s linear infinite}@keyframes engines-loop-accumulator-kf4{0%{opacity:1}3%,84%{opacity:0.15}89%,100%{opacity:1}}.engines-loop-accumulator-ph{animation:engines-loop-accumulator-run 7s linear infinite}@keyframes engines-loop-accumulator-run{0%,3%{transform:translateX(0);opacity:0}4%{opacity:1}82%{transform:translateX(543.2px);opacity:1}88%,100%{transform:translateX(543.2px);opacity:0}}</style><text class="engines-loop-accumulator-h" x="40" y="24">Render frames, variable frameTime</text><rect x="41" y="34" width="110" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.25"/><text class="engines-loop-accumulator-t engines-loop-accumulator-c" x="96" y="53">20 ms</text><rect x="153" y="34" width="65.2" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.45"/><text class="engines-loop-accumulator-t engines-loop-accumulator-c" x="185.6" y="53">12 ms</text><rect x="220.2" y="34" width="210.8" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.25"/><text class="engines-loop-accumulator-t engines-loop-accumulator-c" x="325.6" y="53">38 ms</text><rect x="433" y="34" width="65.2" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.45"/><text class="engines-loop-accumulator-t engines-loop-accumulator-c" x="465.6" y="53">12 ms</text><rect x="500.2" y="34" width="82" height="28" rx="6" fill="var(--fig-accent)" fill-opacity="0.25"/><text class="engines-loop-accumulator-t engines-loop-accumulator-c