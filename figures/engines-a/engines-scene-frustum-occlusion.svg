<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" role="img" aria-label="Top-down view of a camera frustum with nine objects: four outside the frustum are culled, two inside it are hidden behind a wall and removed by occlusion culling, and three are drawn"><style>.engines-scene-frustum-occlusion-t{font-size:13px;fill:var(--fig-ink)}.engines-scene-frustum-occlusion-m{font-size:13px;fill:var(--fig-muted)}.engines-scene-frustum-occlusion-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-scene-frustum-occlusion-c{text-anchor:middle}.engines-scene-frustum-occlusion-e{text-anchor:end}.engines-scene-frustum-occlusion-f{animation:engines-scene-frustum-occlusion-kf 7s ease-in-out infinite}@keyframes engines-scene-frustum-occlusion-kf{0%{opacity:0}3%,24%{opacity:1}32%,100%{opacity:0}}.engines-scene-frustum-occlusion-o{animation:engines-scene-frustum-occlusion-ko 7s ease-in-out infinite}@keyframes engines-scene-frustum-occlusion-ko{0%{opacity:0}3%,50%{opacity:1}58%,100%{opacity:0}}.engines-scene-frustum-occlusion-sh{animation:engines-scene-frustum-occlusion-ks 7s ease-in-out infinite}@keyframes engines-scene-frustum-occlusion-ks{0%{opacity:1}3%,42%{opacity:0}50%,100%{opacity:1}}</style><path d="M50 196L540 56L540 336Z" fill="var(--fig-accent)" fill-opacity="0.08" stroke="var(--fig-accent)" stroke-width="1.5" stroke-linejoin="round"/><line x1="80" y1="187.4" x2="80" y2="204.6" stroke="var(--fig-accent)" stroke-width="1.5"/><path class="engines-scene-frustum-occlusion-sh" d="M330 156L540 126L540 248.5L330 226Z" fill="var(--fig-warn)" fill-opacity="0.14"/><rect x="326" y="156" width="10" height="70" rx="3" fill="var(--fig-ink)"/><text class="engines-scene-frustum-occlusion-t" x="344" y="150">wall (occluder)</text><path d="M32 184h22l10 12l-10 12h-22z" fill="var(--fig-ink)"/><text class="engines-scene-frustum-occlusion-t engines-scene-frustum-occlusion-c" x="50" y="236">camera</text><circle cx="250" cy="170" r="11" fill="var(--fig-ok)" fill-opacity="0.85"/>