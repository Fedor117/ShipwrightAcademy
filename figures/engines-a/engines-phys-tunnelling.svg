<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="A bullet moving 2 m per step jumps from before a 0.1 m fence to after it and is never seen overlapping it; with continuous collision detection the swept path hits the fence at about 0.46 of the step"><style>.engines-phys-tunnelling-t{font-size:13px;fill:var(--fig-ink)}.engines-phys-tunnelling-m{font-size:13px;fill:var(--fig-muted)}.engines-phys-tunnelling-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-phys-tunnelling-c{text-anchor:middle}.engines-phys-tunnelling-e{text-anchor:end}.engines-phys-tunnelling-db{animation:engines-phys-tunnelling-d 6s linear infinite}@keyframes engines-phys-tunnelling-d{0%{transform:translateX(480px)}3%,24.9%{transform:translateX(0)}25%,49.9%{transform:translateX(160px)}50%,74.9%{transform:translateX(320px)}75%,100%{transform:translateX(480px)}}.engines-phys-tunnelling-cb{animation:engines-phys-tunnelling-b 6s linear infinite}@keyframes engines-phys-tunnelling-b{0%{transform:translateX(233px)}3%{transform:translateX(0)}39.4%,100%{transform:translateX(233px)}}.engines-phys-tunnelling-hit{transform-box:fill-box;transform-origin:center;animation:engines-phys-tunnelling-h 6s ease-out infinite}@keyframes engines-phys-tunnelling-h{0%{opacity:1;transform:scale(1)}3%,39.4%{opacity:0;transform:scale(0.4)}42.4%{opacity:1;transform:scale(1.2)}47.4%,100%{opacity:1;transform:scale(1)}}</style><text class="engines-phys-tunnelling-h" x="24" y="24">Discrete: test only at step positions</text><text class="engines-phys-tunnelling-t engines-phys-tunnelling-e" x="616" y="24" style="fill:var(--fig-bad)">never overlaps: tunnels</text><text class="engines-phys-tunnelling-m engines-phys-tunnelling-c" x="304" y="42">fence 0.1 m</text><line x1="40" y1="74" x2="600" y2="74" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="2 4"/><rect x="300" y="48" width="8" height="52" rx="2" fill="var(--fig-ink)"/><circle cx="60" cy="74" r="6.25" fill="none" stroke="va