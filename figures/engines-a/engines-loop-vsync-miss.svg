<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" role="img" aria-label="Vsync timeline at 60 Hz: frame B takes 17 ms, misses its vsync by 0.4 ms, so frame A stays on screen for two refreshes, 33.3 ms"><style>.engines-loop-vsync-miss-t{font-size:13px;fill:var(--fig-ink)}.engines-loop-vsync-miss-m{font-size:13px;fill:var(--fig-muted)}.engines-loop-vsync-miss-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}.engines-loop-vsync-miss-c{text-anchor:middle}.engines-loop-vsync-miss-e{text-anchor:end}.engines-loop-vsync-miss-ph{animation:engines-loop-vsync-miss-scan 6s linear infinite}@keyframes engines-loop-vsync-miss-scan{0%{transform:translateX(0);opacity:0}3%{opacity:1}85%{transform:translateX(550px);opacity:1}90%,100%{transform:translateX(550px);opacity:0}}.engines-loop-vsync-miss-rep{animation:engines-loop-vsync-miss-blink 6s linear infinite}@keyframes engines-loop-vsync-miss-blink{0%,30%{fill-opacity:0.35}34%,48%{fill-opacity:0.7}52%,100%{fill-opacity:0.35}}</style><text class="engines-loop-vsync-miss-h" x="50" y="24">Frame work (CPU + GPU), vsync on at 60 Hz</text><line x1="50" y1="32" x2="50" y2="70" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="50" y1="130" x2="50" y2="168" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="141.7" y1="32" x2="141.7" y2="70" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="141.7" y1="130" x2="141.7" y2="168" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="233.3" y1="32" x2="233.3" y2="70" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="233.3" y1="130" x2="233.3" y2="168" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="325" y1="32" x2="325" y2="70" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="325" y1="130" x2="325" y2="168" stroke="var(--fig-line)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="416.7" y1